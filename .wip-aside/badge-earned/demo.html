<div class="be" data-badge-earned data-state="idle">
  <header class="be__header">
    <h2 class="be__title" id="be-title">VECTOR TRIAL</h2>
    <p class="be__status" aria-live="polite" data-be-status>
      <span class="be__status-clip">
        <span class="be__status-from">INCOMPLETE</span>
        <span class="be__status-to">EARNED</span>
      </span>
    </p>
  </header>

  <div class="be__stage" data-be-stage>
    <div class="be__badge" data-be-badge aria-hidden="true">
      <!-- Ghost outline of final asymmetric hull -->
      <svg
        class="be__ghost"
        data-be-ghost
        viewBox="0 0 100 100"
        width="100"
        height="100"
        focusable="false"
      >
        <polygon
          class="be__ghost-path"
          points="18,12 72,8 92,38 84,62 78,88 28,94 8,48"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
        />
      </svg>

      <p class="be__locked" data-be-locked>LOCKED</p>

      <!-- Exactly six primary polygons -->
      <svg
        class="be__mark"
        data-be-mark
        viewBox="0 0 100 100"
        width="100"
        height="100"
        focusable="false"
      >
        <polygon
          class="be__piece be__piece--1"
          data-piece="1"
          points="18,12 72,8 92,38 84,62 78,88 28,94 8,48"
          fill="#172024"
        />
        <polygon
          class="be__piece be__piece--2"
          data-piece="2"
          points="28,22 68,18 78,42 62,72 32,76 22,48"
          fill="#f2eedc"
        />
        <polygon
          class="be__piece be__piece--3"
          data-piece="3"
          points="24,40 74,32 80,48 28,56"
          fill="#d3a842"
        />
        <polygon
          class="be__piece be__piece--4"
          data-piece="4"
          points="58,52 84,46 76,78 52,82"
          fill="#6fa889"
        />
        <polygon
          class="be__piece be__piece--5"
          data-piece="5"
          points="48,10 70,16 62,34 42,28"
          fill="#cf6655"
        />
        <polygon
          class="be__piece be__piece--6"
          data-piece="6"
          points="8,36 26,28 30,52 12,62"
          fill="#d3a842"
        />

        <polygon
          class="be__seam"
          data-be-seam
          points="46,44 54,44 56,52 50,58 44,52"
          fill="#f2eedc"
        />
      </svg>

      <!-- Exactly eight completion rays -->
      <div class="be__rays" data-be-rays aria-hidden="true">
        <span class="be__ray be__ray--n" data-ray-pair="tb"></span>
        <span class="be__ray be__ray--s" data-ray-pair="tb"></span>
        <span class="be__ray be__ray--e" data-ray-pair="lr"></span>
        <span class="be__ray be__ray--w" data-ray-pair="lr"></span>
        <span class="be__ray be__ray--ne" data-ray-pair="d1"></span>
        <span class="be__ray be__ray--sw" data-ray-pair="d1"></span>
        <span class="be__ray be__ray--nw" data-ray-pair="d2"></span>
        <span class="be__ray be__ray--se" data-ray-pair="d2"></span>
      </div>
    </div>
  </div>

  <p class="be__sr" data-be-sr>
    VECTOR TRIAL achievement incomplete. Badge locked.
  </p>

  <div class="be__actions">
    <button type="button" class="be__btn be__btn--go" data-be-complete>
      COMPLETE TRIAL
    </button>
    <button type="button" class="be__btn be__btn--reset" data-be-reset hidden>
      RESET
    </button>
  </div>

  <p class="be__live" role="status" aria-live="polite" data-be-live>
    VECTOR TRIAL incomplete. Press COMPLETE TRIAL to earn the badge.
  </p>
</div>
