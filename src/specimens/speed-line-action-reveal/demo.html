<div class="slar" data-slar data-phase="idle">
  <p class="slar__live" data-slar-live aria-live="polite">Target concealed.</p>

  <div class="slar__stage" data-slar-stage>
    <div class="slar__lines" aria-hidden="true">
      <span class="slar__line slar__line--a"></span>
      <span class="slar__line slar__line--b"></span>
      <span class="slar__line slar__line--c"></span>
      <span class="slar__line slar__line--d"></span>
      <span class="slar__line slar__line--e"></span>
      <span class="slar__line slar__line--f"></span>
    </div>

    <div class="slar__reveal" data-slar-reveal>
      <p class="slar__eyebrow">SCAN // RESULT</p>
      <p class="slar__headline">TARGET</p>
      <p class="slar__sub">Acquisition complete.</p>
    </div>
  </div>

  <div class="slar__controls">
    <button type="button" class="slar__btn slar__btn--primary" data-slar-activate>Activate</button>
    <button type="button" class="slar__btn" data-slar-replay>Replay</button>
  </div>
</div>
