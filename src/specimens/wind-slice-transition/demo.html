<div class="wst1" data-wst1 data-phase="idle">
  <p class="wst1__live" data-wst1-live aria-live="polite">Wind Slice Transition. Idle.</p>
  <p class="wst1__system">NR // NR-115</p>
  <div class="wst1__stage" data-wst1-stage>
    <div class="wst1__viz" data-wst1-viz aria-hidden="true">
      <span class="wst1__mark wst1__mark--a"></span>
      <span class="wst1__mark wst1__mark--b"></span>
      <span class="wst1__mark wst1__mark--c"></span>
    </div>
    <p class="wst1__status" data-wst1-status>IDLE</p>
    <p class="wst1__note" data-wst1-note>Sharp slice planes cut across to reveal the next state.</p>
  </div>
  <div class="wst1__controls">
    <button type="button" class="wst1__btn wst1__btn--primary" data-wst1-run>Slice</button>
    <button type="button" class="wst1__btn" data-wst1-replay>Replay</button>
  </div>
</div>
