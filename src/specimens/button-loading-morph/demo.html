<div class="blm" data-button-loading-morph data-phase="idle">
  <button class="blm__btn" type="button" data-blm-btn>
    <span class="blm__label" data-blm-label>Save changes</span>
    <span class="blm__loader" data-blm-loader hidden aria-hidden="true">
      <svg class="blm__arc" viewBox="0 0 24 24" width="20" height="20">
        <circle class="blm__arc-track" cx="12" cy="12" r="9" fill="none" stroke-width="2.5" />
        <circle class="blm__arc-progress" cx="12" cy="12" r="9" fill="none" stroke-width="2.5" />
      </svg>
    </span>
    <span class="blm__check" data-blm-check hidden aria-hidden="true"></span>
    <span class="blm__saved" data-blm-saved hidden>Saved</span>
  </button>
  <p class="blm__status" role="status" aria-live="polite" data-blm-status>
    Activate Save changes to begin loading morph.
  </p>
</div>
