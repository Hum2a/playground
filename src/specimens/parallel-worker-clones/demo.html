<div class="pwc2" data-pwc2 data-phase="idle">
  <p class="pwc2__live" data-pwc2-live aria-live="polite">Parallel Worker Clones. Idle.</p>
  <p class="pwc2__system">NR // NR-051</p>
  <div class="pwc2__stage" data-pwc2-stage>
    <div class="pwc2__viz" data-pwc2-viz aria-hidden="true">
      <span class="pwc2__mark pwc2__mark--a"></span>
      <span class="pwc2__mark pwc2__mark--b"></span>
      <span class="pwc2__mark pwc2__mark--c"></span>
    </div>
    <p class="pwc2__status" data-pwc2-status>IDLE</p>
    <p class="pwc2__note" data-pwc2-note>A job divides into workers that show parallel progress bars.</p>
  </div>
  <div class="pwc2__controls">
    <button type="button" class="pwc2__btn pwc2__btn--primary" data-pwc2-run>Split</button>
    <button type="button" class="pwc2__btn" data-pwc2-replay>Replay</button>
  </div>
</div>
