<div class="smc" data-shape-morph-button-to-card data-phase="compact">
  <div class="smc__stage">
    <button type="button" class="smc__container" data-smc-container aria-expanded="false">
      <span class="smc__label" data-smc-label>Details</span>
      <div class="smc__body" data-smc-body hidden>
        <p class="smc__heading" data-smc-heading>Details</p>
        <p class="smc__copy">
          Compact action expands into an information card. Supporting metrics and
          secondary copy appear after the shape morph completes.
        </p>
        <dl class="smc__meta">
          <div><dt>Status</dt><dd>Active</dd></div>
          <div><dt>Updated</dt><dd>Today</dd></div>
        </dl>
        <button type="button" class="smc__close" data-smc-close>Close</button>
      </div>
    </button>
  </div>

  <p class="smc__status" role="status" aria-live="polite" data-smc-status>
    Tap Details to morph the pill into a 320×220 information card.
  </p>
</div>
