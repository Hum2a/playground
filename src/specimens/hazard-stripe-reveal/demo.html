<div class="hsr" data-hsr data-phase="covered">
  <p class="hsr__live" data-hsr-live aria-live="polite">Content covered by hazard stripes.</p>

  <div class="hsr__stage">
    <div class="hsr__content">
      <span class="hsr__tag">UNLOCKED</span>
      <p class="hsr__copy">New content available</p>
    </div>
    <div class="hsr__stripes" data-hsr-stripes aria-hidden="true"></div>
  </div>

  <button type="button" class="hsr__btn" data-hsr-reveal>Reveal content</button>
</div>
