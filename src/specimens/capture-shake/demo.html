<div class="capture-shake" data-capture-shake data-state="idle">
  <p class="capture-shake__target-meta" data-cs-meta>SPECIMEN // UNKNOWN</p>

  <div class="capture-shake__stage">
    <div class="capture-shake__target" data-cs-target aria-hidden="true">
      <span class="capture-shake__target-core"></span>
    </div>

    <div class="capture-shake__device" data-cs-device aria-hidden="true">
      <span class="capture-shake__half capture-shake__half--upper" data-cs-upper></span>
      <span class="capture-shake__half capture-shake__half--lower" data-cs-lower></span>
      <span class="capture-shake__seam" aria-hidden="true"></span>
      <span class="capture-shake__diamond" data-cs-diamond></span>
    </div>

    <div class="capture-shake__stars" data-cs-stars aria-hidden="true">
      <span class="cs-star cs-star--1"></span>
      <span class="cs-star cs-star--2"></span>
      <span class="cs-star cs-star--3"></span>
    </div>
  </div>

  <p class="capture-shake__status" data-cs-status aria-live="polite">
    <span class="capture-shake__status-clip" data-cs-status-clip>
      <span class="capture-shake__status-word" data-cs-word-idle>UNRESOLVED</span>
      <span
        class="capture-shake__status-word capture-shake__status-word--done"
        data-cs-word-done
        aria-hidden="true"
      >CAPTURED</span>
    </span>
  </p>

  <div class="capture-shake__controls">
    <button type="button" class="capture-shake__btn" data-cs-capture>CAPTURE</button>
    <button type="button" class="capture-shake__btn capture-shake__btn--ghost" data-cs-reset hidden>RESET</button>
  </div>
</div>
