<div class="fde" data-fde data-phase="calm">
  <p class="fde__live" data-fde-live aria-live="polite">Deadline distant. Visibility clear.</p>

  <div class="fde__card">
    <div class="fde__header">
      <span class="fde__label">Case File</span>
      <span class="fde__days" data-fde-days>14 days left</span>
    </div>
    <p class="fde__copy">Investigation progress obscured as the deadline closes in.</p>
    <div class="fde__meter">
      <div class="fde__meter-fill" data-fde-meter></div>
    </div>
    <div class="fde__fog" data-fde-fog aria-hidden="true"></div>
    <div class="fde__warning" data-fde-warning aria-hidden="true"></div>
  </div>

  <label class="fde__control">
    <span class="fde__control-label">Days remaining</span>
    <input
      type="range"
      class="fde__range"
      data-fde-range
      min="0"
      max="14"
      value="14"
      aria-valuemin="0"
      aria-valuemax="14"
      aria-valuenow="14"
      aria-label="Days remaining until deadline"
    />
  </label>
</div>
