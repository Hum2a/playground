<div class="gdd" data-gadget-deployment data-phase="idle">
  <div class="gdd__host">
    <button type="button" class="gdd__tile" data-gdd-tile aria-expanded="false">
      <span class="gdd__tile-face">
        <span class="gdd__icon" aria-hidden="true"></span>
        <span class="gdd__tile-label">GRAPPLE</span>
      </span>
      <div class="gdd__deploy" data-gdd-deploy hidden>
        <p class="gdd__deploy-title">GRAPPLE UNIT</p>
        <div class="gdd__controls">
          <button type="button" class="gdd__ctrl" data-gdd-fire>FIRE</button>
          <button type="button" class="gdd__ctrl" data-gdd-reel>REEL</button>
        </div>
        <p class="gdd__status" data-gdd-status>STATUS — READY</p>
      </div>
    </button>
  </div>
  <button type="button" class="gdd__btn" data-gdd-run>DEPLOY</button>
  <button type="button" class="gdd__btn gdd__btn--ghost" data-gdd-reset hidden>RESET</button>
  <p class="gdd__live" role="status" aria-live="polite" data-gdd-live>Gadget stowed.</p>
</div>
