<div class="wcd0" data-wcd0 data-phase="idle">
  <p class="wcd0__live" data-wcd0-live aria-live="polite">Wire Connection Draw. Idle.</p>
  <p class="wcd0__system">NR // NR-084</p>
  <div class="wcd0__stage" data-wcd0-stage>
    <div class="wcd0__viz" data-wcd0-viz aria-hidden="true">
      <span class="wcd0__mark wcd0__mark--a"></span>
      <span class="wcd0__mark wcd0__mark--b"></span>
      <span class="wcd0__mark wcd0__mark--c"></span>
    </div>
    <p class="wcd0__status" data-wcd0-status>IDLE</p>
    <p class="wcd0__note" data-wcd0-note>A thin wire line rapidly connects two selected nodes.</p>
  </div>
  <div class="wcd0__controls">
    <button type="button" class="wcd0__btn wcd0__btn--primary" data-wcd0-run>Connect</button>
    <button type="button" class="wcd0__btn" data-wcd0-replay>Replay</button>
  </div>
</div>
