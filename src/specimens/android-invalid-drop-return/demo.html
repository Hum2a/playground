<div class="aidr" data-android-invalid-drop-return data-phase="idle">
  <div class="aidr__stage" data-aidr-stage>
    <div class="aidr__source-wrap" data-aidr-source-wrap>
      <article class="aidr__card" data-aidr-source tabindex="0" aria-label="Task card source">
        <span class="aidr__card-icon" aria-hidden="true"></span>
        <span class="aidr__card-title">TASK // REVIEW</span>
        <span class="aidr__card-meta">Due today</span>
      </article>
      <div class="aidr__placeholder" data-aidr-placeholder hidden aria-hidden="true"></div>
    </div>

    <div class="aidr__targets">
      <div class="aidr__target aidr__target--valid" data-aidr-valid aria-label="Valid inbox target">
        <span>INBOX</span>
      </div>
      <div class="aidr__target aidr__target--invalid" data-aidr-invalid aria-label="Invalid archive locked target">
        <span>LOCKED</span>
      </div>
    </div>

    <div class="aidr__proxy" data-aidr-proxy hidden aria-hidden="true">
      <span class="aidr__proxy-title">TASK // REVIEW</span>
    </div>
  </div>

  <p class="aidr__status" role="status" aria-live="polite" data-aidr-status>
    Drag task card to INBOX or LOCKED.
  </p>
</div>
