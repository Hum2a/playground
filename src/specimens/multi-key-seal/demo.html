  <div class="mks4__stage" data-mks4-stage>
    <div class="mks4__viz" data-mks4-viz aria-hidden="true">
      <span class="mks4__mark mks4__mark--a"></span>
      <span class="mks4__mark mks4__mark--b"></span>
      <span class="mks4__mark mks4__mark--c"></span>
