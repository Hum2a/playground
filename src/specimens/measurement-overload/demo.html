<div class="mo" data-measurement-overload data-state="idle" data-phase="idle">
  <header class="mo__head">
    <p class="mo__title">ANALYSER // MK-4</p>
    <p class="mo__range">Supported: <span>0 — 9,999</span></p>
  </header>

  <div class="mo__stage">
    <div class="mo__frame" data-mo-frame>
      <span class="mo__edge mo__edge--l" aria-hidden="true" data-mo-edge></span>
      <span class="mo__edge mo__edge--r" aria-hidden="true" data-mo-edge></span>
      <span class="mo__vline" aria-hidden="true" data-mo-vline></span>
      <span class="mo__fracture" aria-hidden="true" data-mo-fracture></span>

      <span class="mo__frag mo__frag--1" aria-hidden="true"></span>
      <span class="mo__frag mo__frag--2" aria-hidden="true"></span>
      <span class="mo__frag mo__frag--3" aria-hidden="true"></span>

      <p class="mo__digits" data-mo-digits aria-hidden="true">0000</p>
    </div>

    <p class="mo__status" data-mo-status></p>
  </div>

  <p class="mo__sr" data-mo-sr>
    Analyser ready. Supported range 0 to 9,999.
  </p>

  <div class="mo__actions">
    <button type="button" class="mo__btn mo__btn--go" data-mo-measure>
      MEASURE
    </button>
    <button type="button" class="mo__btn mo__btn--reset" data-mo-reset hidden>
      RESET
    </button>
  </div>

  <p class="mo__live" role="status" aria-live="polite" data-mo-live>
    Analyser ready.
  </p>
</div>
