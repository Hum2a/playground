<div class="ps" data-ps="system-notification-slide">
  <p class="ps__eyebrow">System Notification Slide</p>
  <div class="ps__stage sns__stage">
    <div class="sns__body" aria-hidden="true"><span>HOME</span></div>
    <div class="ps__notify sns__notify" data-sns-notify hidden role="status">
      <span class="sns__icon" aria-hidden="true"></span>
      <span class="sns__text">Download complete</span>
    </div>
  </div>
  <button type="button" class="ps__btn" data-sns-show>SHOW NOTIFICATION</button>
  <p class="ps__status" data-sns-status aria-live="polite">Idle — no system toast.</p>
</div>
