<div class="ps acb" data-acb data-phase="idle">
  <p class="ps__live" data-acb-live aria-live="polite">Activity idle.</p>
  <p class="ps__eyebrow">ACTIVITY COMPLETE</p>
  <div class="acb__stage">
    <article class="acb__card" data-acb-card>
      <span class="acb__badge" aria-hidden="true">DONE</span>
      <h2 class="acb__title">Relay Sync</h2>
      <p class="acb__meta">All tasks finished</p>
    </article>
    <div class="acb__burst" data-acb-burst aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <button type="button" class="ps__btn" data-acb-run>Complete</button>
  <p class="ps__status" data-acb-status>Press Complete to trigger burst.</p>
</div>
