<div class="fbc" data-fbc data-phase="idle">
  <p class="fbc__live" data-fbc-live aria-live="polite">
    Charge idle. Target unconfirmed.
  </p>

  <p class="fbc__system">FLAME // COMMIT</p>

  <div class="fbc__stage" data-fbc-stage>
    <div class="fbc__track" data-fbc-track>
      <span class="fbc__node fbc__node--source" aria-hidden="true"></span>
      <span class="fbc__node fbc__node--target" data-fbc-target aria-hidden="true"></span>
      <span class="fbc__orb" data-fbc-orb aria-hidden="true"></span>
      <span class="fbc__impact" data-fbc-impact aria-hidden="true"></span>
    </div>
    <p class="fbc__status" data-fbc-status>IDLE</p>
    <p class="fbc__hint" data-fbc-hint>Press Run to charge and commit.</p>
  </div>

  <div class="fbc__controls">
    <button type="button" class="fbc__btn fbc__btn--primary" data-fbc-run>Run</button>
    <button type="button" class="fbc__btn" data-fbc-replay>Replay</button>
  </div>
</div>
