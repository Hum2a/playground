<div class="fc5" data-fc5 data-phase="idle">
  <p class="fc5__live" data-fc5-live aria-live="polite">Fireball Commit. Idle.</p>
  <p class="fc5__system">NR // NR-101</p>
  <div class="fc5__stage" data-fc5-stage>
    <div class="fc5__viz" data-fc5-viz aria-hidden="true">
      <span class="fc5__mark fc5__mark--a"></span>
      <span class="fc5__mark fc5__mark--b"></span>
      <span class="fc5__mark fc5__mark--c"></span>
    </div>
    <p class="fc5__status" data-fc5-status>IDLE</p>
    <p class="fc5__note" data-fc5-note>A charge grows then shoots into a target to confirm.</p>
  </div>
  <div class="fc5__controls">
    <button type="button" class="fc5__btn fc5__btn--primary" data-fc5-run>Commit</button>
    <button type="button" class="fc5__btn" data-fc5-replay>Replay</button>
  </div>
</div>
