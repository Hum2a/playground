<div class="nsd" data-notification-swipe-dismiss data-phase="idle">
  <div class="nsd__stack" data-nsd-stack>
    <div class="nsd__card-wrap" data-nsd-card-wrap>
      <div class="nsd__dismiss" data-nsd-dismiss aria-hidden="true">Dismiss</div>
      <div class="nsd__card" data-nsd-card tabindex="0" role="button" aria-label="Sync complete, swipe to dismiss">
        <span class="nsd__title">Sync complete</span>
        <span class="nsd__body">3 items uploaded to archive.</span>
      </div>
    </div>
    <div class="nsd__card-wrap">
      <div class="nsd__card nsd__card--static">
        <span class="nsd__title">Reminder</span>
        <span class="nsd__body">Review pending modules.</span>
      </div>
    </div>
    <div class="nsd__card-wrap">
      <div class="nsd__card nsd__card--static">
        <span class="nsd__title">Update</span>
        <span class="nsd__body">Patch 2.4 installed.</span>
      </div>
    </div>
    <div class="nsd__card-wrap">
      <div class="nsd__card nsd__card--static">
        <span class="nsd__title">Message</span>
        <span class="nsd__body">New comment on draft.</span>
      </div>
    </div>
  </div>

  <p class="nsd__status" role="status" aria-live="polite" data-nsd-status>
    Swipe the top notification horizontally. Commit at 45% width or velocity.
  </p>
</div>
