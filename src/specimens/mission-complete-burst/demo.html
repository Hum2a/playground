<div class="mcb" data-mission-complete data-phase="idle">
  <div class="mcb__stage">
    <div class="mcb__widgets" data-mcb-widgets>
      <div class="mcb__widget" data-mcb-w="0"><span>ALT</span><strong>12m</strong></div>
      <div class="mcb__widget" data-mcb-w="1"><span>SPD</span><strong>84</strong></div>
      <div class="mcb__widget" data-mcb-w="2"><span>OBJ</span><strong>3/3</strong></div>
      <div class="mcb__widget" data-mcb-w="3"><span>SIG</span><strong>STABLE</strong></div>
    </div>
    <div class="mcb__burst" data-mcb-burst aria-hidden="true">
      <p class="mcb__complete">COMPLETE</p>
      <p class="mcb__rank">RANK A</p>
    </div>
  </div>
  <button type="button" class="mcb__btn" data-mcb-run>FINALIZE</button>
  <button type="button" class="mcb__btn mcb__btn--ghost" data-mcb-reset hidden>RESET</button>
  <p class="mcb__live" role="status" aria-live="polite" data-mcb-live>Mission telemetry active.</p>
</div>
