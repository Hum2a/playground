<div class="smt" data-smt data-phase="idle" data-surface="a">
  <p class="smt__live" data-smt-live aria-live="polite">
    State one in view.
  </p>

  <p class="smt__system">SMOKE // TRANSITION</p>

  <div class="smt__stage" data-smt-stage>
    <div class="smt__host">
      <section class="smt__panel smt__panel--a" data-smt-panel="a">
        <p class="smt__kicker">STATE // 01</p>
        <p class="smt__title">IN VIEW</p>
      </section>
      <section class="smt__panel smt__panel--b" data-smt-panel="b" hidden>
        <p class="smt__kicker">STATE // 02</p>
        <p class="smt__title">CONCEALED</p>
      </section>

      <div class="smt__cloud" data-smt-cloud aria-hidden="true">
        <span class="smt__circle smt__circle--1"></span>
        <span class="smt__circle smt__circle--2"></span>
        <span class="smt__circle smt__circle--3"></span>
        <span class="smt__circle smt__circle--4"></span>
        <span class="smt__circle smt__circle--5"></span>
        <span class="smt__circle smt__circle--6"></span>
      </div>
    </div>

    <p class="smt__status" data-smt-status>STATE 01</p>
    <p class="smt__hint" data-smt-hint>Press Run to swap under cover.</p>
  </div>

  <div class="smt__controls">
    <button type="button" class="smt__btn smt__btn--primary" data-smt-run>Run</button>
    <button type="button" class="smt__btn" data-smt-replay>Replay</button>
  </div>
</div>
