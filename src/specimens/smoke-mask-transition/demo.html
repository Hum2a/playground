<div class="smt1" data-smt1 data-phase="idle">
  <p class="smt1__live" data-smt1-live aria-live="polite">Smoke Mask Transition. Idle.</p>
  <p class="smt1__system">NR // NR-096</p>
  <div class="smt1__stage" data-smt1-stage>
    <div class="smt1__viz" data-smt1-viz aria-hidden="true">
      <span class="smt1__mark smt1__mark--a"></span>
      <span class="smt1__mark smt1__mark--b"></span>
      <span class="smt1__mark smt1__mark--c"></span>
    </div>
    <p class="smt1__status" data-smt1-status>IDLE</p>
    <p class="smt1__note" data-smt1-note>Abstract smoke discs cover a content swap then disperse.</p>
  </div>
  <div class="smt1__controls">
    <button type="button" class="smt1__btn smt1__btn--primary" data-smt1-run>Swap</button>
    <button type="button" class="smt1__btn" data-smt1-replay>Replay</button>
  </div>
</div>
