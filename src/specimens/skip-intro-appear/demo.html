<div class="sia" data-skip-intro-appear data-phase="intro">
  <div class="sia__scene" aria-hidden="true">
    <p class="sia__scene-label" data-sia-label>INTRO</p>
    <button
      type="button"
      class="sia__skip"
      data-sia-skip
      aria-hidden="true"
      tabindex="-1"

  </div>
  <p class="sia__status" data-sia-status aria-live="polite">Intro playing — 00:00</p>
  <button type="button" class="sia__replay" data-sia-replay>REPLAY</button>
</div>
