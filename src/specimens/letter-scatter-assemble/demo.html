<div class="lsa" data-letter-scatter>
  <button type="button" class="lsa__trigger" data-letter-scatter-trigger>
    ASSEMBLE
  </button>

  <p class="lsa__sr-only">New material available</p>

  <div class="lsa__stage" aria-hidden="true">
    <div class="lsa__headline" data-letter-scatter-headline>
      <div class="lsa__line lsa__line--primary">
        <span class="lsa__letter lsa__letter--n">N</span>
        <span class="lsa__letter lsa__letter--e1">E</span>
        <span class="lsa__letter lsa__letter--w">W</span>
        <span class="lsa__gap"></span>
        <span class="lsa__letter lsa__letter--m">M</span>
        <span class="lsa__letter lsa__letter--a1">A</span>
        <span class="lsa__letter lsa__letter--t">T</span>
        <span class="lsa__letter lsa__letter--e2">E</span>
        <span class="lsa__letter lsa__letter--r">R</span>
        <span class="lsa__letter lsa__letter--i">I</span>
        <span class="lsa__letter lsa__letter--a2">A</span>
        <span class="lsa__letter lsa__letter--l1">L</span>
      </div>
      <div class="lsa__line lsa__line--secondary">
        <span class="lsa__letter lsa__letter--av-a1">A</span>
        <span class="lsa__letter lsa__letter--av-v">V</span>
        <span class="lsa__letter lsa__letter--av-a2">A</span>
        <span class="lsa__letter lsa__letter--av-i">I</span>
        <span class="lsa__letter lsa__letter--av-l1">L</span>
        <span class="lsa__letter lsa__letter--av-a3">A</span>
        <span class="lsa__letter lsa__letter--av-b">B</span>
        <span class="lsa__letter lsa__letter--av-l2">L</span>
        <span class="lsa__letter lsa__letter--av-e lsa__letter--finale">E</span>
      </div>
    </div>

    <div class="lsa__shards" data-letter-scatter-shards>
      <span class="lsa__shard lsa__shard--1"></span>
      <span class="lsa__shard lsa__shard--2"></span>
      <span class="lsa__shard lsa__shard--3"></span>
      <span class="lsa__shard lsa__shard--4"></span>
    </div>
  </div>

  <div
    class="lsa__status"
    role="status"
    aria-live="polite"
    data-letter-scatter-status
  ></div>
</div>
