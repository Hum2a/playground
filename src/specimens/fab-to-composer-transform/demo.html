<div class="ftc" data-fab-to-composer data-ftc-state="fab">
  <div class="ftc__scaffold" data-ftc-scaffold>
    <div class="ftc__feed" aria-hidden="true">
      <div class="ftc__feed-line"></div>
      <div class="ftc__feed-line ftc__feed-line--short"></div>
      <div class="ftc__feed-line"></div>
    </div>

    <div class="ftc__container" data-ftc-container>
      <button type="button" class="ftc__fab" data-ftc-fab aria-label="Compose message">
        <span class="ftc__glyph" data-ftc-glyph aria-hidden="true"></span>
      </button>

      <div class="ftc__composer" data-ftc-composer hidden>
        <h2 class="ftc__composer-title" data-ftc-title>New message</h2>
        <textarea class="ftc__textarea" data-ftc-textarea rows="3" placeholder="Write something…"></textarea>
        <div class="ftc__actions" data-ftc-actions>
          <button type="button" class="ftc__action ftc__action--ghost" data-ftc-cancel>Cancel</button>
          <button type="button" class="ftc__action">Send</button>
        </div>
      </div>
    </div>
  </div>

  <p class="ftc__status" role="status" aria-live="polite" data-ftc-status>
    Compose action available.
  </p>
</div>
