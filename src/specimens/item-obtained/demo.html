<div class="iob" data-item-obtained data-state="idle">
  <div class="iob__stage">
    <div class="iob__present" data-iob-present>
      <div class="iob__item" data-iob-item aria-hidden="true">
        <span class="iob__facet iob__facet--a"></span>
        <span class="iob__facet iob__facet--b"></span>
        <span class="iob__facet iob__facet--c"></span>
        <span class="iob__facet iob__facet--d"></span>
        <span class="iob__facet iob__facet--e"></span>
      </div>

      <div class="iob__label-block" data-iob-label-block>
        <p class="iob__label" data-iob-label>ENERGY SHARD</p>
        <span class="iob__rule" data-iob-rule aria-hidden="true"></span>
      </div>
    </div>

    <div class="iob__slot" data-iob-slot aria-hidden="true">
      <span class="iob__slot-icon" aria-hidden="true">
        <span class="iob__slot-gem"></span>
      </span>
      <span class="iob__slot-name">ENERGY SHARD</span>
      <span class="iob__qty" data-iob-qty>
        <span class="iob__qty-prefix">×</span>
        <span class="iob__qty-slot">
          <span class="iob__qty-num iob__qty-num--out" data-iob-qty-out>02</span>
          <span class="iob__qty-num iob__qty-num--in" data-iob-qty-in>03</span>
        </span>
      </span>
      <span class="iob__accent iob__accent--a" aria-hidden="true"></span>
      <span class="iob__accent iob__accent--b" aria-hidden="true"></span>
    </div>

    <p class="iob__obtained" data-iob-obtained hidden>ITEM OBTAINED</p>
  </div>

  <p class="iob__qty-text" data-iob-qty-text>
    ENERGY SHARD <span data-iob-qty-live>×02</span>
  </p>

  <button type="button" class="iob__btn" data-iob-obtain>
    OBTAIN ITEM
  </button>

  <div
    class="iob__status"
    role="status"
    aria-live="polite"
    data-iob-status
  ></div>
</div>
