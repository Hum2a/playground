<div class="das" data-dual-activity data-state="single">
  <div class="das__stage">
    <div class="das__track" data-das-track>
      <div class="das__main" data-das-main>
        <span class="das__progress" data-das-progress aria-hidden="true"></span>
        <span class="das__label" data-das-label>UPLOAD // 64%</span>
      </div>
      <span class="das__bridge" data-das-bridge aria-hidden="true"></span>
      <div class="das__secondary" data-das-secondary>
        <span class="das__timer" data-das-timer>
          <span class="das__digit-wrap" data-das-digit="0"
            ><span class="das__digit">0</span></span
          >
          <span class="das__digit-wrap" data-das-digit="1"
            ><span class="das__digit">4</span></span
          >
          <span class="das__sep" aria-hidden="true">:</span>
          <span class="das__digit-wrap" data-das-digit="2"
            ><span class="das__digit">1</span></span
          >
          <span class="das__digit-wrap" data-das-digit="3"
            ><span class="das__digit">2</span></span
          >
        </span>
      </div>
    </div>
  </div>

  <div class="das__controls">
    <button type="button" class="das__btn" data-das-start>START TIMER</button>
    <button type="button" class="das__btn das__btn--ghost" data-das-end disabled>
      END TIMER
    </button>
  </div>

  <p class="das__status" role="status" aria-live="polite" data-das-status>
    Single upload activity at 64 percent.
  </p>
</div>
