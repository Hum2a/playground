<div class="lta8" data-lta8 data-phase="idle">
  <p class="lta8__live" data-lta8-live aria-live="polite">Lightning Target Acquisition. Idle.</p>
  <p class="lta8__system">NR // NR-121</p>
  <div class="lta8__stage" data-lta8-stage>
    <div class="lta8__viz" data-lta8-viz aria-hidden="true">
      <span class="lta8__mark lta8__mark--a"></span>
      <span class="lta8__mark lta8__mark--b"></span>
      <span class="lta8__mark lta8__mark--c"></span>
    </div>
    <p class="lta8__status" data-lta8-status>IDLE</p>
    <p class="lta8__note" data-lta8-note>A reticle snaps onto a target with lightning tick marks.</p>
  </div>
  <div class="lta8__controls">
    <button type="button" class="lta8__btn lta8__btn--primary" data-lta8-run>Acquire</button>
    <button type="button" class="lta8__btn" data-lta8-replay>Replay</button>
  </div>
</div>
