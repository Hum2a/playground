<div class="ns36" data-ns36 data-phase="idle">
  <p class="ns36__live" data-ns36-live aria-live="polite">360° Network Scan. Idle.</p>
  <p class="ns36__system">NR // NR-154</p>
  <div class="ns36__stage" data-ns36-stage>
    <div class="ns36__viz" data-ns36-viz aria-hidden="true">
      <span class="ns36__mark ns36__mark--a"></span>
      <span class="ns36__mark ns36__mark--b"></span>
      <span class="ns36__mark ns36__mark--c"></span>
    </div>
    <p class="ns36__status" data-ns36-status>IDLE</p>
    <p class="ns36__note" data-ns36-note>A 360° sweep discovers network nodes around a hub.</p>
  </div>
  <div class="ns36__controls">
    <button type="button" class="ns36__btn ns36__btn--primary" data-ns36-run>Scan</button>
    <button type="button" class="ns36__btn" data-ns36-replay>Replay</button>
  </div>
</div>
