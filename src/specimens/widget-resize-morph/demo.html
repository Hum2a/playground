<div class="wrm" data-widget-resize-morph data-phase="idle" data-size="2x1">
  <div class="wrm__grid">
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>
    <div class="wrm__cell" aria-hidden="true"></div>

    <div class="wrm__widget" data-wrm-widget tabindex="0" role="button" aria-label="Activity widget, tap to select">
      <div class="wrm__content" data-wrm-content>
        <span class="wrm__title">Activity</span>
        <span class="wrm__value" data-wrm-value>4,280</span>
        <div class="wrm__chart" data-wrm-chart hidden aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="wrm__metrics" data-wrm-metrics hidden>
          <span><em>Steps</em>4,280</span>
          <span><em>Cal</em>312</span>
          <span><em>Min</em>42</span>
        </div>
      </div>
      <div class="wrm__handles" data-wrm-handles hidden>
        <button type="button" class="wrm__handle wrm__handle--sm" data-wrm-size="2x1" aria-label="2 by 1">2×1</button>
        <button type="button" class="wrm__handle wrm__handle--md" data-wrm-size="2x2" aria-label="2 by 2">2×2</button>
        <button type="button" class="wrm__handle wrm__handle--lg" data-wrm-size="4x2" aria-label="4 by 2">4×2</button>
      </div>
    </div>
  </div>

  <p class="wrm__status" role="status" aria-live="polite" data-wrm-status>
    Tap the widget to select and resize between 2×1, 2×2, and 4×2 grid sizes.
  </p>
</div>
