<div class="scouter-scan" data-scouter-scan data-phase="idle">
  <p class="scouter-scan__system">NODE // 07</p>

  <div class="scouter-scan__plate">
    <div class="scouter-scan__stage" data-ss-stage>
      <div class="scouter-scan__target" data-ss-target aria-hidden="true">
        <span class="scouter-scan__diamond" data-ss-diamond></span>
        <span class="scouter-scan__block scouter-scan__block--a"></span>
        <span class="scouter-scan__block scouter-scan__block--b"></span>
        <span class="scouter-scan__node"></span>
        <span class="scouter-scan__internals" data-ss-internals>
          <span class="scouter-scan__line scouter-scan__line--1"></span>
          <span class="scouter-scan__line scouter-scan__line--2"></span>
          <span class="scouter-scan__line scouter-scan__line--3"></span>
          <span class="scouter-scan__line scouter-scan__line--4"></span>
          <span class="scouter-scan__line scouter-scan__line--5"></span>
        </span>
        <span class="scouter-scan__beam" data-ss-beam></span>
      </div>

      <div class="scouter-scan__brackets" data-ss-brackets aria-hidden="true">
        <span class="scouter-scan__bracket scouter-scan__bracket--tl" data-ss-br="tl"></span>
        <span class="scouter-scan__bracket scouter-scan__bracket--tr" data-ss-br="tr"></span>
        <span class="scouter-scan__bracket scouter-scan__bracket--bl" data-ss-br="bl"></span>
        <span class="scouter-scan__bracket scouter-scan__bracket--br" data-ss-br="br"></span>
      </div>

      <div class="scouter-scan__ticks" data-ss-ticks aria-hidden="true">
        <span class="scouter-scan__tick scouter-scan__tick--t"></span>
        <span class="scouter-scan__tick scouter-scan__tick--r"></span>
        <span class="scouter-scan__tick scouter-scan__tick--b"></span>
        <span class="scouter-scan__tick scouter-scan__tick--l"></span>
      </div>

      <span class="scouter-scan__crosshair" data-ss-cross aria-hidden="true"></span>
    </div>

    <dl class="scouter-scan__report" data-ss-report>
      <div class="scouter-scan__row">
        <dt>TARGET</dt>
        <dd data-ss-target-val>UNRESOLVED</dd>
      </div>
      <div class="scouter-scan__row">
        <dt>OUTPUT</dt>
        <dd data-ss-output>----</dd>
      </div>
      <div class="scouter-scan__row">
        <dt>LATENCY</dt>
        <dd data-ss-latency>----</dd>
      </div>
      <div class="scouter-scan__row">
        <dt>LOAD</dt>
        <dd data-ss-load>----</dd>
      </div>
      <div class="scouter-scan__row scouter-scan__row--class">
        <dt>CLASS</dt>
        <dd class="scouter-scan__class" data-ss-class>
          <span class="scouter-scan__class-unknown" data-ss-class-u>UNKNOWN</span>
          <span class="scouter-scan__class-extreme" data-ss-class-e aria-hidden="true">EXTREME</span>
        </dd>
        <span class="scouter-scan__class-bar" data-ss-class-bar aria-hidden="true"></span>
      </div>
    </dl>
  </div>

  <div class="scouter-scan__controls">
    <button type="button" class="scouter-scan__btn" data-ss-scan>SCAN</button>
    <button type="button" class="scouter-scan__btn scouter-scan__btn--ghost" data-ss-reset>
      RESET
    </button>
  </div>

  <p class="scouter-scan__status" role="status" aria-live="polite" data-ss-status>
    Node 07. Target unresolved.
  </p>
</div>
