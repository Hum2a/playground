<div class="ewb" data-ewb data-phase="idle">
  <p class="ewb__live" data-ewb-live aria-live="polite">
    Zone exposed. Wall down.
  </p>

  <p class="ewb__system">WALL // BLOCK</p>

  <div class="ewb__stage" data-ewb-stage>
    <div class="ewb__field">
      <p class="ewb__zone" data-ewb-zone>EXPOSED</p>
      <div class="ewb__wall" data-ewb-wall aria-hidden="true">
        <span class="ewb__slab ewb__slab--1"></span>
        <span class="ewb__slab ewb__slab--2"></span>
        <span class="ewb__slab ewb__slab--3"></span>
        <span class="ewb__slab ewb__slab--4"></span>
        <span class="ewb__slab ewb__slab--5"></span>
      </div>
    </div>
    <p class="ewb__status" data-ewb-status>DOWN</p>
    <p class="ewb__hint" data-ewb-hint>Press Run to raise the wall.</p>
  </div>

  <div class="ewb__controls">
    <button type="button" class="ewb__btn ewb__btn--primary" data-ewb-run>Run</button>
    <button type="button" class="ewb__btn" data-ewb-replay>Replay</button>
  </div>
</div>
