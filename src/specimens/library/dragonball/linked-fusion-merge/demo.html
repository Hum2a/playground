<div class="lfm" data-linked-fusion data-state="idle">
  <p class="lfm__rel" data-lfm-rel>UNLINKED</p>

  <div class="lfm__host">
    <div class="lfm__stage" aria-hidden="true" data-lfm-stage>
      <article class="lfm__ent lfm__ent--a" data-lfm-a>
        <span class="lfm__node lfm__node--a" data-lfm-node-a></span>
        <p class="lfm__kicker">PROFILE // A</p>
        <p class="lfm__meta">12 ATTRIBUTES</p>
        <span class="lfm__bars" aria-hidden="true">
          <span class="lfm__bar"></span>
          <span class="lfm__bar"></span>
          <span class="lfm__bar"></span>
        </span>
      </article>

      <article class="lfm__ent lfm__ent--b" data-lfm-b>
        <span class="lfm__node lfm__node--b" data-lfm-node-b></span>
        <p class="lfm__kicker">PROFILE // B</p>
        <p class="lfm__meta">8 ATTRIBUTES</p>
        <span class="lfm__diags" aria-hidden="true">
          <span class="lfm__diag"></span>
          <span class="lfm__diag"></span>
          <span class="lfm__diag"></span>
        </span>
      </article>

      <span class="lfm__line lfm__line--a" data-lfm-line-a></span>
      <span class="lfm__line lfm__line--b" data-lfm-line-b></span>

      <span class="lfm__diamond" data-lfm-diamond>
        <span class="lfm__seg lfm__seg--n"></span>
        <span class="lfm__seg lfm__seg--e"></span>
        <span class="lfm__seg lfm__seg--s"></span>
        <span class="lfm__seg lfm__seg--w"></span>
      </span>

      <article class="lfm__ent lfm__ent--c" data-lfm-c>
        <p class="lfm__kicker">PROFILE // C</p>
        <p class="lfm__meta">20 ATTRIBUTES</p>
        <p class="lfm__badge">LINKED MERGE</p>
        <span class="lfm__hybrid" aria-hidden="true">
          <span class="lfm__bar lfm__bar--c"></span>
          <span class="lfm__bar lfm__bar--c"></span>
          <span class="lfm__diag lfm__diag--c"></span>
          <span class="lfm__diag lfm__diag--c"></span>
          <span class="lfm__core"></span>
        </span>
      </article>

      <p class="lfm__prov" data-lfm-prov>
        <span data-lfm-prov-ab>A + B</span>
        <span data-lfm-prov-attrs>20 ATTRIBUTES</span>
      </p>
    </div>
  </div>

  <div class="lfm__controls">
    <button type="button" class="lfm__btn" data-lfm-link>LINK</button>
    <button type="button" class="lfm__btn lfm__btn--ghost" data-lfm-reset hidden>RESET</button>
  </div>

  <p class="lfm__announce" data-lfm-announce role="status" aria-live="polite"></p>
</div>
