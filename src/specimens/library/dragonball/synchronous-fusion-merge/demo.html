<div class="sfm" data-sync-fusion data-state="idle">
  <div class="sfm__toolbar">
    <button type="button" class="sfm__btn" data-sfm-fuse>FUSE</button>
  </div>

  <p class="sfm__status" role="status" aria-live="polite" data-sfm-status>
    Source A and Source B are independent.
  </p>

  <div class="sfm__host">
    <div class="sfm__stage" aria-hidden="true">
      <div class="sfm__sync" data-sfm-sync>
        <span class="sfm__seg sfm__seg--1"></span>
        <span class="sfm__seg sfm__seg--2"></span>
        <span class="sfm__seg sfm__seg--3"></span>
        <span class="sfm__seg sfm__seg--4"></span>
        <span class="sfm__seg sfm__seg--5"></span>
        <span class="sfm__seg sfm__seg--6"></span>
        <span class="sfm__seg sfm__seg--7"></span>
        <span class="sfm__seg sfm__seg--8"></span>
      </div>

      <article class="sfm__ent sfm__ent--a" data-sfm-a>
        <p class="sfm__kicker">SOURCE // A</p>
        <p class="sfm__title">DATA</p>
        <p class="sfm__meta">12 FIELDS</p>
      </article>

      <article class="sfm__ent sfm__ent--b" data-sfm-b>
        <p class="sfm__kicker">SOURCE // B</p>
        <p class="sfm__title">RULES</p>
        <p class="sfm__meta">8 RULES</p>
      </article>

      <div class="sfm__merge" data-sfm-merge>
        <span class="sfm__ray sfm__ray--1"></span>
        <span class="sfm__ray sfm__ray--2"></span>
        <span class="sfm__ray sfm__ray--3"></span>
        <span class="sfm__ray sfm__ray--4"></span>
        <span class="sfm__ray sfm__ray--5"></span>
        <span class="sfm__ray sfm__ray--6"></span>
      </div>

      <article class="sfm__ent sfm__ent--c" data-sfm-c>
        <p class="sfm__kicker">MODEL // C</p>
        <p class="sfm__title">20 INPUTS</p>
        <p class="sfm__meta sfm__meta--merged">MERGED</p>
      </article>

      <div class="sfm__prov" data-sfm-prov>
        <span class="sfm__mark sfm__mark--a">A</span>
        <span class="sfm__stem sfm__stem--a"></span>
        <span class="sfm__stem sfm__stem--b"></span>
        <span class="sfm__mark sfm__mark--b">B</span>
      </div>
    </div>
  </div>
</div>
