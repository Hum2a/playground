<div class="pst" data-power-state data-phase="idle" data-form="base">
  <div class="pst__host" data-pst-host>
    <p class="pst__id">ENGINE // 04</p>

    <div class="pst__stage" data-pst-stage>
      <div class="pst__field" data-pst-field aria-hidden="true"></div>

      <div class="pst__marks" data-pst-marks aria-hidden="true">
        <span class="pst__mark" style="--i: 0"></span>
        <span class="pst__mark" style="--i: 1"></span>
        <span class="pst__mark" style="--i: 2"></span>
        <span class="pst__mark" style="--i: 3"></span>
        <span class="pst__mark" style="--i: 4"></span>
        <span class="pst__mark" style="--i: 5"></span>
        <span class="pst__mark" style="--i: 6"></span>
        <span class="pst__mark" style="--i: 7"></span>
        <span class="pst__mark" style="--i: 8"></span>
        <span class="pst__mark" style="--i: 9"></span>
      </div>

      <div class="pst__rays" data-pst-rays aria-hidden="true">
        <span class="pst__ray" style="--r: 0"></span>
        <span class="pst__ray" style="--r: 1"></span>
        <span class="pst__ray" style="--r: 2"></span>
        <span class="pst__ray" style="--r: 3"></span>
        <span class="pst__ray" style="--r: 4"></span>
        <span class="pst__ray" style="--r: 5"></span>
        <span class="pst__ray" style="--r: 6"></span>
        <span class="pst__ray" style="--r: 7"></span>
      </div>

      <div class="pst__engine" data-pst-engine aria-hidden="true">
        <div class="pst__geom pst__geom--base" data-pst-base>
          <span class="pst__part pst__part-core"></span>
          <span class="pst__part pst__part-lat pst__part-lat--l"></span>
          <span class="pst__part pst__part-lat pst__part-lat--r"></span>
          <span class="pst__part pst__part-foot"></span>
        </div>
        <div class="pst__geom pst__geom--ascended" data-pst-ascended>
          <span class="pst__part pst__part-core pst__part-core--asc"></span>
          <span class="pst__part pst__spike pst__spike--0"></span>
          <span class="pst__part pst__spike pst__spike--1"></span>
          <span class="pst__part pst__spike pst__spike--2"></span>
          <span class="pst__part pst__spike pst__spike--3"></span>
          <span class="pst__part pst__spike pst__spike--4"></span>
          <span class="pst__part pst__spike pst__spike--5"></span>
          <span class="pst__part pst__part-foot pst__part-foot--asc"></span>
        </div>
      </div>
    </div>

    <dl class="pst__metrics" data-pst-metrics>
      <div class="pst__row" data-metric="state">
        <dt>STATE</dt>
        <dd class="pst__clip">
          <span class="pst__vals" data-pst-state>
            <span class="pst__val pst__val--from">BASE</span>
            <span class="pst__val pst__val--to">ASCENDED</span>
          </span>
        </dd>
      </div>
      <div class="pst__row" data-metric="throughput">
        <dt>THROUGHPUT</dt>
        <dd class="pst__clip">
          <span class="pst__vals" data-pst-throughput>
            <span class="pst__val pst__val--from">1.0×</span>
            <span class="pst__val pst__val--to">3.0×</span>
          </span>
        </dd>
      </div>
      <div class="pst__row" data-metric="channels">
        <dt>CHANNELS</dt>
        <dd class="pst__clip">
          <span class="pst__vals" data-pst-channels>
            <span class="pst__val pst__val--from">2</span>
            <span class="pst__val pst__val--to">6</span>
          </span>
        </dd>
      </div>
    </dl>
  </div>

  <div class="pst__controls">
    <button type="button" class="pst__btn" data-pst-trigger>TRANSFORM</button>
    <button type="button" class="pst__btn pst__btn--ghost" data-pst-replay>REPLAY</button>
  </div>

  <p class="pst__status" role="status" aria-live="polite" data-pst-status>
    Engine 04. State base.
  </p>
</div>
