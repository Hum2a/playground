<div class="pbr" data-post-burst data-state="recovering" data-stage="0">
  <header class="pbr__chrome">
    <p class="pbr__id">WORKER // 04</p>
    <p class="pbr__task" data-pbr-task>TASK COMPLETE</p>
  </header>

  <p class="pbr__task-a11y" data-pbr-task-a11y>
    Task complete. Boosted work finished successfully.
  </p>

  <section class="pbr__body" data-pbr-body aria-label="Post-burst recovery">
    <div class="pbr__shell" data-pbr-shell>
      <div class="pbr__core" aria-hidden="true"></div>
      <span class="pbr__struct pbr__struct--1 is-on" data-pbr-struct="1" aria-hidden="true"></span>
      <span class="pbr__struct pbr__struct--2 is-on" data-pbr-struct="2" aria-hidden="true"></span>
      <span class="pbr__struct pbr__struct--3" data-pbr-struct="3" aria-hidden="true"></span>
      <span class="pbr__struct pbr__struct--4" data-pbr-struct="4" aria-hidden="true"></span>
      <span class="pbr__struct pbr__struct--5" data-pbr-struct="5" aria-hidden="true"></span>
      <span class="pbr__struct pbr__struct--6" data-pbr-struct="6" aria-hidden="true"></span>

      <span class="pbr__tick pbr__tick--a" data-pbr-tick aria-hidden="true"></span>
      <span class="pbr__tick pbr__tick--b" data-pbr-tick aria-hidden="true"></span>
    </div>

    <dl class="pbr__metrics">
      <div class="pbr__metric">
        <dt>LOAD</dt>
        <dd><span data-pbr-load>71</span>%</dd>
      </div>
      <div class="pbr__metric">
        <dt>CAPACITY</dt>
        <dd><span data-pbr-capacity>38</span>%</dd>
      </div>
      <div class="pbr__metric">
        <dt>STATUS</dt>
        <dd data-pbr-status>RECOVERING</dd>
      </div>
    </dl>

    <div class="pbr__rail" aria-label="Recovery progress">
      <p class="pbr__rail-label">RECOVERY</p>
      <div class="pbr__rail-track" aria-hidden="true">
        <div class="pbr__rail-fill" data-pbr-rail-fill style="width:0%"></div>
      </div>
      <p class="pbr__rail-value"><span data-pbr-rail>0</span>%</p>
    </div>
  </section>

  <p class="pbr__announce" data-pbr-announce aria-live="polite"></p>

  <button type="button" class="pbr__btn" data-pbr-restore>RESTORE</button>
</div>
