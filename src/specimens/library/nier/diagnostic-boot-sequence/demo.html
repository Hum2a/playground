<div class="diag-boot-demo" data-diag-boot-demo>
  <div
    class="diag-boot"
    data-diag-boot
    data-step="0"
  >
    <div class="diag-boot__texture" aria-hidden="true"></div>
    <div class="diag-boot__panel">
      <p class="diag-boot__header">DIAGNOSTIC SEQUENCE</p>
      <ol class="diag-boot__log" aria-hidden="true" data-diag-boot-log></ol>
      <span class="diag-boot__cursor" aria-hidden="true"></span>
      <div
        class="diag-boot__progress"
        aria-hidden="true"
        data-diag-boot-progress
      >
        <span class="diag-boot__progress-fill" data-diag-boot-progress-fill></span>
      </div>
    </div>
  </div>

  <p class="diag-boot-demo__status" role="status" aria-live="polite" data-diag-boot-status>
    Loading
  </p>

  <section class="diag-boot-demo__host" data-diag-boot-host hidden>
    <p class="diag-boot-demo__kicker">STATUS</p>
    <h1 class="diag-boot-demo__title">INTERFACE ONLINE</h1>
    <p class="diag-boot-demo__note">Host surface revealed after boot.</p>
  </section>
</div>
