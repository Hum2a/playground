<div class="pbe" data-predictive-back-edge-pull data-pbe-view="current" data-pbe-phase="idle">
  <div class="pbe__stage" data-pbe-stage>
    <div class="pbe__destination" data-pbe-destination aria-hidden="true">
      <p class="pbe__dest-label">INBOX</p>
      <ul class="pbe__list">
        <li class="pbe__list-item">Thread A</li>
        <li class="pbe__list-item is-active">Thread B</li>
        <li class="pbe__list-item">Thread C</li>
      </ul>
    </div>

    <div class="pbe__current" data-pbe-current>
      <header class="pbe__header">
        <span class="pbe__title">Thread B</span>
      </header>
      <div class="pbe__body">
        <p class="pbe__line">From · Vector team</p>
        <p class="pbe__line">Subject · Sprint review</p>
        <div class="pbe__block" aria-hidden="true"></div>
        <div class="pbe__block pbe__block--short" aria-hidden="true"></div>
      </div>
    </div>

    <div class="pbe__edge" data-pbe-edge aria-hidden="true"></div>

    <div class="pbe__indicator" data-pbe-indicator aria-hidden="true">
      <span class="pbe__indicator-icon"></span>
    </div>
  </div>

  <div class="pbe__controls">
    <button type="button" class="pbe__btn pbe__btn--ghost" data-pbe-replay>REPLAY</button>
  </div>

  <p class="pbe__status" role="status" aria-live="polite" data-pbe-status>
    Thread detail · Thread B.
  </p>
</div>
