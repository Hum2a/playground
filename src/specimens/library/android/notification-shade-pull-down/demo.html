<div class="nspd" data-notification-shade data-phase="closed">
  <div class="nspd__host">
    <header class="nspd__host-bar">WEATHER</header>
    <div class="nspd__host-body" aria-hidden="true">
      <p class="nspd__temp">18°</p>
      <p class="nspd__detail">Partly cloudy</p>
    </div>
    <div class="nspd__grab" data-nspd-grab aria-hidden="true"></div>
    <div class="nspd__shade" data-nspd-shade>
      <div class="nspd__shade-head">
        <span class="nspd__clock">09:41</span>
        <span class="nspd__date">Thu 6 Aug</span>
      </div>
      <div class="nspd__notifs">
        <article class="nspd__notif">
          <p class="nspd__notif-title">Messages</p>
          <p class="nspd__notif-body">New reply from Alex</p>
        </article>
        <article class="nspd__notif">
          <p class="nspd__notif-title">Calendar</p>
          <p class="nspd__notif-body">Team sync in 30 min</p>
        </article>
      </div>
      <div class="nspd__qs" data-nspd-qs aria-hidden="true">
        <span class="nspd__qs-tile">Wi-Fi</span>
        <span class="nspd__qs-tile">Bluetooth</span>
        <span class="nspd__qs-tile">Focus</span>
        <span class="nspd__qs-tile">Torch</span>
      </div>
    </div>
  </div>
  <p class="nspd__status" role="status" aria-live="polite" data-nspd-status>
    Drag down from the top 32px to reveal the notification shade.
  </p>
</div>
