<div class="ctd" data-card-to-detail data-ctd-state="list">
  <div class="ctd__scaffold" data-ctd-scaffold>
    <ul class="ctd__list" data-ctd-list>
      <li class="ctd__card" data-ctd-card="0">
        <h2 class="ctd__card-title">Atlas Route</h2>
        <p class="ctd__card-meta">12 stops · Updated today</p>
      </li>
      <li class="ctd__card ctd__card--featured" data-ctd-card="1" data-ctd-source>
        <h2 class="ctd__card-title" data-ctd-shared-title>Meridian Trail</h2>
        <p class="ctd__card-meta" data-ctd-meta>8 stops · Updated yesterday</p>
      </li>
      <li class="ctd__card" data-ctd-card="2">
        <h2 class="ctd__card-title">Coastal Loop</h2>
        <p class="ctd__card-meta">5 stops · Updated 3d ago</p>
      </li>
    </ul>

    <div class="ctd__detail" data-ctd-detail hidden>
      <button type="button" class="ctd__back" data-ctd-back>Back</button>
      <h2 class="ctd__detail-title" data-ctd-detail-title>Meridian Trail</h2>
      <div class="ctd__detail-body" data-ctd-detail-body>
        <p class="ctd__detail-line">Distance · 24.6 km</p>
        <p class="ctd__detail-line">Elevation · 340 m</p>
        <p class="ctd__detail-line">Surface · Mixed gravel</p>
        <div class="ctd__detail-block" aria-hidden="true"></div>
        <div class="ctd__detail-block ctd__detail-block--short" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <p class="ctd__status" role="status" aria-live="polite" data-ctd-status>
    Route list · three cards.
  </p>
</div>
