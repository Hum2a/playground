<div class="pem" data-pip-edge-magnetism>
  <div class="pem__stage" data-pem-stage>
    <p class="pem__hint">Drag the window near edges to feel magnetic attraction</p>
    <div class="pem__window" data-pem-window tabindex="0" role="button" aria-label="Floating media window">
      <div class="pem__media" aria-hidden="true"></div>
      <span class="pem__label">Now playing</span>
    </div>
    <div class="pem__anchors" aria-hidden="true">
      <span data-pem-anchor="tl"></span>
      <span data-pem-anchor="tr"></span>
      <span data-pem-anchor="bl"></span>
      <span data-pem-anchor="br"></span>
    </div>
  </div>
  <p class="pem__status" role="status" aria-live="polite" data-pem-status>Window at lower-right slot.</p>
</div>
