<div class="qse" data-quick-settings-expansion data-phase="compact">
  <div class="qse__panel" data-qse-panel>
    <header class="qse__header" data-qse-header hidden>Quick settings</header>
    <div class="qse__controls" data-qse-controls>
      <button type="button" class="qse__tile qse__tile--0" data-qse-tile="0" aria-label="Wi-Fi">
        <span class="qse__icon"></span><span class="qse__label">Wi-Fi</span>
      </button>
      <button type="button" class="qse__tile qse__tile--1" data-qse-tile="1" aria-label="Bluetooth">
        <span class="qse__icon"></span><span class="qse__label">Bluetooth</span>
      </button>
      <button type="button" class="qse__tile qse__tile--2" data-qse-tile="2" aria-label="Data">
        <span class="qse__icon"></span><span class="qse__label">Data</span>
      </button>
      <button type="button" class="qse__tile qse__tile--3" data-qse-tile="3" aria-label="Torch">
        <span class="qse__icon"></span><span class="qse__label">Torch</span>
      </button>
      <button type="button" class="qse__tile qse__tile--extra" data-qse-extra="0" hidden aria-label="Airplane">
        <span class="qse__icon"></span><span class="qse__label">Airplane</span>
      </button>
      <button type="button" class="qse__tile qse__tile--extra" data-qse-extra="1" hidden aria-label="Hotspot">
        <span class="qse__icon"></span><span class="qse__label">Hotspot</span>
      </button>
    </div>
    <div class="qse__brightness" data-qse-brightness hidden>
      <span>Brightness</span>
      <div class="qse__slider"><div class="qse__slider-fill"></div></div>
    </div>
  </div>
  <button type="button" class="qse__expand-btn" data-qse-expand>Expand</button>
  <p class="qse__status" role="status" aria-live="polite" data-qse-status>Compact strip — tap Expand.</p>
</div>
