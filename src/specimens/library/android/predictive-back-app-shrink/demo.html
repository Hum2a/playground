<div class="pbas" data-predictive-back-app-shrink data-pbas-view="current" data-pbas-phase="idle">
  <div class="pbas__stage" data-pbas-stage>
    <div class="pbas__underlay" data-pbas-underlay aria-hidden="true">
      <p class="pbas__underlay-label">HOME</p>
      <div class="pbas__underlay-grid" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="pbas__surface" data-pbas-surface>
      <header class="pbas__header">
        <span class="pbas__title">Settings</span>
      </header>
      <div class="pbas__body">
        <p class="pbas__line">Display · Adaptive</p>
        <p class="pbas__line">Sound · Balanced</p>
        <div class="pbas__block" aria-hidden="true"></div>
        <div class="pbas__block pbas__block--short" aria-hidden="true"></div>
      </div>
    </div>

    <div class="pbas__edge" data-pbas-edge aria-hidden="true"></div>
  </div>

  <div class="pbas__controls">
    <button type="button" class="pbas__btn pbas__btn--ghost" data-pbas-replay>REPLAY</button>
  </div>

  <p class="pbas__status" role="status" aria-live="polite" data-pbas-status>
    Settings screen active.
  </p>
</div>
