<div class="atrs" data-app-to-recents data-phase="app">
  <div class="atrs__viewport">
    <div class="atrs__bg" aria-hidden="true"></div>
    <div class="atrs__card atrs__card--left" data-atrs-left aria-hidden="true">
      <div class="atrs__card-inner">MAIL</div>
    </div>
    <div class="atrs__card atrs__card--right" data-atrs-right aria-hidden="true">
      <div class="atrs__card-inner">MAPS</div>
    </div>
    <div class="atrs__active" data-atrs-active>
      <header class="atrs__app-bar">GALLERY</header>
      <div class="atrs__app-body">
        <div class="atrs__tile"></div>
        <div class="atrs__tile"></div>
        <div class="atrs__tile"></div>
      </div>
    </div>
    <p class="atrs__label" data-atrs-label aria-hidden="true">GALLERY</p>
    <div class="atrs__gesture" data-atrs-gesture aria-hidden="true"></div>
  </div>
  <div class="atrs__controls">
    <button type="button" class="atrs__btn" data-atrs-overview>OVERVIEW</button>
    <button type="button" class="atrs__btn" data-atrs-restore hidden>RESTORE</button>
  </div>
  <p class="atrs__status" role="status" aria-live="polite" data-atrs-status>
    Press OVERVIEW or swipe up from bottom to shrink app into recents.
  </p>
</div>
