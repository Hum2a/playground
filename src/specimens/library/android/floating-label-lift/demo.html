<div class="fll" data-floating-label-lift>
  <div class="fll__field" data-fll-field>
    <input
      class="fll__input"
      id="fll-email"
      type="email"
      autocomplete="off"
      data-fll-input
    />
    <label class="fll__label" for="fll-email" data-fll-label>Email address</label>
    <span class="fll__outline" aria-hidden="true"></span>
  </div>

  <p class="fll__support" data-fll-support hidden></p>

  <button class="fll__error-toggle" type="button" data-fll-error-toggle>
    Toggle error
  </button>

  <p class="fll__status" role="status" aria-live="polite" data-fll-status>
    Focus or type to lift the label.
  </p>
</div>
