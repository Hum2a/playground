<div class="rcr" data-recents-restore data-phase="overview">
  <div class="rcr__viewport">
    <div class="rcr__bg" aria-hidden="true"></div>
    <button type="button" class="rcr__card" data-rcr-card="0" aria-label="Restore NOTES task">
      <div class="rcr__card-head">NOTES</div>
      <div class="rcr__card-body" aria-hidden="true"><span></span><span></span></div>
    </button>
    <button type="button" class="rcr__card rcr__card--centre" data-rcr-card="1" aria-label="Restore GALLERY task">
      <div class="rcr__card-head">GALLERY</div>
      <div class="rcr__card-body" aria-hidden="true"><span></span><span></span><span></span></div>
    </button>
    <button type="button" class="rcr__card" data-rcr-card="2" aria-label="Restore MAIL task">
      <div class="rcr__card-head">MAIL</div>
      <div class="rcr__card-body" aria-hidden="true"><span></span><span></span></div>
    </button>
    <p class="rcr__label" data-rcr-label>GALLERY</p>
    <div class="rcr__expanded" data-rcr-expanded hidden>
      <header class="rcr__app-bar" data-rcr-title>GALLERY</header>
      <div class="rcr__app-body" data-rcr-content>
        <div class="rcr__tile"></div>
        <div class="rcr__tile"></div>
        <div class="rcr__tile"></div>
      </div>
      <button type="button" class="rcr__back" data-rcr-back>OVERVIEW</button>
    </div>
  </div>
  <p class="rcr__status" role="status" aria-live="polite" data-rcr-status>
    Select a task card to restore it full-screen.
  </p>
</div>
