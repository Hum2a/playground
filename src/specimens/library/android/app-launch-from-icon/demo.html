<div class="alf" data-app-launch data-alf-state="launcher">
  <div class="alf__scaffold" data-alf-scaffold>
    <div class="alf__launcher" data-alf-launcher>
      <div class="alf__grid" data-alf-grid>
        <button type="button" class="alf__tile" data-alf-tile="0" aria-label="Notes">
          <span class="alf__tile-icon alf__tile-icon--a" aria-hidden="true"></span>
          <span class="alf__tile-label">Notes</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="1" aria-label="Maps">
          <span class="alf__tile-icon alf__tile-icon--b" aria-hidden="true"></span>
          <span class="alf__tile-label">Maps</span>
        </button>
        <button type="button" class="alf__tile alf__tile--launch" data-alf-tile="2" data-alf-source aria-label="Atlas">
          <span class="alf__tile-icon alf__tile-icon--c" aria-hidden="true"></span>
          <span class="alf__tile-label">Atlas</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="3" aria-label="Tasks">
          <span class="alf__tile-icon alf__tile-icon--d" aria-hidden="true"></span>
          <span class="alf__tile-label">Tasks</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="4" aria-label="Clock">
          <span class="alf__tile-icon alf__tile-icon--e" aria-hidden="true"></span>
          <span class="alf__tile-label">Clock</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="5" aria-label="Files">
          <span class="alf__tile-icon alf__tile-icon--f" aria-hidden="true"></span>
          <span class="alf__tile-label">Files</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="6" aria-label="Gallery">
          <span class="alf__tile-icon alf__tile-icon--g" aria-hidden="true"></span>
          <span class="alf__tile-label">Gallery</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="7" aria-label="Settings">
          <span class="alf__tile-icon alf__tile-icon--h" aria-hidden="true"></span>
          <span class="alf__tile-label">Settings</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="8" aria-label="Weather">
          <span class="alf__tile-icon alf__tile-icon--i" aria-hidden="true"></span>
          <span class="alf__tile-label">Weather</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="9" aria-label="Music">
          <span class="alf__tile-icon alf__tile-icon--j" aria-hidden="true"></span>
          <span class="alf__tile-label">Music</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="10" aria-label="Mail">
          <span class="alf__tile-icon alf__tile-icon--k" aria-hidden="true"></span>
          <span class="alf__tile-label">Mail</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="11" aria-label="Store">
          <span class="alf__tile-icon alf__tile-icon--l" aria-hidden="true"></span>
          <span class="alf__tile-label">Store</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="12" aria-label="Camera">
          <span class="alf__tile-icon alf__tile-icon--m" aria-hidden="true"></span>
          <span class="alf__tile-label">Camera</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="13" aria-label="Health">
          <span class="alf__tile-icon alf__tile-icon--n" aria-hidden="true"></span>
          <span class="alf__tile-label">Health</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="14" aria-label="Chat">
          <span class="alf__tile-icon alf__tile-icon--o" aria-hidden="true"></span>
          <span class="alf__tile-label">Chat</span>
        </button>
        <button type="button" class="alf__tile" data-alf-tile="15" aria-label="Drive">
          <span class="alf__tile-icon alf__tile-icon--p" aria-hidden="true"></span>
          <span class="alf__tile-label">Drive</span>
        </button>
      </div>
    </div>

    <div class="alf__app" data-alf-app hidden>
      <header class="alf__app-header">
        <button type="button" class="alf__close" data-alf-close aria-label="Close app">Close</button>
        <span class="alf__app-title">Atlas</span>
      </header>
      <div class="alf__app-body" data-alf-app-body>
        <p class="alf__app-line">Route planner · 3 saved paths</p>
        <div class="alf__app-block" aria-hidden="true"></div>
        <div class="alf__app-block alf__app-block--short" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <p class="alf__status" role="status" aria-live="polite" data-alf-status>
    Launcher grid · tap Atlas to launch.
  </p>
</div>
