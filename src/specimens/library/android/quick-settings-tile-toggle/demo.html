<div class="qstt" data-qs-tile-toggle>
  <div class="qstt__grid" role="group" aria-label="Quick settings tiles">
    <div class="qstt__tile qstt__tile--static" aria-hidden="true">
      <span class="qstt__glyph">☀</span>
      <span class="qstt__label">Brightness</span>
    </div>
    <button
      type="button"
      class="qstt__tile qstt__tile--network"
      data-qstt-network
      aria-pressed="false"
    >
      <span class="qstt__backing" data-qstt-backing aria-hidden="true"></span>
      <span class="qstt__ripple" data-qstt-ripple aria-hidden="true"></span>
      <span class="qstt__glyph" data-qstt-glyph>◉</span>
      <span class="qstt__label" data-qstt-label>Network</span>
      <span class="qstt__sub" data-qstt-sub>Off</span>
    </button>
    <div class="qstt__tile qstt__tile--static" aria-hidden="true">
      <span class="qstt__glyph">♪</span>
      <span class="qstt__label">Sound</span>
    </div>
    <div class="qstt__tile qstt__tile--static" aria-hidden="true">
      <span class="qstt__glyph">◎</span>
      <span class="qstt__label">Focus</span>
    </div>
    <div class="qstt__tile qstt__tile--static" aria-hidden="true">
      <span class="qstt__glyph">⎙</span>
      <span class="qstt__label">Cast</span>
    </div>
    <div class="qstt__tile qstt__tile--static" aria-hidden="true">
      <span class="qstt__glyph">✈</span>
      <span class="qstt__label">Airplane</span>
    </div>
  </div>
  <p class="qstt__status" role="status" aria-live="polite" data-qstt-status>
    Network tile off. Click or press Space to toggle.
  </p>
</div>
