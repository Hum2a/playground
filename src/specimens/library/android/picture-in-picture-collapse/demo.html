<div class="pipc" data-pip-collapse data-pipc-mode="inline">
  <div class="pipc__stage" data-pipc-stage>
    <header class="pipc__header">
      <h1 class="pipc__title">Archive Stream</h1>
      <button type="button" class="pipc__mini" data-pipc-mini>Mini</button>
    </header>

    <div class="pipc__player-wrap" data-pipc-player-wrap>
      <div class="pipc__player" data-pipc-player tabindex="0" role="button" aria-label="Media player">
        <div class="pipc__media" aria-hidden="true">
          <span class="pipc__wave"></span>
          <span class="pipc__wave pipc__wave--2"></span>
        </div>
        <div class="pipc__controls" data-pipc-controls>
          <button type="button" aria-label="Play">▶</button>
          <button type="button" aria-label="Skip">⏭</button>
        </div>
      </div>
    </div>

    <div class="pipc__meta" data-pipc-meta>
      <p>Session recording · 12:04</p>
      <p class="pipc__desc">Tap Mini to collapse the player into picture-in-picture.</p>
    </div>
  </div>
  <p class="pipc__status" role="status" aria-live="polite" data-pipc-status>Player inline.</p>
</div>
