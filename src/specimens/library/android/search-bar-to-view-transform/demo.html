<div class="sbvt" data-search-bar-transform data-phase="compact">
  <div class="sbvt__host" data-sbvt-host>
    <header class="sbvt__header">
      <h1 class="sbvt__title">Catalogue</h1>
    </header>
    <ul class="sbvt__list" data-sbvt-list>
      <li class="sbvt__item">Motion primitives</li>
      <li class="sbvt__item">Container transforms</li>
      <li class="sbvt__item">System surfaces</li>
      <li class="sbvt__item">Adaptive layouts</li>
    </ul>
  </div>

  <div class="sbvt__search" data-sbvt-search>
    <button class="sbvt__back" type="button" data-sbvt-back aria-label="Back">
      <span aria-hidden="true">←</span>
    </button>
    <span class="sbvt__icon" aria-hidden="true">⌕</span>
    <input
      class="sbvt__input"
      type="search"
      placeholder="Search specimens"
      data-sbvt-input
      aria-label="Search specimens"
    />
    <ul class="sbvt__results" data-sbvt-results hidden>
      <li>Search Bar-to-View Transform</li>
      <li>Material Switch Toggle</li>
      <li>Floating Label Lift</li>
      <li>Dialog Materialise</li>
    </ul>
  </div>

  <button class="sbvt__trigger" type="button" data-sbvt-trigger aria-label="Open search">
    <span class="sbvt__trigger-icon" aria-hidden="true">⌕</span>
    <span class="sbvt__trigger-text">Search specimens</span>
  </button>

  <p class="sbvt__status" role="status" aria-live="polite" data-sbvt-status>
    Tap the search bar to expand into search view.
  </p>
</div>
