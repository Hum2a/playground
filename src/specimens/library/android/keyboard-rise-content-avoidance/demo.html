<div class="krca" data-keyboard-rise-content-avoidance data-phase="idle">
  <div class="krca__viewport" data-krca-viewport>
    <div class="krca__messages" data-krca-messages>
      <p class="krca__msg">Hey — can you review the draft?</p>
      <p class="krca__msg">Sure, sending notes shortly.</p>
      <label class="krca__field krca__field--top">
        <span>Subject</span>
        <input type="text" class="krca__input" data-krca-input-top placeholder="Optional subject" />
      </label>
    </div>
    <div class="krca__composer">
      <label class="krca__field">
        <span>Message</span>
        <input type="text" class="krca__input" data-krca-input-bottom placeholder="Type a message" />
      </label>
    </div>
  </div>

  <div class="krca__keyboard" data-krca-keyboard hidden aria-hidden="true">
    <div class="krca__keys" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <button type="button" class="krca__dismiss" data-krca-dismiss>Dismiss keyboard</button>
  </div>

  <p class="krca__status" role="status" aria-live="polite" data-krca-status>Focus an input to raise keyboard.</p>
</div>
