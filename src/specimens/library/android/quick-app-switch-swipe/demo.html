<div class="qas" data-quick-app-switch-swipe data-phase="task-a" data-task="0">
  <div class="qas__viewport">
    <div class="qas__task qas__task--a" data-qas-task="0">
      <header class="qas__task-bar">Task A — Notes</header>
      <p class="qas__task-body">Swipe from the bottom zone to preview Task B.</p>
    </div>
    <div class="qas__task qas__task--b" data-qas-task="1">
      <header class="qas__task-bar">Task B — Calendar</header>
      <p class="qas__task-body">Swipe back to return to Task A.</p>
    </div>
    <div class="qas__zone" data-qas-zone aria-hidden="true"></div>
  </div>

  <p class="qas__status" role="status" aria-live="polite" data-qas-status>
    Drag horizontally from the bottom 32px to switch tasks. Commit at 96px or velocity.
  </p>
</div>
