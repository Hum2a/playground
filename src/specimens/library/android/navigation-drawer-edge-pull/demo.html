<div class="ndep" data-navigation-drawer data-ndep-open="false">
  <div class="ndep__stage" data-ndep-stage>
    <div class="ndep__scrim" data-ndep-scrim aria-hidden="true"></div>

    <div class="ndep__app" data-ndep-app>
      <header class="ndep__app-bar">
        <button type="button" class="ndep__menu-btn" data-ndep-menu aria-label="Open navigation drawer" aria-expanded="false">
          <span aria-hidden="true"></span>
        </button>
        <h1 class="ndep__app-title">Archive</h1>
      </header>
      <main class="ndep__app-body">
        <p class="ndep__app-copy">Drag from the left edge to reveal navigation destinations.</p>
        <div class="ndep__cards" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </main>
      <div class="ndep__edge-zone" data-ndep-edge aria-hidden="true"></div>
    </div>

    <nav class="ndep__drawer" data-ndep-drawer aria-label="Main navigation">
      <p class="ndep__drawer-label">Navigate</p>
      <ul class="ndep__list" data-ndep-list>
        <li><button type="button" class="ndep__item is-selected" data-ndep-item="home">Home</button></li>
        <li><button type="button" class="ndep__item" data-ndep-item="library">Library</button></li>
        <li><button type="button" class="ndep__item" data-ndep-item="projects">Projects</button></li>
        <li><button type="button" class="ndep__item" data-ndep-item="settings">Settings</button></li>
        <li><button type="button" class="ndep__item" data-ndep-item="help">Help</button></li>
      </ul>
      <span class="ndep__pill" data-ndep-pill aria-hidden="true"></span>
    </nav>
  </div>

  <p class="ndep__status" role="status" aria-live="polite" data-ndep-status>Drawer closed.</p>
</div>
