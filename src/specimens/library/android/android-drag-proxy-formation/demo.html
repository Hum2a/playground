<div class="adpf" data-android-drag-proxy data-phase="idle">
  <div class="adpf__stage" data-adpf-stage>
    <div class="adpf__source-slot" data-adpf-source-slot>
      <article class="adpf__row" data-adpf-row tabindex="0" aria-label="Notes archive file row">
        <span class="adpf__icon" aria-hidden="true">📄</span>
        <div class="adpf__body">
          <h2 class="adpf__title">FIELD NOTES</h2>
          <p class="adpf__meta">2.4 MB · edited today</p>
        </div>
        <div class="adpf__actions" aria-hidden="true">
          <span class="adpf__action">Share</span>
          <span class="adpf__action">More</span>
        </div>
      </article>
    </div>

    <div class="adpf__targets">
      <div class="adpf__drop adpf__drop--valid" data-adpf-drop="valid" aria-label="Inbox drop zone">
        <span class="adpf__drop-label">INBOX</span>
        <span class="adpf__drop-count" data-adpf-count-valid>0 files</span>
      </div>
      <div class="adpf__drop adpf__drop--invalid" data-adpf-drop="invalid" aria-label="Locked drop zone">
        <span class="adpf__drop-label">LOCKED</span>
        <span class="adpf__drop-hint">Read only</span>
      </div>
    </div>
  </div>

  <div class="adpf__proxy" data-adpf-proxy hidden aria-hidden="true">
    <span class="adpf__proxy-icon" aria-hidden="true">📄</span>
    <span class="adpf__proxy-title">FIELD NOTES</span>
  </div>

  <p class="adpf__status" role="status" aria-live="polite" data-adpf-status>
    Drag FIELD NOTES at least 7px to form a compact proxy.
  </p>
</div>
