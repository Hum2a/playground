<div class="wst" data-wst data-phase="idle" data-surface="a">
  <p class="wst__live" data-wst-live aria-live="polite">
    State one in view.
  </p>

  <p class="wst__system">WIND // TRANSITION</p>

  <div class="wst__stage" data-wst-stage>
    <div class="wst__host">
      <section class="wst__panel wst__panel--a" data-wst-panel="a">
        <p class="wst__kicker">STATE // 01</p>
        <p class="wst__title">CURRENT</p>
      </section>
      <section class="wst__panel wst__panel--b" data-wst-panel="b" hidden>
        <p class="wst__kicker">STATE // 02</p>
        <p class="wst__title">NEXT</p>
      </section>

      <div class="wst__blades" data-wst-blades aria-hidden="true">
        <span class="wst__blade wst__blade--1"></span>
        <span class="wst__blade wst__blade--2"></span>
        <span class="wst__blade wst__blade--3"></span>
        <span class="wst__blade wst__blade--4"></span>
      </div>
    </div>

    <p class="wst__status" data-wst-status>STATE 01</p>
    <p class="wst__hint" data-wst-hint>Press Run to slice to the next state.</p>
  </div>

  <div class="wst__controls">
    <button type="button" class="wst__btn wst__btn--primary" data-wst-run>Run</button>
    <button type="button" class="wst__btn" data-wst-replay>Replay</button>
  </div>
</div>
