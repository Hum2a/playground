<div class="mbd" data-mbd data-phase="idle">
  <p class="mbd__live" data-mbd-live aria-live="polite">
    Job card unassigned on the board.
  </p>

  <p class="mbd__system">BOARD // DISPATCH</p>

  <div class="mbd__stage" data-mbd-stage>
    <div class="mbd__board">
      <div class="mbd__column mbd__column--pool">
        <p class="mbd__column-label">Unassigned</p>
        <div class="mbd__slot mbd__slot--origin"></div>
      </div>
      <div class="mbd__column mbd__column--lane">
        <p class="mbd__column-label">Team Lane</p>
        <div class="mbd__slot mbd__slot--target" data-mbd-target></div>
      </div>
      <span class="mbd__card" data-mbd-card>C-Rank Escort</span>
    </div>
    <p class="mbd__status" data-mbd-status>UNASSIGNED</p>
    <p class="mbd__hint" data-mbd-hint>Press Run to dispatch the job.</p>
  </div>

  <div class="mbd__controls">
    <button type="button" class="mbd__btn mbd__btn--primary" data-mbd-run>Run</button>
    <button type="button" class="mbd__btn" data-mbd-replay>Replay</button>
  </div>
</div>
