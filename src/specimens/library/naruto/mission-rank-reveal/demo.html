<div class="mrr" data-mrr data-phase="idle">
  <p class="mrr__live" data-mrr-live aria-live="polite">
    Briefing idle. Rank pending.
  </p>

  <p class="mrr__system">BRIEFING // MISSION RANK</p>

  <div class="mrr__stage" data-mrr-stage>
    <div class="mrr__card" data-mrr-card data-visible="false">
      <span class="mrr__card-label">RANK</span>
      <span class="mrr__card-letter">B</span>
    </div>

    <div class="mrr__stamp" data-mrr-stamp data-visible="false">CONFIRMED</div>

    <p class="mrr__status" data-mrr-status>PENDING</p>
    <p class="mrr__hint" data-mrr-hint>Press Run to reveal the mission rank.</p>
  </div>

  <div class="mrr__controls">
    <button type="button" class="mrr__btn mrr__btn--primary" data-mrr-run>Run</button>
    <button type="button" class="mrr__btn" data-mrr-replay>Replay</button>
  </div>
</div>
