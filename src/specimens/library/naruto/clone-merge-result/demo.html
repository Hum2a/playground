<div class="cmr" data-cmr data-state="idle">
  <p class="cmr__live" data-cmr-live aria-live="polite">
    Idle. Three clone results are independent.
  </p>

  <p class="cmr__system">RESULT // MERGE</p>

  <div class="cmr__stage" data-cmr-stage>
    <article class="cmr__clone cmr__clone--a" data-cmr-clone="0">
      <p class="cmr__clone-kicker">CLONE A</p>
      <p class="cmr__clone-value">7</p>
    </article>
    <article class="cmr__clone cmr__clone--b" data-cmr-clone="1">
      <p class="cmr__clone-kicker">CLONE B</p>
      <p class="cmr__clone-value">4</p>
    </article>
    <article class="cmr__clone cmr__clone--c" data-cmr-clone="2">
      <p class="cmr__clone-kicker">CLONE C</p>
      <p class="cmr__clone-value">9</p>
    </article>

    <article class="cmr__output" data-cmr-output>
      <p class="cmr__output-kicker">OUTPUT</p>
      <p class="cmr__output-value" data-cmr-output-value>—</p>
    </article>

    <p class="cmr__status" data-cmr-status>IDLE</p>
    <p class="cmr__hint" data-cmr-hint>Press Run to merge three clone results.</p>
  </div>

  <div class="cmr__controls">
    <button type="button" class="cmr__btn cmr__btn--primary" data-cmr-run>Run</button>
    <button type="button" class="cmr__btn" data-cmr-replay>Replay</button>
  </div>
</div>
