<div class="hcr" data-hcr data-phase="idle">
  <p class="hcr__live" data-hcr-live aria-live="polite">
    Idle. Card resting in slot A.
  </p>

  <p class="hcr__system">MOVE // CARD RELOCATE</p>

  <div class="hcr__stage" data-hcr-stage>
    <div class="hcr__track" data-hcr-track>
      <div class="hcr__slot hcr__slot--a" data-hcr-slot-a aria-label="Slot A occupied">
        <span class="hcr__slot-label">SLOT A</span>
      </div>
      <div class="hcr__slot hcr__slot--b" data-hcr-slot-b aria-label="Slot B empty">
        <span class="hcr__slot-label">SLOT B</span>
      </div>

      <div class="hcr__ghosts" data-hcr-ghosts aria-hidden="true"></div>

      <article class="hcr__card" data-hcr-card aria-hidden="true">
        <p class="hcr__card-title">FILE.001</p>
      </article>
    </div>

    <p class="hcr__status" data-hcr-status>SLOT A</p>
    <p class="hcr__hint" data-hcr-hint>Press Run to relocate at speed.</p>
  </div>

  <div class="hcr__controls">
    <button type="button" class="hcr__btn hcr__btn--primary" data-hcr-run>Run</button>
    <button type="button" class="hcr__btn" data-hcr-replay>Replay</button>
  </div>
</div>
