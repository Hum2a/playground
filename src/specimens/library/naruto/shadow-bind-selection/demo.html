<div class="sbd" data-sbd data-phase="idle">
  <p class="sbd__live" data-sbd-live aria-live="polite">
    Target unbound. Shadow source idle.
  </p>

  <p class="sbd__system">BIND // SELECTION</p>

  <div class="sbd__stage" data-sbd-stage>
    <div class="sbd__lane">
      <span class="sbd__card sbd__card--source">SOURCE</span>
      <div class="sbd__tendrils" data-sbd-tendrils aria-hidden="true">
        <span class="sbd__tendril" data-sbd-tendril="0"></span>
        <span class="sbd__tendril" data-sbd-tendril="1"></span>
        <span class="sbd__tendril" data-sbd-tendril="2"></span>
      </div>
      <span class="sbd__card sbd__card--target" data-sbd-target>TARGET</span>
    </div>
    <p class="sbd__status" data-sbd-status>FREE</p>
    <p class="sbd__hint" data-sbd-hint>Press Run to bind the target.</p>
  </div>

  <div class="sbd__controls">
    <button type="button" class="sbd__btn sbd__btn--primary" data-sbd-run>Run</button>
    <button type="button" class="sbd__btn" data-sbd-replay>Replay</button>
  </div>
</div>
