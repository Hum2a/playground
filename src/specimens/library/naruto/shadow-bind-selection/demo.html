<div class="sbs" data-sbs data-phase="idle">
  <p class="sbs__live" data-sbs-live aria-live="polite">
    Target unbound. Shadow source idle.
  </p>

  <p class="sbs__system">BIND // SELECTION</p>

  <div class="sbs__stage" data-sbs-stage>
    <div class="sbs__lane">
      <span class="sbs__card sbs__card--source">SOURCE</span>
      <div class="sbs__binds" data-sbs-binds aria-hidden="true">
        <span class="sbs__tendril sbs__tendril--1" data-sbs-tendril></span>
        <span class="sbs__tendril sbs__tendril--2" data-sbs-tendril></span>
        <span class="sbs__tendril sbs__tendril--3" data-sbs-tendril></span>
      </div>
      <span class="sbs__card sbs__card--target" data-sbs-target>TARGET</span>
    </div>
    <p class="sbs__status" data-sbs-status>FREE</p>
    <p class="sbs__hint" data-sbs-hint>Press Run to bind the target.</p>
  </div>

  <div class="sbs__controls">
    <button type="button" class="sbs__btn sbs__btn--primary" data-sbs-run>Run</button>
    <button type="button" class="sbs__btn" data-sbs-replay>Replay</button>
  </div>
</div>
