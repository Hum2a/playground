<div class="hpf" data-hpf data-phase="idle">
  <p class="hpf__live" data-hpf-live aria-live="polite">
    Field damaged. Healing pending.
  </p>

  <p class="hpf__system">RESTORE // FIELD</p>

  <div class="hpf__stage" data-hpf-stage>
    <div class="hpf__grid" data-hpf-grid aria-label="Damaged field grid">
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>

      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>

      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="0" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>

      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="1" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>

      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
      <div class="hpf__tile" data-hpf-tile data-ring="2" data-healed="false"></div>
    </div>

    <p class="hpf__status" data-hpf-status>DAMAGED</p>
    <p class="hpf__hint" data-hpf-hint>Press Run to begin recovery.</p>
  </div>

  <div class="hpf__controls">
    <button type="button" class="hpf__btn hpf__btn--primary" data-hpf-run>Run</button>
    <button type="button" class="hpf__btn" data-hpf-replay>Replay</button>
  </div>
</div>
