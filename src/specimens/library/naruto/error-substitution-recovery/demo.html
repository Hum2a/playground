  <p class="esr7__system">NR // NR-044</p>
  <div class="esr7__stage" data-esr7-stage>
    <div class="esr7__viz" data-esr7-viz aria-hidden="true">
      <span class="esr7__mark esr7__mark--a"></span>
      <span class="esr7__mark esr7__mark--b"></span>
      <span class="esr7__mark esr7__mark--c"></span>
