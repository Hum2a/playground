<div class="hscs" data-hscs data-phase="idle">
  <p class="hscs__live" data-hscs-live aria-live="polite">
    Command sequence idle. Four signs pending.
  </p>

  <p class="hscs__system">COMBO // HAND SIGNS</p>

  <div class="hscs__stage" data-hscs-stage>
    <ol class="hscs__row" data-hscs-row aria-label="Hand-sign command sequence">
      <li
        class="hscs__slot"
        data-hscs-slot
        data-index="0"
        data-glyph="peak"
        aria-label="Sign 1 pending"
      >
        <span class="hscs__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
              d="M4 18 L12 5 L20 18 Z"
            />
          </svg>
        </span>
      </li>
      <li
        class="hscs__slot"
        data-hscs-slot
        data-index="1"
        data-glyph="ring"
        aria-label="Sign 2 pending"
      >
        <span class="hscs__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="2.5" fill="currentColor" />
          </svg>
        </span>
      </li>
      <li
        class="hscs__slot"
        data-hscs-slot
        data-index="2"
        data-glyph="bars"
        aria-label="Sign 3 pending"
      >
        <span class="hscs__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="square"
              d="M5 7h14M5 12h14M5 17h9"
            />
          </svg>
        </span>
      </li>
      <li
        class="hscs__slot"
        data-hscs-slot
        data-index="3"
        data-glyph="plate"
        aria-label="Sign 4 pending"
      >
        <span class="hscs__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <rect
              x="6"
              y="5"
              width="12"
              height="14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              d="M9 10h6M9 14h4"
            />
          </svg>
        </span>
      </li>
    </ol>
    <p class="hscs__status" data-hscs-status>IDLE</p>
    <p class="hscs__hint" data-hscs-hint>Press Run or keys 1–4 in order.</p>
  </div>

  <div class="hscs__controls">
    <button type="button" class="hscs__btn hscs__btn--primary" data-hscs-run>Run</button>
    <button type="button" class="hscs__btn" data-hscs-replay>Replay</button>
  </div>
</div>
