<div class="ssc" data-ssc data-phase="idle">
  <p class="ssc__live" data-ssc-live aria-live="polite">
    Document pending. No stamp applied.
  </p>

  <p class="ssc__system">SEAL // STAMP CONFIRM</p>

  <div class="ssc__stage" data-ssc-stage>
    <div class="ssc__paper">
      <p class="ssc__doc-line">MISSION REPORT</p>
      <p class="ssc__doc-line ssc__doc-line--sub">Status: pending review</p>
      <span class="ssc__mark" data-ssc-mark aria-hidden="true">
        <span class="ssc__mark-ring" data-ssc-ring></span>
        <svg viewBox="0 0 60 60" width="52" height="52">
          <circle cx="30" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="3" />
          <circle cx="30" cy="30" r="15" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
      </span>
    </div>
    <div class="ssc__stamp" data-ssc-stamp aria-hidden="true">
      <span class="ssc__stamp-head"></span>
      <span class="ssc__stamp-handle"></span>
    </div>
    <p class="ssc__status" data-ssc-status>PENDING</p>
    <p class="ssc__hint" data-ssc-hint>Press Run to strike the seal stamp.</p>
  </div>

  <div class="ssc__controls">
    <button type="button" class="ssc__btn ssc__btn--primary" data-ssc-run>Run</button>
    <button type="button" class="ssc__btn" data-ssc-replay>Replay</button>
  </div>
</div>
