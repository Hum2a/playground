<div class="tmt" data-tmt data-phase="idle">
  <p class="tmt__live" data-tmt-live aria-live="polite">
    Technique tree locked. Four nodes pending.
  </p>

  <p class="tmt__system">TREE // MASTERY</p>

  <div class="tmt__stage" data-tmt-stage>
    <ol class="tmt__row" data-tmt-row aria-label="Technique mastery path">
      <li class="tmt__node" data-tmt-node data-index="0" aria-label="Node 1 locked">1</li>
      <li class="tmt__path" data-tmt-path data-index="0" aria-hidden="true"></li>
      <li class="tmt__node" data-tmt-node data-index="1" aria-label="Node 2 locked">2</li>
      <li class="tmt__path" data-tmt-path data-index="1" aria-hidden="true"></li>
      <li class="tmt__node" data-tmt-node data-index="2" aria-label="Node 3 locked">3</li>
      <li class="tmt__path" data-tmt-path data-index="2" aria-hidden="true"></li>
      <li class="tmt__node" data-tmt-node data-index="3" aria-label="Node 4 locked">4</li>
    </ol>
    <p class="tmt__status" data-tmt-status>LOCKED</p>
    <p class="tmt__hint" data-tmt-hint>Press Run or keys 1–4 in order.</p>
  </div>

  <div class="tmt__controls">
    <button type="button" class="tmt__btn tmt__btn--primary" data-tmt-run>Run</button>
    <button type="button" class="tmt__btn" data-tmt-replay>Replay</button>
  </div>
</div>
