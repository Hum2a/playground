<div class="emr" data-emr data-phase="idle">
  <p class="emr__live" data-emr-live aria-live="polite">
    Two elements idle. No result.
  </p>

  <p class="emr__system">RECIPE // ELEMENT MERGE</p>

  <div class="emr__stage" data-emr-stage>
    <div class="emr__track" data-emr-track>
      <span class="emr__slot" aria-hidden="true"></span>
      <span class="emr__orb emr__orb--a" data-emr-orb-a aria-hidden="true"></span>
      <span class="emr__orb emr__orb--b" data-emr-orb-b aria-hidden="true"></span>
      <span class="emr__flash" data-emr-flash aria-hidden="true"></span>
      <span class="emr__result" data-emr-result aria-hidden="true"></span>
    </div>
    <p class="emr__status" data-emr-status>IDLE</p>
    <p class="emr__hint" data-emr-hint>Press Run to merge the two elements.</p>
  </div>

  <div class="emr__controls">
    <button type="button" class="emr__btn emr__btn--primary" data-emr-run>Run</button>
    <button type="button" class="emr__btn" data-emr-replay>Replay</button>
  </div>
</div>
