<div class="csl" data-csl data-phase="idle">
  <p class="csl__live" data-csl-live aria-live="polite">
    Seal unlocked. Ring misaligned at −42°.
  </p>

  <p class="csl__system">SEAL // LOCK RING</p>

  <div class="csl__stage" data-csl-stage>
    <svg class="csl__seal" viewBox="0 0 120 120" width="140" height="140" aria-hidden="true">
      <circle class="csl__rim" cx="60" cy="60" r="52" />
      <g class="csl__index-marks" data-csl-ticks>
        <line x1="60" y1="8" x2="60" y2="18" transform="rotate(0 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(30 60 60)" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(60 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(90 60 60)" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(120 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(150 60 60)" />
        <line x1="60" y1="8" x2="60" y2="18" transform="rotate(180 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(210 60 60)" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(240 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(270 60 60)" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(300 60 60)" data-major="true" />
        <line x1="60" y1="8" x2="60" y2="14" transform="rotate(330 60 60)" />
      </g>
      <circle class="csl__engage" data-csl-engage cx="60" cy="60" r="52" />
      <g class="csl__ring" data-csl-ring>
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(0 60 60)" />
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(60 60 60)" />
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(120 60 60)" />
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(180 60 60)" />
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(240 60 60)" />
        <line class="csl__mark" x1="60" y1="14" x2="60" y2="30" transform="rotate(300 60 60)" />
      </g>
      <circle class="csl__core" data-csl-core cx="60" cy="60" r="15" />
    </svg>
    <p class="csl__status" data-csl-status>UNLOCKED</p>
    <p class="csl__hint" data-csl-hint>Press Run to rotate the ring into alignment.</p>
  </div>

  <div class="csl__controls">
    <button type="button" class="csl__btn csl__btn--primary" data-csl-run>Run</button>
    <button type="button" class="csl__btn" data-csl-replay>Replay</button>
  </div>
</div>
