<div class="srm" data-srm data-phase="closed">
  <p class="srm__live" data-srm-live aria-live="polite">
    Menu closed.
  </p>

  <p class="srm__system">MENU // RADIAL</p>

  <div class="srm__stage" data-srm-stage>
    <div class="srm__wheel" data-srm-wheel>
      <button type="button" class="srm__hub" data-srm-hub aria-label="Open action menu">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z" />
        </svg>
      </button>

      <div class="srm__sectors" data-srm-sectors aria-hidden="true">
        <button type="button" class="srm__sector srm__sector--n" data-srm-sector tabindex="-1" aria-label="Action north">N</button>
        <button type="button" class="srm__sector srm__sector--e" data-srm-sector tabindex="-1" aria-label="Action east">E</button>
        <button type="button" class="srm__sector srm__sector--s" data-srm-sector tabindex="-1" aria-label="Action south">S</button>
        <button type="button" class="srm__sector srm__sector--w" data-srm-sector tabindex="-1" aria-label="Action west">W</button>
      </div>
    </div>

    <p class="srm__status" data-srm-status>CLOSED</p>
    <p class="srm__hint" data-srm-hint>Press Run to open the radial menu.</p>
  </div>

  <div class="srm__controls">
    <button type="button" class="srm__btn srm__btn--primary" data-srm-run>Run</button>
    <button type="button" class="srm__btn" data-srm-replay>Replay</button>
  </div>
</div>
