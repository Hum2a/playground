<div class="vhc" data-vhc data-phase="idle">
  <p class="vhc__live" data-vhc-live aria-live="polite">
    Core idle. Hold to build.
  </p>

  <p class="vhc__system">CORE // HOLD</p>

  <div class="vhc__stage" data-vhc-stage>
    <button type="button" class="vhc__button" data-vhc-button aria-label="Hold to build the core">
      <span class="vhc__ring vhc__ring--1" aria-hidden="true"></span>
      <span class="vhc__ring vhc__ring--2" aria-hidden="true"></span>
      <span class="vhc__ring vhc__ring--3" aria-hidden="true"></span>
      <span class="vhc__core" aria-hidden="true"></span>
      <span class="vhc__flash" aria-hidden="true"></span>
    </button>
    <p class="vhc__status" data-vhc-status>IDLE</p>
    <p class="vhc__hint" data-vhc-hint>Hold the core, or press Run.</p>
  </div>

  <div class="vhc__controls">
    <button type="button" class="vhc__btn vhc__btn--primary" data-vhc-run>Run</button>
    <button type="button" class="vhc__btn" data-vhc-replay>Replay</button>
  </div>
</div>
