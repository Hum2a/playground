<div class="ess" data-ess data-phase="idle">
  <p class="ess__live" data-ess-live aria-live="polite">
    Exam panel locked. Seal intact.
  </p>

  <p class="ess__system">GATE // EXAM START</p>

  <div class="ess__stage" data-ess-stage>
    <div class="ess__panel" data-ess-panel>
      <p class="ess__panel-title">Written Section 1</p>
      <p class="ess__timer" data-ess-timer>00:00</p>
      <div class="ess__seal" data-ess-seal aria-hidden="true">
        <svg class="ess__seal-half ess__seal-half--l" data-ess-half="l" viewBox="0 0 50 100" width="36" height="72">
          <path d="M50 6 A44 44 0 0 0 50 94" fill="none" stroke="currentColor" stroke-width="3" />
          <path d="M50 20 A30 30 0 0 0 50 80" fill="none" stroke="currentColor" stroke-width="2" />
          <line x1="50" y1="6" x2="50" y2="94" stroke="currentColor" stroke-width="2" />
        </svg>
        <svg class="ess__seal-half ess__seal-half--r" data-ess-half="r" viewBox="0 0 50 100" width="36" height="72">
          <path d="M0 6 A44 44 0 0 1 0 94" fill="none" stroke="currentColor" stroke-width="3" />
          <path d="M0 20 A30 30 0 0 1 0 80" fill="none" stroke="currentColor" stroke-width="2" />
          <line x1="0" y1="6" x2="0" y2="94" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="ess__crack" data-ess-crack></span>
      </div>
    </div>
    <p class="ess__status" data-ess-status>LOCKED</p>
    <p class="ess__hint" data-ess-hint>Press Run to break the seal and begin.</p>
  </div>

  <div class="ess__controls">
    <button type="button" class="ess__btn ess__btn--primary" data-ess-run>Run</button>
    <button type="button" class="ess__btn" data-ess-replay>Replay</button>
  </div>
</div>
