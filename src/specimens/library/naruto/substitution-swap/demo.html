<div class="sbs" data-sbs data-phase="idle">
  <p class="sbs__live" data-sbs-live aria-live="polite">
    Substitution idle. Primary target active.
  </p>

  <p class="sbs__system">KAWARIMI // SUBSTITUTION</p>

  <div class="sbs__stage" data-sbs-stage>
    <div class="sbs__slot" data-sbs-slot>
      <div class="sbs__layer sbs__layer--primary" data-sbs-layer="primary">
        <span class="sbs__layer-eyebrow">PRIMARY</span>
        <span class="sbs__layer-title">Target Node</span>
      </div>
      <div class="sbs__layer sbs__layer--decoy" data-sbs-layer="decoy" aria-hidden="true">
        <span class="sbs__layer-eyebrow">LOG</span>
        <span class="sbs__layer-title">Proxy Decoy</span>
      </div>
      <div class="sbs__layer sbs__layer--resolved" data-sbs-layer="resolved" aria-hidden="true">
        <span class="sbs__layer-eyebrow">ACTIVE</span>
        <span class="sbs__layer-title">Failover Target</span>
      </div>
      <span class="sbs__puff" data-sbs-puff aria-hidden="true"></span>
    </div>
    <p class="sbs__status" data-sbs-status>PRIMARY</p>
    <p class="sbs__hint" data-sbs-hint>Press Run to trigger the substitution.</p>
  </div>

  <div class="sbs__controls">
    <button type="button" class="sbs__btn sbs__btn--primary" data-sbs-run>Run</button>
    <button type="button" class="sbs__btn" data-sbs-replay>Replay</button>
  </div>
</div>
