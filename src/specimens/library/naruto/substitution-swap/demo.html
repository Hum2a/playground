<div class="sbs" data-sbs data-phase="idle">
  <p class="sbs__live" data-sbs-live aria-live="polite">
    Substitution idle. Log target active.
  </p>

  <p class="sbs__system">FAILOVER // SWAP</p>

  <div class="sbs__stage" data-sbs-stage>
    <div class="sbs__slot" data-sbs-slot data-active="log">
      <div class="sbs__layer sbs__layer--log" data-sbs-layer="log">
        <span class="sbs__layer-eyebrow">LOG</span>
        <span class="sbs__layer-title">Primary Node</span>
      </div>
      <div class="sbs__layer sbs__layer--decoy" data-sbs-layer="decoy" aria-hidden="true">
        <span class="sbs__layer-eyebrow">DECOY</span>
        <span class="sbs__layer-title">Proxy Stand-In</span>
        <span class="sbs__grain" aria-hidden="true"></span>
      </div>
      <div class="sbs__layer sbs__layer--target" data-sbs-layer="target" aria-hidden="true">
        <span class="sbs__layer-eyebrow">TARGET</span>
        <span class="sbs__layer-title">True Failover</span>
      </div>
      <span class="sbs__puff" data-sbs-puff aria-hidden="true"></span>
    </div>
    <p class="sbs__status" data-sbs-status>LOG</p>
    <p class="sbs__hint" data-sbs-hint>Press Run to trigger the substitution.</p>
  </div>

  <div class="sbs__controls">
    <button type="button" class="sbs__btn sbs__btn--primary" data-sbs-run>Run</button>
    <button type="button" class="sbs__btn" data-sbs-replay>Replay</button>
  </div>
</div>
