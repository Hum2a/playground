<div class="lta" data-lta data-phase="idle">
  <p class="lta__live" data-lta-live aria-live="polite">
    Reticle idle. Target unlocked.
  </p>

  <p class="lta__system">LOCK // TARGET</p>

  <div class="lta__stage" data-lta-stage>
    <div class="lta__field" data-lta-field>
      <span class="lta__target" data-lta-target aria-hidden="true"></span>
      <span class="lta__reticle" data-lta-reticle aria-hidden="true">
        <span class="lta__corner lta__corner--tl"></span>
        <span class="lta__corner lta__corner--tr"></span>
        <span class="lta__corner lta__corner--bl"></span>
        <span class="lta__corner lta__corner--br"></span>
        <span class="lta__bolt lta__bolt--1"></span>
        <span class="lta__bolt lta__bolt--2"></span>
        <span class="lta__bolt lta__bolt--3"></span>
      </span>
    </div>
    <p class="lta__status" data-lta-status>IDLE</p>
    <p class="lta__hint" data-lta-hint>Press Run to acquire the target.</p>
  </div>

  <div class="lta__controls">
    <button type="button" class="lta__btn lta__btn--primary" data-lta-run>Run</button>
    <button type="button" class="lta__btn" data-lta-replay>Replay</button>
  </div>
</div>
