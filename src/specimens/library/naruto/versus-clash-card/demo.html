<div class="vcc" data-vcc data-phase="idle">
  <p class="vcc__live" data-vcc-live aria-live="polite">
    Match standby. Competitors apart.
  </p>

  <p class="vcc__system">CLASH // VERSUS</p>

  <div class="vcc__stage" data-vcc-stage>
    <div class="vcc__lane">
      <span class="vcc__card vcc__card--left" data-vcc-card-left>PROFILE A</span>
      <span class="vcc__vs" data-vcc-vs aria-hidden="true">VS</span>
      <span class="vcc__card vcc__card--right" data-vcc-card-right>PROFILE B</span>
    </div>
    <p class="vcc__status" data-vcc-status>STANDBY</p>
    <p class="vcc__hint" data-vcc-hint>Press Run to start the clash.</p>
  </div>

  <div class="vcc__controls">
    <button type="button" class="vcc__btn vcc__btn--primary" data-vcc-run>Run</button>
    <button type="button" class="vcc__btn" data-vcc-replay>Replay</button>
  </div>
</div>
