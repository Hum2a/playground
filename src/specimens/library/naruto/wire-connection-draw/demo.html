<div class="wcd" data-wcd data-phase="idle">
  <p class="wcd__live" data-wcd-live aria-live="polite">
    Idle. Nodes A and B are unconnected.
  </p>

  <p class="wcd__system">LINK // WIRE</p>

  <div class="wcd__stage" data-wcd-stage>
    <svg
      class="wcd__svg"
      viewBox="0 0 100 40"
      preserveAspectRatio="none"
      aria-hidden="true"
      focusable="false"
    >
      <line
        class="wcd__wire"
        data-wcd-wire
        pathLength="100"
        x1="14"
        y1="20"
        x2="86"
        y2="20"
      />
    </svg>

    <div class="wcd__node wcd__node--a" data-wcd-node="a" aria-label="Node A unconnected">
      <span class="wcd__node-dot" aria-hidden="true"></span>
      <span class="wcd__node-label">NODE A</span>
    </div>
    <div class="wcd__node wcd__node--b" data-wcd-node="b" aria-label="Node B unconnected">
      <span class="wcd__node-dot" aria-hidden="true"></span>
      <span class="wcd__node-label">NODE B</span>
    </div>

    <p class="wcd__status" data-wcd-status>UNLINKED</p>
    <p class="wcd__hint" data-wcd-hint>Press Run to draw the connection.</p>
  </div>

  <div class="wcd__controls">
    <button type="button" class="wcd__btn wcd__btn--primary" data-wcd-run>Run</button>
    <button type="button" class="wcd__btn" data-wcd-replay>Replay</button>
  </div>
</div>
