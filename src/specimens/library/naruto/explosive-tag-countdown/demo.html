<div class="etc" data-etc data-phase="idle" data-level="0">
  <p class="etc__live" data-etc-live aria-live="polite">Tag idle. Countdown pending.</p>

  <p class="etc__system">TAG // COUNTDOWN</p>

  <div class="etc__stage" data-etc-stage>
    <div class="etc__tag" data-etc-tag aria-hidden="true">
      <span class="etc__fold"></span>
      <span class="etc__ring"></span>
      <span class="etc__digit" data-etc-digit>–</span>
      <span class="etc__flash"></span>
    </div>
    <p class="etc__status" data-etc-status>IDLE</p>
    <p class="etc__hint" data-etc-hint>Press Run to arm the tag.</p>
  </div>

  <div class="etc__controls">
    <button type="button" class="etc__btn etc__btn--primary" data-etc-run>Arm</button>
    <button type="button" class="etc__btn" data-etc-replay>Replay</button>
  </div>
</div>
