<div class="ccf" data-ccf data-phase="idle">
  <p class="ccf__live" data-ccf-live aria-live="polite">
    Charge field idle. No chakra committed.
  </p>

  <p class="ccf__system">CHARGE // FIELD</p>

  <div class="ccf__stage" data-ccf-stage>
    <button
      type="button"
      class="ccf__core"
      data-ccf-core
      aria-label="Hold to charge the chakra field"
    >
      <span class="ccf__boundary" aria-hidden="true">
        <span class="ccf__fill" data-ccf-fill></span>
      </span>
      <span class="ccf__pct" data-ccf-pct aria-hidden="true">0%</span>
    </button>
    <p class="ccf__status" data-ccf-status>IDLE</p>
    <p class="ccf__hint" data-ccf-hint>Hold the core to charge. Release commits the current level.</p>
  </div>

  <div class="ccf__controls">
    <button type="button" class="ccf__btn ccf__btn--primary" data-ccf-run>Run</button>
    <button type="button" class="ccf__btn" data-ccf-replay>Replay</button>
  </div>
</div>
