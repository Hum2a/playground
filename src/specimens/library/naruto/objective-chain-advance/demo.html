<div class="oca" data-oca data-phase="idle">
  <p class="oca__live" data-oca-live aria-live="polite">
    Mission idle. Objective one active.
  </p>

  <p class="oca__system">MISSION // OBJECTIVE CHAIN</p>

  <div class="oca__stage" data-oca-stage>
    <ol class="oca__chain" data-oca-chain aria-label="Objective chain">
      <li class="oca__node" data-oca-node data-index="0" data-state="current">
        <span class="oca__node-dot">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path class="oca__check" fill="none" stroke="currentColor" stroke-width="2.5" d="M5 12l5 5 9-10" />
          </svg>
        </span>
        <span class="oca__node-label">OBJ 1</span>
      </li>
      <li class="oca__link" data-oca-link data-index="0">
        <span class="oca__pulse" data-oca-pulse></span>
      </li>
      <li class="oca__node" data-oca-node data-index="1" data-state="pending">
        <span class="oca__node-dot">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path class="oca__check" fill="none" stroke="currentColor" stroke-width="2.5" d="M5 12l5 5 9-10" />
          </svg>
        </span>
        <span class="oca__node-label">OBJ 2</span>
      </li>
      <li class="oca__link" data-oca-link data-index="1">
        <span class="oca__pulse" data-oca-pulse></span>
      </li>
      <li class="oca__node" data-oca-node data-index="2" data-state="pending">
        <span class="oca__node-dot">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path class="oca__check" fill="none" stroke="currentColor" stroke-width="2.5" d="M5 12l5 5 9-10" />
          </svg>
        </span>
        <span class="oca__node-label">OBJ 3</span>
      </li>
      <li class="oca__link" data-oca-link data-index="2">
        <span class="oca__pulse" data-oca-pulse></span>
      </li>
      <li class="oca__node" data-oca-node data-index="3" data-state="pending">
        <span class="oca__node-dot">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path class="oca__check" fill="none" stroke="currentColor" stroke-width="2.5" d="M5 12l5 5 9-10" />
          </svg>
        </span>
        <span class="oca__node-label">OBJ 4</span>
      </li>
    </ol>

    <p class="oca__status" data-oca-status>IN PROGRESS</p>
    <p class="oca__hint" data-oca-hint>Press Run to advance the chain.</p>
  </div>

  <div class="oca__controls">
    <button type="button" class="oca__btn oca__btn--primary" data-oca-run>Run</button>
    <button type="button" class="oca__btn" data-oca-replay>Replay</button>
  </div>
</div>
