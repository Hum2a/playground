<div class="rpc" data-rpc data-phase="idle">
  <p class="rpc__live" data-rpc-live aria-live="polite">
    Profile shows current rank Genin.
  </p>

  <p class="rpc__system">PROFILE // RANK</p>

  <div class="rpc__stage" data-rpc-stage>
    <div class="rpc__card">
      <p class="rpc__name">Profile 07</p>
      <div class="rpc__badge-slot">
        <span class="rpc__badge rpc__badge--current" data-rpc-badge-current>GENIN</span>
        <span class="rpc__badge rpc__badge--next" data-rpc-badge-next>CHUNIN</span>
      </div>
    </div>
    <p class="rpc__status" data-rpc-status>CURRENT</p>
    <p class="rpc__hint" data-rpc-hint>Press Run to promote this profile.</p>
  </div>

  <div class="rpc__controls">
    <button type="button" class="rpc__btn rpc__btn--primary" data-rpc-run>Run</button>
    <button type="button" class="rpc__btn" data-rpc-replay>Replay</button>
  </div>
</div>
