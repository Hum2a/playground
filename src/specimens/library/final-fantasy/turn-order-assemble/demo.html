<section class="jrpg-turn-order" data-turn-order aria-label="Battle turn order">
  <p class="jrpg-turn-order__status" data-turn-status aria-live="polite">Turn order ready</p>
  <p class="jrpg-turn-order__heading">TURN ORDER</p>
  <div class="jrpg-turn-order__timeline" role="list" aria-label="Upcoming actions">
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ALLY A" style="--from-y: -92px">
      <span class="jrpg-turn-order__marker">01</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--ally"></span><span class="jrpg-turn-order__label">ALLY A</span>
    </button>
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ALLY B" style="--from-y: 80px">
      <span class="jrpg-turn-order__marker">02</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--ally"></span><span class="jrpg-turn-order__label">ALLY B</span>
    </button>
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ENEMY A" style="--from-y: -66px">
      <span class="jrpg-turn-order__marker">03</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--enemy"></span><span class="jrpg-turn-order__label">ENEMY A</span>
    </button>
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ALLY C" style="--from-y: 96px">
      <span class="jrpg-turn-order__marker">04</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--ally"></span><span class="jrpg-turn-order__label">ALLY C</span>
    </button>
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ENEMY B" style="--from-y: -84px">
      <span class="jrpg-turn-order__marker">05</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--enemy"></span><span class="jrpg-turn-order__label">ENEMY B</span>
    </button>
    <button class="jrpg-turn-order__token" type="button" role="listitem" data-actor="ENEMY C" style="--from-y: 68px">
      <span class="jrpg-turn-order__marker">06</span><span class="jrpg-turn-order__portrait jrpg-turn-order__portrait--enemy"></span><span class="jrpg-turn-order__label">ENEMY C</span>
    </button>
  </div>
</section>
