<div class="mdp" data-mdp data-state="ready">
  <p class="mdp__live" data-mdp-live aria-live="polite">Manga diagonal panel wipe ready.</p>

  <div class="mdp__plate" data-mdp-plate>
    <div class="mdp__surface mdp__surface--in" data-mdp-in aria-hidden="true">
      <p class="mdp__kicker">PAGE 12</p>
      <p class="mdp__title">ARRIVAL</p>
      <p class="mdp__body">Destination panel — hard light, open field.</p>
    </div>
    <div class="mdp__surface mdp__surface--out" data-mdp-out>
      <p class="mdp__kicker">PAGE 11</p>
      <p class="mdp__title">DEPARTURE</p>
      <p class="mdp__body">Outgoing panel — dense shade, closed street.</p>
    </div>
    <div class="mdp__wipe" data-mdp-wipe aria-hidden="true">
      <div class="mdp__gutter">
        <span class="mdp__strip"></span>
        <span class="mdp__rule"></span>
        <span class="mdp__speed"></span>
      </div>
    </div>
  </div>

  <div class="mdp__controls">
    <button type="button" class="mdp__btn" data-mdp-run>RUN WIPE</button>
    <button type="button" class="mdp__btn" data-mdp-replay hidden>REPLAY</button>
  </div>
</div>
