<div class="mps" data-mps data-state="ready">
  <p class="mps__live" data-mps-live aria-live="polite">Manga panel shatter ready.</p>

  <div class="mps__plate" data-mps-plate>
    <div class="mps__dest" data-mps-dest aria-hidden="true">
      <p class="mps__kicker">NEXT PAGE</p>
      <p class="mps__title">CLEARING</p>
      <p class="mps__body">Destination surface — already mounted underneath.</p>
    </div>

    <div class="mps__page" data-mps-page aria-hidden="true">
      <div class="mps__panel mps__panel--1" data-panel="1">
        <span class="mps__label">01</span>
        <span class="mps__caption">ROOFTOP</span>
      </div>
      <div class="mps__panel mps__panel--2" data-panel="2">
        <span class="mps__label">02</span>
        <span class="mps__caption">STREET</span>
      </div>
      <div class="mps__panel mps__panel--3" data-panel="3">
        <span class="mps__label">03</span>
        <span class="mps__caption">GATE</span>
      </div>
      <div class="mps__panel mps__panel--4" data-panel="4">
        <span class="mps__label">04</span>
        <span class="mps__caption">ALLEY</span>
      </div>
      <div class="mps__panel mps__panel--5" data-panel="5">
        <span class="mps__label">05</span>
        <span class="mps__caption">SIGNAL</span>
      </div>
      <div class="mps__panel mps__panel--6" data-panel="6">
        <span class="mps__label">06</span>
        <span class="mps__caption">EXIT</span>
      </div>
    </div>
  </div>

  <div class="mps__controls">
    <button type="button" class="mps__btn" data-mps-run>SHATTER</button>
    <button type="button" class="mps__btn" data-mps-replay hidden>REPLAY</button>
  </div>
</div>
