<div class="mdps" data-mdps-root data-state="idle">
  <div class="mdps__stage" aria-hidden="true">
    <div class="mdps__pages">
      <div class="mdps__page mdps__page--left">
        <div class="mdps__bleed" aria-hidden="true">
          <span class="mdps__panel mdps__panel--a"></span>
          <span class="mdps__panel mdps__panel--b"></span>
          <span class="mdps__panel mdps__panel--c"></span>
          <span class="mdps__mark mdps__mark--left"></span>

      </div>
      <div class="mdps__gutter" aria-hidden="true">

      </div>
      <div class="mdps__page mdps__page--right">

          <span class="mdps__panel mdps__panel--d"></span>
          <span class="mdps__panel mdps__panel--e"></span>
          <span class="mdps__panel mdps__panel--f"></span>

    </p>
  </div>
