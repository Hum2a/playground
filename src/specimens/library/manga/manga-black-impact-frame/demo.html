<div class="mbif" data-mbif data-phase="idle">
  <p class="mbif__live" data-mbif-live aria-live="polite">
    Action card ready. Confirm triggers one impact frame.
  </p>

  <p class="mbif__system">MANGA // IMPACT</p>

  <div class="mbif__plate" data-mbif-plate>
    <article class="mbif__card" data-mbif-card>
      <p class="mbif__kicker">CONSEQUENTIAL ACTION</p>
      <h2 class="mbif__title">Commit archive write</h2>
      <p class="mbif__copy">One deliberate confirm. No hover. No loop.</p>
      <p class="mbif__badge" data-mbif-badge hidden>CONFIRMED</p>
    </article>

    <div class="mbif__impact" data-mbif-impact aria-hidden="true">
      <div class="mbif__sil" data-mbif-sil aria-hidden="true"></div>
    </div>
  </div>

  <div class="mbif__controls">
    <button type="button" class="mbif__btn mbif__btn--primary" data-mbif-confirm>
      Confirm
    </button>
    <button type="button" class="mbif__btn" data-mbif-reset>Reset</button>
  </div>
</div>
