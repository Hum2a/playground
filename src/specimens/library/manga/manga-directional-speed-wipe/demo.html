<div class="mdsw" data-mdsw data-phase="idle">
  <p class="mdsw__live" data-mdsw-live aria-live="polite">
    Panel A. Ready for directional speed wipe.
  </p>

  <p class="mdsw__system">MANGA // WIPE</p>

  <div class="mdsw__host" data-mdsw-host>
    <div class="mdsw__surface mdsw__surface--out" data-mdsw-out>
      <p class="mdsw__label">PANEL A</p>
      <p class="mdsw__copy">Source surface</p>
    </div>
    <div class="mdsw__surface mdsw__surface--in" data-mdsw-in aria-hidden="true">
      <p class="mdsw__label">PANEL B</p>
      <p class="mdsw__copy">Destination surface</p>
    </div>
    <div class="mdsw__lines" data-mdsw-lines aria-hidden="true"></div>
  </div>

  <div class="mdsw__controls">
    <button type="button" class="mdsw__btn mdsw__btn--primary" data-mdsw-run>Wipe</button>
    <button type="button" class="mdsw__btn" data-mdsw-replay>Replay</button>
  </div>
</div>
