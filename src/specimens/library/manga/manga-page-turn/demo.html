<div class="manga-page-turn" data-page-state="first">
  <div class="manga-page-turn__perspective">
    <div class="manga-page-turn__stage" aria-hidden="true">
      <article class="manga-page-turn__page manga-page-turn__page--next">
        <p class="manga-page-turn__chapter">CHAPTER 05</p>
        <div class="manga-page-turn__panels">
          <div class="manga-page-turn__panel manga-page-turn__panel--wide">
            <span>THE NEXT SIGNAL</span>
          </div>
          <div class="manga-page-turn__panel manga-page-turn__panel--burst">
            <span>GO</span>
          </div>
          <div class="manga-page-turn__panel">
            <span>ROUTE<br>LEFT</span>
          </div>
        </div>
        <p class="manga-page-turn__folio">005</p>
      </article>
      <article class="manga-page-turn__page manga-page-turn__page--current">
        <p class="manga-page-turn__chapter">CHAPTER 04</p>
        <div class="manga-page-turn__panels">
          <div class="manga-page-turn__panel manga-page-turn__panel--dark">
            <span>TURN</span>
          </div>
          <div class="manga-page-turn__panel">
            <span>OUTER<br>EDGE</span>
          </div>
          <div class="manga-page-turn__panel manga-page-turn__panel--lines">
            <span>NEXT →</span>
          </div>
        </div>
        <p class="manga-page-turn__folio">004</p>
        <span class="manga-page-turn__fold"></span>
      </article>
    </div>
  </div>
  <div class="manga-page-turn__controls">
    <button type="button" data-page-next>Next</button>
    <button type="button" data-page-reset>Replay</button>
    <p data-page-status role="status" aria-live="polite">Page 004 is ready to turn left.</p>
  </div>
</div>
