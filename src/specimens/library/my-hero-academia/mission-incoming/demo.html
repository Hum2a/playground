<div class="mi" data-mi data-phase="idle">
  <p class="mi__live" data-mi-live aria-live="polite">Dispatch channel idle.</p>

  <div class="mi__stage" data-mi-stage>
    <div class="mi__silhouette" aria-hidden="true"></div>

    <div class="mi__lines" aria-hidden="true">
      <span class="mi__line mi__line--1"></span>
      <span class="mi__line mi__line--2"></span>
      <span class="mi__line mi__line--3"></span>
      <span class="mi__line mi__line--4"></span>
      <span class="mi__line mi__line--5"></span>
      <span class="mi__line mi__line--6"></span>
    </div>

    <article class="mi__card" data-mi-card>
      <header class="mi__head">
        <span class="mi__badge">ALERT</span>
        <span class="mi__ref">MISSION</span>
      </header>
      <h2 class="mi__title">Incoming dispatch</h2>
      <p class="mi__body">Priority route update — respond within window.</p>
      <div class="mi__bar" aria-hidden="true"></div>
    </article>
  </div>

  <div class="mi__controls">
    <button type="button" class="mi__btn mi__btn--primary" data-mi-run>Dispatch</button>
    <button type="button" class="mi__btn" data-mi-replay>Replay</button>
  </div>
</div>
