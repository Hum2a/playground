<div class="tfs" data-tfs data-phase="idle">
  <p class="tfs__live" data-tfs-live aria-live="polite">Units scattered.</p>

  <div class="tfs__stage" data-tfs-stage>
    <div class="tfs__slot tfs__slot--1" aria-hidden="true"></div>
    <div class="tfs__slot tfs__slot--2" aria-hidden="true"></div>
    <div class="tfs__slot tfs__slot--3" aria-hidden="true"></div>

    <article class="tfs__card tfs__card--a" data-tfs-card="a">
      <span class="tfs__id">A-01</span>
      <span class="tfs__role">STRIKE</span>
    </article>
    <article class="tfs__card tfs__card--b" data-tfs-card="b">
      <span class="tfs__id">B-02</span>
      <span class="tfs__role">SUPPORT</span>
    </article>
    <article class="tfs__card tfs__card--c" data-tfs-card="c">
      <span class="tfs__id">C-03</span>
      <span class="tfs__role">RECON</span>
    </article>
  </div>

  <p class="tfs__stamp" data-tfs-stamp hidden>
    <span class="tfs__stamp-text">UNIT READY</span>
  </p>

  <div class="tfs__controls">
    <button type="button" class="tfs__btn tfs__btn--primary" data-tfs-run>Form up</button>
    <button type="button" class="tfs__btn" data-tfs-replay>Replay</button>
  </div>
</div>
