<div class="htm" data-hold-max data-phase="idle" data-fill="0">

    <svg class="htm__ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="htm__ring-track" cx="60" cy="60" r="52" />
      <circle class="htm__ring-fill" data-htm-ring cx="60" cy="60" r="52" />
      <g class="htm__notches" fill="var(--paper)">
        <rect class="htm__notch" x="58" y="4" width="4" height="10" />
        <rect class="htm__notch" x="106" y="58" width="10" height="4" />
        <rect class="htm__notch" x="58" y="106" width="4" height="10" />
        <rect class="htm__notch" x="4" y="58" width="10" height="4" />
        <rect class="htm__notch htm__notch--q1" x="88" y="18" width="3" height="8" />
        <rect class="htm__notch htm__notch--q2" x="94" y="88" width="8" height="3" />
        <rect class="htm__notch htm__notch--q3" x="18" y="94" width="3" height="8" />
        <rect class="htm__notch htm__notch--q4" x="18" y="29" width="8" height="3" />
      </g>
      <g class="htm__overload" data-htm-overload aria-hidden="true">
        <rect x="56" y="2" width="8" height="6" />
        <rect x="112" y="56" width="6" height="8" />
        <rect x="56" y="112" width="8" height="6" />
        <rect x="2" y="56" width="6" height="8" />
      </g>
    </svg>
    <button type="button" class="htm__output" data-htm-btn>OUTPUT</button>
    <p class="htm__pct" data-htm-pct>0%</p>
  </div>
  <p class="htm__hint" data-htm-hint>Hold OUTPUT to charge.</p>
  <button type="button" class="htm__btn htm__btn--ghost" data-htm-reset hidden>RESET</button>
  <p class="htm__live" role="status" aria-live="polite" data-htm-live>Ready to charge.</p>
</div>
