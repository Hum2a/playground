<div class="mob" data-mob data-phase="idle">
  <p class="mob__live" data-mob-live aria-live="polite">Output at zero. Nominal limit 100%.</p>

  <div class="mob__frame" data-mob-frame>
    <div class="mob__track">
      <div class="mob__fill" data-mob-fill></div>
      <div class="mob__burst" data-mob-burst aria-hidden="true"></div>
    </div>
    <div class="mob__labels">
      <span class="mob__label">OUTPUT</span>
      <span class="mob__max" data-mob-max>0%</span>
    </div>
    <p class="mob__status" data-mob-status>NOMINAL 100%</p>
  </div>

  <div class="mob__controls">
    <button type="button" class="mob__btn mob__btn--primary" data-mob-run>Breakthrough</button>
    <button type="button" class="mob__btn" data-mob-replay>Replay</button>
  </div>
</div>
