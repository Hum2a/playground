<div class="lci" data-license-card data-phase="idle">
  <div class="lci__stage">
    <article class="lci__card" data-lci-card>
      <div class="lci__photo" data-lci-photo aria-hidden="true">
        <span class="lci__photo-frame"></span>
      </div>
      <div class="lci__data" data-lci-data aria-hidden="true">
        <p class="lci__line" data-lci-line="1">ID — H-2847</p>
        <p class="lci__line" data-lci-line="2">CLASS — PROVISIONAL</p>
        <p class="lci__line" data-lci-line="3">RANK — TRAINEE</p>
      </div>
      <div class="lci__seal" data-lci-seal aria-hidden="true">
        <span class="lci__seal-ring"></span>
        <span class="lci__seal-text">VALID</span>
      </div>
    </article>
  </div>
  <button type="button" class="lci__btn" data-lci-run>ISSUE</button>
  <button type="button" class="lci__btn lci__btn--ghost" data-lci-reset hidden>RESET</button>
  <p class="lci__live" role="status" aria-live="polite" data-lci-live>Blank credential slot.</p>
</div>
