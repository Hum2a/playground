<div class="est" data-emergency-takeover>
  <div class="est__host" aria-hidden="true">
    <div class="est__host-bar">
      <span class="est__host-dot"></span>
      <span class="est__host-dot"></span>
      <span class="est__host-dot"></span>
      <span class="est__host-title">HERO OS // v3.2</span>
    </div>
    <div class="est__host-body">
      <p class="est__host-line">Channel A — online</p>
      <p class="est__host-line">Channel B — online</p>
      <p class="est__host-line est__host-line--muted">Telemetry sync OK</p>
    </div>
  </div>

  <div class="est__calm" data-est-calm>
    <p class="est__label">SYSTEM MONITOR</p>
    <p class="est__line">All channels nominal</p>
    <p class="est__line est__line--muted">Last sync: 08:42</p>
    <button type="button" class="est__trigger" data-est-trigger>ALERT</button>
  </div>

  <div class="est__overlay" data-est-overlay hidden aria-hidden="true">
    <span class="est__plane est__plane--a" aria-hidden="true"></span>
    <span class="est__plane est__plane--b" aria-hidden="true"></span>
    <div class="est__alert">
      <p class="est__alert-tag">EMERGENCY</p>
      <p class="est__alert-title">SCREEN TAKEOVER</p>
      <p class="est__alert-copy">THREAT LEVEL ELEVATED</p>
    </div>
  </div>

  <p class="est__status" role="status" aria-live="polite" data-est-status></p>
</div>
