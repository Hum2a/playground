<div class="ous" data-ous data-phase="idle">
  <p class="ous__live" data-ous-live aria-live="polite">Objectives active.</p>

  <ol class="ous__list">
    <li class="ous__item ous__item--active" data-ous-item="1">
      <span class="ous__label">TARGET</span>
      <span class="ous__slash" data-ous-slash aria-hidden="true"></span>
    </li>
    <li class="ous__item" data-ous-item="2">
      <span class="ous__label">ESCORT</span>
    </li>
  </ol>

  <div class="ous__controls">
    <button type="button" class="ous__btn ous__btn--primary" data-ous-run>Advance</button>
    <button type="button" class="ous__btn" data-ous-replay>Replay</button>
  </div>
</div>
