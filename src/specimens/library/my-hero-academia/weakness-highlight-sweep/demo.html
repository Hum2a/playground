<div class="whs" data-weakness-sweep data-phase="idle">
  <div class="whs__diagram">
    <p class="whs__title">PROFILE SCAN</p>
    <div class="whs__bars">
      <div class="whs__bar" style="--whs-val: 72%"><span>CORE</span><i></i></div>
      <div class="whs__bar whs__bar--weak" data-whs-weak style="--whs-val: 28%"><span>GUARD</span><i></i></div>
      <div class="whs__bar" style="--whs-val: 58%"><span>SPEED</span><i></i></div>
      <div class="whs__bar" style="--whs-val: 81%"><span>OUTPUT</span><i></i></div>
    </div>
    <span class="whs__sweep" aria-hidden="true"></span>
    <span class="whs__highlight" aria-hidden="true"></span>
  </div>
  <button type="button" class="whs__run" data-whs-run>RUN</button>
  <p class="whs__status" role="status" aria-live="polite" data-whs-status>Awaiting scan.</p>
</div>
