<div class="tss" data-training-start data-phase="idle">
  <div class="tss__ready" data-tss-ready>
    <p class="tss__ready-label">READY</p>
    <div class="tss__count-stack" data-tss-count-stack aria-hidden="true">
      <span class="tss__count-card" data-count="3">3</span>
      <span class="tss__count-card" data-count="2">2</span>
      <span class="tss__count-card" data-count="1">1</span>
      <span class="tss__count-card tss__count-card--go" data-count="GO">GO</span>
    </div>
    <p class="tss__count" data-tss-count aria-hidden="true">3</p>
  </div>
  <div class="tss__telemetry" data-tss-telemetry aria-hidden="true">
    <div class="tss__tile" data-tss-tile="0"><span>PULSE</span><strong data-tss-pulse>—</strong></div>
    <div class="tss__tile" data-tss-tile="1"><span>LOAD</span><strong data-tss-load>—</strong></div>
    <div class="tss__tile tss__tile--alert" data-tss-tile="2"><span>ALERT</span><strong>ACTIVE</strong></div>
  </div>
  <button type="button" class="tss__start" data-tss-start>START</button>
  <p class="tss__status" role="status" aria-live="polite" data-tss-status>Simulation standby.</p>
</div>
