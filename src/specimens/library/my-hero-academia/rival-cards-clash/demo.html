<div class="rcc" data-rival-cards-clash data-phase="idle">
  <button type="button" class="rcc__trigger" data-rcc-trigger>Clash</button>
  <div class="rcc__arena" aria-live="polite">
    <div class="rcc__divider" aria-hidden="true"></div>
    <div class="rcc__card rcc__card--left" data-rcc-card="left">
      <span class="rcc__tag">TARGET</span>
      <span class="rcc__label">ALPHA</span>
      <span class="rcc__rank">RANK 02</span>
    </div>
    <div class="rcc__card rcc__card--right" data-rcc-card="right">
      <span class="rcc__tag">TARGET</span>
      <span class="rcc__label">BETA</span>
      <span class="rcc__rank">RANK 03</span>
    </div>
    <div class="rcc__impact" aria-hidden="true">
      <span class="rcc__impact-label">READY</span>
    </div>
  </div>
  <p class="rcc__status" data-rcc-status>Awaiting rival clash.</p>
</div>
