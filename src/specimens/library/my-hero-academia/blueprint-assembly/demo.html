<div class="bpa" data-blueprint-assembly>
  <header class="bpa__head">
    <p class="bpa__label">GADGET BLUEPRINT</p>
    <button type="button" class="bpa__trigger" data-bpa-trigger>ASSEMBLE</button>
  </header>

  <div class="bpa__stage" data-bpa-stage>
    <span class="bpa__part bpa__part--a" data-bpa-part="a" aria-hidden="true">A</span>
    <span class="bpa__part bpa__part--b" data-bpa-part="b" aria-hidden="true">B</span>
    <span class="bpa__part bpa__part--c" data-bpa-part="c" aria-hidden="true">C</span>
    <span class="bpa__part bpa__part--d" data-bpa-part="d" aria-hidden="true">D</span>
    <div class="bpa__device" data-bpa-device hidden>
      <p class="bpa__device-tag">UNIT READY</p>
      <p class="bpa__device-name">CAPTURE RIG</p>
    </div>
  </div>

  <p class="bpa__status" role="status" aria-live="polite" data-bpa-status></p>
</div>
