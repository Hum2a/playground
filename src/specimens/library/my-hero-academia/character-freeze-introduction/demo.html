<div class="cfi" data-cfi data-phase="idle">
  <p class="cfi__live" data-cfi-live aria-live="polite">Subject approaching.</p>

  <div class="cfi__stage" data-cfi-stage>
    <div class="cfi__motion" aria-hidden="true"></div>

    <div class="cfi__silhouette" data-cfi-silhouette aria-hidden="true"></div>

    <div class="cfi__brackets" data-cfi-brackets aria-hidden="true">
      <span class="cfi__br cfi__br--tl"></span>
      <span class="cfi__br cfi__br--tr"></span>
      <span class="cfi__br cfi__br--bl"></span>
      <span class="cfi__br cfi__br--br"></span>
    </div>

    <div class="cfi__card" data-cfi-card>
      <p class="cfi__eyebrow">PROFILE // LOCK</p>
      <p class="cfi__title">ANALYST</p>
      <p class="cfi__meta">RANK B · READY</p>
    </div>
  </div>

  <div class="cfi__controls">
    <button type="button" class="cfi__btn cfi__btn--primary" data-cfi-start>Start</button>
    <button type="button" class="cfi__btn" data-cfi-replay>Replay</button>
  </div>
</div>
