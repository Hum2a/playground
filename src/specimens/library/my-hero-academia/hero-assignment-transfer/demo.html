<div class="hat" data-hero-assignment>
  <div class="hat__roster">
    <p class="hat__label">AVAILABLE</p>
    <div class="hat__chip" data-hat-chip>
      <span class="hat__chip-id">UNIT-12</span>
      <span class="hat__chip-role">SUPPORT</span>
    </div>
  </div>

  <div class="hat__incident">
    <p class="hat__label">INCIDENT #441</p>
    <div class="hat__slot" data-hat-slot>
      <span class="hat__slot-tick hat__slot-tick--tl" aria-hidden="true"></span>
      <span class="hat__slot-tick hat__slot-tick--tr" aria-hidden="true"></span>
      <span class="hat__slot-tick hat__slot-tick--bl" aria-hidden="true"></span>
      <span class="hat__slot-tick hat__slot-tick--br" aria-hidden="true"></span>
      <span class="hat__slot-hint">ASSIGN UNIT</span>
    </div>
  </div>

  <button type="button" class="hat__trigger" data-hat-trigger>ASSIGN</button>
  <p class="hat__status" role="status" aria-live="polite" data-hat-status></p>
</div>
