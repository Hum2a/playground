<div class="ouw" data-overuse-warning data-phase="idle" data-level="0">
  <p class="ouw__title">OUTPUT STRAIN</p>
  <div class="ouw__readout">
    <span class="ouw__pct" data-ouw-pct>25%</span>
    <span class="ouw__label" data-ouw-label>NOMINAL</span>
  </div>
  <div class="ouw__frame">
    <div class="ouw__hazards" aria-hidden="true">
      <span class="ouw__plate ouw__plate--tl"></span>
      <span class="ouw__plate ouw__plate--tr"></span>
      <span class="ouw__plate ouw__plate--bl"></span>
      <span class="ouw__plate ouw__plate--br"></span>
    </div>
    <div class="ouw__meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="25" aria-label="Output strain">
      <div class="ouw__fill" data-ouw-fill></div>
      <span class="ouw__warn" aria-hidden="true">WARNING</span>
    </div>
  </div>
  <div class="ouw__controls">
    <button type="button" class="ouw__btn" data-ouw-run>ACTIVATE</button>
    <button type="button" class="ouw__btn ouw__btn--ghost" data-ouw-reset hidden>RESET</button>
  </div>
  <p class="ouw__live" role="status" aria-live="polite" data-ouw-live>Strain nominal at 25%.</p>
</div>
