<div class="wbb" data-winner-banner data-phase="idle">
  <div class="wbb__board">
    <p class="wbb__head">MATCH RESULT</p>
    <div class="wbb__scores">
      <div class="wbb__side">
        <span class="wbb__team">TEAM A</span>
        <span class="wbb__score wbb__score--winner" data-wbb-a>12</span>
      </div>
      <span class="wbb__vs">VS</span>
      <div class="wbb__side">
        <span class="wbb__team">TEAM B</span>
        <span class="wbb__score" data-wbb-b>8</span>
      </div>
    </div>
    <div class="wbb__banner-slot">
      <div class="wbb__banner" data-wbb-banner aria-hidden="true">
        <span class="wbb__banner-text">WINNER — TEAM A</span>
      </div>
    </div>
  </div>
  <button type="button" class="wbb__btn" data-wbb-run>DECLARE WINNER</button>
  <button type="button" class="wbb__btn wbb__btn--ghost" data-wbb-reset hidden>RESET</button>
  <p class="wbb__live" role="status" aria-live="polite" data-wbb-live>Scores settled. Awaiting declaration.</p>
</div>
