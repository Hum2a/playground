<div class="tac" data-target-acquisition data-phase="idle" data-selected="">
  <p class="tac__title">TRAINING TARGETS</p>
  <div class="tac__grid" role="list">
    <button type="button" class="tac__card" data-tac-target data-index="0" role="listitem">
      <span class="tac__face">
        <span class="tac__id">T-01</span>
        <span class="tac__name">DRONE</span>
      </span>
      <span class="tac__lock" aria-hidden="true">
        <span class="tac__br tac__br--tl"></span>
        <span class="tac__br tac__br--tr"></span>
        <span class="tac__br tac__br--bl"></span>
        <span class="tac__br tac__br--br"></span>
        <span class="tac__conf">
          <span class="tac__conf-fill" data-tac-conf></span>
        </span>
        <span class="tac__locked">LOCKED</span>
      </span>
    </button>
    <button type="button" class="tac__card" data-tac-target data-index="1" role="listitem">
      <span class="tac__face">
        <span class="tac__id">T-02</span>
        <span class="tac__name">DUMMY</span>
      </span>
      <span class="tac__lock" aria-hidden="true">
        <span class="tac__br tac__br--tl"></span>
        <span class="tac__br tac__br--tr"></span>
        <span class="tac__br tac__br--bl"></span>
        <span class="tac__br tac__br--br"></span>
        <span class="tac__conf">
          <span class="tac__conf-fill" data-tac-conf></span>
        </span>
        <span class="tac__locked">LOCKED</span>
      </span>
    </button>
    <button type="button" class="tac__card" data-tac-target data-index="2" role="listitem">
      <span class="tac__face">
        <span class="tac__id">T-03</span>
        <span class="tac__name">BOT</span>
      </span>
      <span class="tac__lock" aria-hidden="true">
        <span class="tac__br tac__br--tl"></span>
        <span class="tac__br tac__br--tr"></span>
        <span class="tac__br tac__br--bl"></span>
        <span class="tac__br tac__br--br"></span>
        <span class="tac__conf">
          <span class="tac__conf-fill" data-tac-conf></span>
        </span>
        <span class="tac__locked">LOCKED</span>
      </span>
    </button>
  </div>
  <button type="button" class="tac__btn" data-tac-scan>SCAN</button>
  <p class="tac__live" role="status" aria-live="polite" data-tac-live>Select a target to scan.</p>
</div>
