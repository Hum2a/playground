<div class="hns" data-hns data-phase="idle">
  <p class="hns__live" data-hns-live aria-live="polite">Codename pending.</p>

  <div class="hns__stage" data-hns-stage>
    <div class="hns__bracket hns__bracket--l" aria-hidden="true"></div>
    <div class="hns__bracket hns__bracket--r" aria-hidden="true"></div>

    <div class="hns__name" data-hns-name>
      <span class="hns__prefix">UNIT</span>
      <span class="hns__code">07</span>
    </div>

    <p class="hns__role" data-hns-role>OUTPUT // READY</p>
  </div>

  <div class="hns__controls">
    <button type="button" class="hns__btn hns__btn--primary" data-hns-assign>Assign</button>
    <button type="button" class="hns__btn" data-hns-replay>Replay</button>
  </div>
</div>
