<div class="bis" data-bis data-phase="idle">
  <p class="bis__live" data-bis-live aria-live="polite">Action ready.</p>

  <article class="bis__card" data-bis-card>
    <p class="bis__eyebrow">PRIORITY</p>
    <h2 class="bis__title">Deploy response</h2>
    <div class="bis__origin" data-bis-origin>
      <button type="button" class="bis__btn" data-bis-activate>Activate</button>
      <span class="bis__ring bis__ring--1" data-bis-ring aria-hidden="true"></span>
      <span class="bis__ring bis__ring--2" data-bis-ring aria-hidden="true"></span>
      <span class="bis__ring bis__ring--3" data-bis-ring aria-hidden="true"></span>
    </div>
    <p class="bis__result" data-bis-result hidden role="status">COMPLETE</p>
  </article>

  <button type="button" class="bis__replay" data-bis-replay>Replay</button>
</div>
