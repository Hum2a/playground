<div class="iwt" data-iwt data-phase="idle">
  <p class="iwt__live" data-iwt-live aria-live="polite">Scene A active.</p>

  <div class="iwt__stage" data-iwt-stage>
    <div class="iwt__scene iwt__scene--a" data-iwt-scene-a>
      <span class="iwt__tag">ALPHA</span>
      <p class="iwt__copy">Current view</p>
    </div>
    <div class="iwt__scene iwt__scene--b" data-iwt-scene-b hidden>
      <span class="iwt__tag">BETA</span>
      <p class="iwt__copy">Destination</p>
    </div>
    <div class="iwt__ice" data-iwt-ice aria-hidden="true">
      <span class="iwt__shard iwt__shard--1"></span>
      <span class="iwt__shard iwt__shard--2"></span>
      <span class="iwt__shard iwt__shard--3"></span>
      <span class="iwt__shard iwt__shard--4"></span>
      <span class="iwt__shard iwt__shard--5"></span>
      <span class="iwt__shard iwt__shard--6"></span>
    </div>
  </div>

  <div class="iwt__controls">
    <button type="button" class="iwt__btn iwt__btn--primary" data-iwt-run>Transition</button>
    <button type="button" class="iwt__btn" data-iwt-replay>Replay</button>
  </div>
</div>
