<div class="idc" data-incident-dispatch>
  <div class="idc__dashboard" data-idc-dashboard>
    <p class="idc__label">OPS DASHBOARD</p>
    <p class="idc__status-line">STATUS: <strong>READY</strong></p>
    <p class="idc__meta">All sectors nominal</p>
    <button type="button" class="idc__trigger" data-idc-trigger>DISPATCH</button>
  </div>

  <article class="idc__card" data-idc-card hidden aria-hidden="true">
    <span class="idc__tear" aria-hidden="true"></span>
    <p class="idc__card-tag">INCIDENT</p>
    <p class="idc__card-title">SECTOR 7 BREACH</p>
    <p class="idc__card-priority">
      <span class="idc__priority-badge">CRITICAL</span>
    </p>
  </article>

  <p class="idc__status" role="status" aria-live="polite" data-idc-status></p>
</div>
