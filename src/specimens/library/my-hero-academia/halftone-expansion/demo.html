<div class="htx" data-halftone-expansion>
  <section class="htx__state htx__state--a" data-htx-state="a">
    <p class="htx__kicker">ZONE A</p>
    <h2 class="htx__title">STANDBY</h2>
    <button type="button" class="htx__btn" data-htx-trigger data-target="b">Activate</button>
  </section>
  <section class="htx__state htx__state--b" data-htx-state="b" hidden>
    <p class="htx__kicker">ZONE B</p>
    <h2 class="htx__title">COMPLETE</h2>
    <button type="button" class="htx__btn" data-htx-trigger data-target="a">Reset</button>
  </section>
  <div class="htx__mask" aria-hidden="true" data-htx-mask>
    <div class="htx__dots"></div>
  </div>
</div>
