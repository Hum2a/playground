<div class="tle" data-threat-level>
  <header class="tle__head">
    <p class="tle__label">THREAT METER</p>
    <button type="button" class="tle__trigger" data-tle-trigger>ESCALATE</button>
  </header>

  <ol class="tle__levels" data-tle-levels>
    <li class="tle__level tle__level--active tle__level--1" data-level="1">
      <span>LV 1</span><small>LOW</small>
    </li>
    <li class="tle__level tle__level--2" data-level="2">
      <span>LV 2</span><small>GUARDED</small>
    </li>
    <li class="tle__level tle__level--3" data-level="3">
      <span>LV 3</span><small>ELEVATED</small>
    </li>
    <li class="tle__level tle__level--4" data-level="4">
      <span>LV 4</span><small>HIGH</small>
    </li>
    <li class="tle__level tle__level--5" data-level="5">
      <span>LV 5</span><small>CRITICAL</small>
    </li>
  </ol>

  <p class="tle__readout" data-tle-readout>Current: LEVEL 1 — LOW</p>
  <p class="tle__status" role="status" aria-live="polite" data-tle-status></p>
</div>
