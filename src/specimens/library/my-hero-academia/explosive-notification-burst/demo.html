<div class="enb" data-enb data-phase="idle">
  <p class="enb__live" data-enb-live aria-live="polite">Channel clear.</p>

  <div class="enb__stage" data-enb-stage>
    <div class="enb__burst" data-enb-burst aria-hidden="true"></div>
    <article class="enb__card" data-enb-card hidden>
      <span class="enb__badge">ALERT</span>
      <p class="enb__title">Priority notice</p>
      <p class="enb__body">Response required — review dispatch.</p>
    </article>
  </div>

  <div class="enb__controls">
    <button type="button" class="enb__btn enb__btn--primary" data-enb-run>Trigger</button>
    <button type="button" class="enb__btn" data-enb-replay>Replay</button>
  </div>
</div>
