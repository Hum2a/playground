<div class="radar-pulse" data-radar-pulse data-state="idle">
  <header class="radar-pulse__chrome">
    <p class="radar-pulse__sector">SECTOR // 07</p>
    <p class="radar-pulse__status" data-rp-status aria-live="polite">
      <span class="radar-pulse__status-clip" data-rp-status-clip>
        <span class="radar-pulse__status-word" data-rp-word-idle>NO SIGNAL</span>
        <span
          class="radar-pulse__status-word radar-pulse__status-word--found"
          data-rp-word-found
          aria-hidden="true"
        >SIGNAL FOUND</span>
      </span>
    </p>
    <p class="radar-pulse__edge">LEADING EDGE // D → C → A → B</p>
  </header>

  <div class="radar-pulse__field" data-rp-field>
    <span class="radar-pulse__mark" style="left:8%;top:12%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:22%;top:8%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:41%;top:14%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:58%;top:9%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:86%;top:15%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:12%;top:32%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:33%;top:28%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:49%;top:36%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:78%;top:31%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:93%;top:38%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:6%;top:48%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:28%;top:52%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:52%;top:47%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:81%;top:54%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:15%;top:66%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:44%;top:71%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:69%;top:68%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:91%;top:72%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:10%;top:88%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:36%;top:86%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:55%;top:91%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:74%;top:84%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:88%;top:90%" aria-hidden="true"></span>
    <span class="radar-pulse__mark" style="left:47%;top:22%" aria-hidden="true"></span>

    <button type="button" class="radar-pulse__target radar-pulse__target--a" data-rp-target="A" aria-hidden="true" tabindex="-1"></button>
    <button type="button" class="radar-pulse__target radar-pulse__target--b" data-rp-target="B" aria-hidden="true" tabindex="-1"></button>
    <button type="button" class="radar-pulse__target radar-pulse__target--c" data-rp-target="C" aria-hidden="true" tabindex="-1">
      <span class="radar-pulse__brackets" aria-hidden="true">
        <span class="radar-pulse__bracket radar-pulse__bracket--tl"></span>
        <span class="radar-pulse__bracket radar-pulse__bracket--tr"></span>
        <span class="radar-pulse__bracket radar-pulse__bracket--bl"></span>
        <span class="radar-pulse__bracket radar-pulse__bracket--br"></span>
      </span>
      <span class="radar-pulse__node-label" data-rp-node-label>NODE // C</span>
    </button>
    <button type="button" class="radar-pulse__target radar-pulse__target--d" data-rp-target="D" aria-hidden="true" tabindex="-1">
      <span class="radar-pulse__blip" aria-hidden="true"></span>
      <span class="radar-pulse__blip radar-pulse__blip--2" aria-hidden="true"></span>
    </button>

    <div class="radar-pulse__origin" data-rp-origin aria-hidden="true"></div>
    <div class="radar-pulse__pulses" data-rp-pulses aria-hidden="true">
      <span class="radar-pulse__ring radar-pulse__ring--1" data-rp-ring="1"></span>
      <span class="radar-pulse__ring radar-pulse__ring--2" data-rp-ring="2"></span>
      <span class="radar-pulse__ring radar-pulse__ring--3" data-rp-ring="3"></span>
    </div>
    <div class="radar-pulse__link" data-rp-link aria-hidden="true"></div>
  </div>

  <button type="button" class="radar-pulse__btn" data-rp-scan>SCAN</button>
</div>
