<div class="luo" data-level-up-overflow data-state="idle">
  <div class="luo__panel">
    <p class="luo__title" id="luo-title">SPECIMEN MASTERY</p>

    <div class="luo__level-row">
      <span class="luo__level-label">LEVEL</span>
      <span class="luo__level-slot" aria-hidden="true">
        <span class="luo__level-num luo__level-num--out" data-luo-level-out>12</span>
        <span class="luo__level-num luo__level-num--in" data-luo-level-in>13</span>
      </span>
      <span class="luo__level-sr" data-luo-level-sr>12</span>
    </div>

    <div class="luo__xp-row">
      <p class="luo__xp" data-luo-xp>
        <span data-luo-cur>87</span>
        <span class="luo__sep">/</span>
        <span data-luo-max>100</span>
      </p>
    </div>

    <div class="luo__bar-wrap">
      <span class="luo__token" data-luo-token aria-hidden="true">+38 XP</span>

      <div
        class="luo__track"
        data-luo-track
        role="progressbar"
        aria-labelledby="luo-title"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="87"
        aria-valuetext="Level 12, 87 of 100 experience"
      >
        <div class="luo__fill" data-luo-fill style="width: 87%"></div>
        <span class="luo__tick luo__tick--a" aria-hidden="true"></span>
        <span class="luo__tick luo__tick--b" aria-hidden="true"></span>
      </div>
    </div>

    <p class="luo__applied" data-luo-applied hidden>+38 XP APPLIED</p>
  </div>

  <button type="button" class="luo__btn" data-luo-add>
    ADD XP
  </button>

  <div
    class="luo__status"
    role="status"
    aria-live="polite"
    data-luo-status
  ></div>
</div>
