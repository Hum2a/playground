<div class="est" data-evolution-silhouette data-state="idle" data-form="a">
  <div class="est__meta">
    <div class="est__meta-clip" data-est-id-slot>
      <p class="est__id est__id--from" data-est-id-from>FORM // 01</p>
      <p class="est__id est__id--to" data-est-id-to>FORM // 02</p>
    </div>
    <div class="est__meta-clip" data-est-tier-slot>
      <p class="est__tier est__tier--from" data-est-tier-from>BASIC</p>
      <p class="est__tier est__tier--to" data-est-tier-to>ADVANCED</p>
    </div>
  </div>

  <div class="est__stage" data-est-stage>
    <div class="est__scale" data-est-scale>
      <div class="est__rings" aria-hidden="true" data-est-rings>
        <span class="est__ring est__ring--1"></span>
        <span class="est__ring est__ring--2"></span>
        <span class="est__ring est__ring--3"></span>
      </div>

      <div class="est__marks" aria-hidden="true" data-est-marks>
        <span class="est__mark" style="--i: 0"></span>
        <span class="est__mark" style="--i: 1"></span>
        <span class="est__mark" style="--i: 2"></span>
        <span class="est__mark" style="--i: 3"></span>
        <span class="est__mark" style="--i: 4"></span>
        <span class="est__mark" style="--i: 5"></span>
        <span class="est__mark" style="--i: 6"></span>
        <span class="est__mark" style="--i: 7"></span>
      </div>

      <div
        class="est__sil"
        aria-hidden="true"
        data-est-sil
      ></div>
    </div>
  </div>

  <p class="est__sr" data-est-sr>
    Identity: Form 01 Basic.
  </p>

  <div class="est__actions">
    <button type="button" class="est__btn est__btn--go" data-est-evolve>
      EVOLVE
    </button>
    <button type="button" class="est__btn est__btn--reset" data-est-reset hidden>
      RESET
    </button>
  </div>

  <p class="est__live" role="status" aria-live="polite" data-est-live>
    Form 01 Basic ready.
  </p>
</div>
