<div class="ink-splat-demo" data-ink-splat-demo>

    <h1 class="ink-splat-demo__title">INK WELL</h1>
    <button type="button" class="ink-splat-demo__btn" data-ink-splat-trigger data-target="b">

  </section>
  <section class="ink-splat-demo__state ink-splat-demo__state--b" data-state="b" hidden>

      ← RETURN

  </section>
</div>
