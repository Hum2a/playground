<div class="stamp-unlock" data-stamp-unlock aria-hidden="true">
  <div class="stamp-unlock__ink" aria-hidden="true"></div>
  <div class="stamp-unlock__mark">
    <div class="stamp-unlock__ring stamp-unlock__ring--outer" aria-hidden="true"></div>
    <div class="stamp-unlock__ring stamp-unlock__ring--inner" aria-hidden="true"></div>
    <p class="stamp-unlock__word">UNLOCKED</p>
    <p class="stamp-unlock__sub">ACCESS &middot; GRANTED</p>
  </div>
  <div class="stamp-unlock__particles" aria-hidden="true">
    <span class="stamp-unlock__particle stamp-unlock__particle--1"></span>
    <span class="stamp-unlock__particle stamp-unlock__particle--2"></span>
    <span class="stamp-unlock__particle stamp-unlock__particle--3"></span>
    <span class="stamp-unlock__particle stamp-unlock__particle--4"></span>
    <span class="stamp-unlock__particle stamp-unlock__particle--5"></span>
  </div>
</div>
<button type="button" class="stamp-unlock-replay" data-stamp-unlock-replay>Replay</button>
