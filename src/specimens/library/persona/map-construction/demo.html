<div class="mc" data-mc>
  <p class="mc__live" data-mc-live aria-live="polite">Dungeon map — unexplored.</p>
  <div class="mc__frame" aria-hidden="true">
    <svg class="mc__svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="160" fill="#101010"/>
      <g class="mc__fog" data-mc-fog></g>
      <g class="mc__paths" data-mc-paths stroke="#F5C400" stroke-width="4" fill="none" stroke-linecap="square"></g>
      <circle class="mc__player" data-mc-player cx="24" cy="24" r="6" fill="#F5C400"/>
    </svg>
  </div>
  <div class="mc__controls">
    <button type="button" class="mc__btn mc__btn--primary" data-mc-explore>Explore</button>
    <button type="button" class="mc__btn" data-mc-reset>Reset</button>
  </div>
</div>
