<div class="finisher" data-finisher aria-hidden="true">
  <div class="finisher__backdrop" aria-hidden="true"></div>
  <div class="finisher__panels" aria-hidden="true">
    <span class="finisher__panel finisher__panel--1"></span>
    <span class="finisher__panel finisher__panel--2"></span>
    <span class="finisher__panel finisher__panel--3"></span>
  </div>
  <div class="finisher__flash" aria-hidden="true"></div>
  <div class="finisher__content">
    <p class="finisher__word">COMPLETE</p>
    <div class="finisher__rings" aria-hidden="true">
      <span class="finisher__ring finisher__ring--1"></span>
      <span class="finisher__ring finisher__ring--2"></span>
      <span class="finisher__ring finisher__ring--3"></span>
    </div>
    <p class="finisher__subline">All objectives cleared</p>
  </div>
  <div class="finisher__shards" aria-hidden="true">
    <span class="finisher__shard finisher__shard--1"></span>
    <span class="finisher__shard finisher__shard--2"></span>
    <span class="finisher__shard finisher__shard--3"></span>
    <span class="finisher__shard finisher__shard--4"></span>
    <span class="finisher__shard finisher__shard--5"></span>
    <span class="finisher__shard finisher__shard--6"></span>
  </div>
</div>
<button type="button" class="finisher-replay" data-finisher-replay>Replay</button>
