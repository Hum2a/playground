<div class="dli" data-dli data-state="idle">
  <div class="dli__stage">
    <div class="dli__obs dli__obs--a">WITNESS SAW LIGHT</div>
    <div class="dli__obs dli__obs--b">DOOR WAS LOCKED</div>
    <div class="dli__obs dli__obs--c">RAIN THAT NIGHT</div>
    <article class="dli__conclusion">
      <span class="dli__conclusion-label">CONCLUSION</span>
      <p class="dli__conclusion-text">INSIDE JOB</p>
    </article>
    <p class="dli__lock" data-dli-lock aria-hidden="true">LOCKED</p>
  </div>
  <p class="dli__status" role="status" aria-live="polite" data-dli-status>Observations pending.</p>
  <div class="dli__demo" aria-label="Demo controls">
    <button type="button" class="dli__btn" data-dli-run>LOCK IN</button>
    <button type="button" class="dli__btn" data-dli-reset>RESET</button>
  </div>
</div>
