<section class="nmls" data-nmls data-phase="idle" aria-labelledby="nmls-title">
  <div class="nmls__card">
    <h2 class="nmls__title" id="nmls-title">NIGHT ACCESS</h2>

    <div class="nmls__moon" aria-hidden="true">
      <span class="nmls__disc"></span>
      <span class="nmls__glint"></span>
    </div>

    <p class="nmls__restricted">ACCESS RESTRICTED</p>
    <p class="nmls__status" data-nmls-status aria-live="polite">
      <span class="nmls__marker" aria-hidden="true"></span>
      <span data-nmls-status-text>UNAVAILABLE</span>
    </p>
  </div>

  <button type="button" class="nmls__btn" data-nmls-attempt>
    ATTEMPT ACCESS
  </button>
</section>
