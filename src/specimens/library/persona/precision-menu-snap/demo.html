<div class="pms" data-precision-menu>
  <div class="pms__stage" aria-hidden="true">
    <span class="pms__radial"></span>
    <span class="pms__target pms__target--a"></span>
    <span class="pms__target pms__target--b"></span>
    <span class="pms__target pms__target--c"></span>
    <span class="pms__bracket pms__bracket--tl"></span>
    <span class="pms__bracket pms__bracket--br"></span>
  </div>

  <div
    class="pms__rail"
    role="radiogroup"
    aria-label="Command menu"
    data-precision-menu-rail
  >
    <button
      type="button"
      class="pms__option pms__option--selected"
      role="radio"
      aria-checked="true"
      tabindex="0"
      data-index="0"
      data-precision-menu-option
    >
      <span class="pms__index">01</span>
      <span class="pms__label">ACTION</span>
      <span class="pms__accent" aria-hidden="true"></span>
      <span class="pms__corners" aria-hidden="true"></span>
    </button>

    <button
      type="button"
      class="pms__option"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-index="1"
      data-precision-menu-option
    >
      <span class="pms__index">02</span>
      <span class="pms__label">ITEM</span>
      <span class="pms__accent" aria-hidden="true"></span>
      <span class="pms__corners" aria-hidden="true"></span>
    </button>

    <button
      type="button"
      class="pms__option"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-index="2"
      data-precision-menu-option
    >
      <span class="pms__index">03</span>
      <span class="pms__label">STATUS</span>
      <span class="pms__accent" aria-hidden="true"></span>
      <span class="pms__corners" aria-hidden="true"></span>
    </button>

    <button
      type="button"
      class="pms__option"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-index="3"
      data-precision-menu-option
    >
      <span class="pms__index">04</span>
      <span class="pms__label">EXIT</span>
      <span class="pms__accent" aria-hidden="true"></span>
      <span class="pms__corners" aria-hidden="true"></span>
    </button>
  </div>
</div>
