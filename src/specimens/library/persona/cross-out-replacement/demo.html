<div class="cor" data-cross-out data-state="idle">
  <p class="cor__label">MONTHLY PLAN</p>

  <div class="cor__stage">
    <div class="cor__value-slot" data-cor-slot>
      <div class="cor__old" data-cor-old aria-hidden="false">
        <span class="cor__amount cor__amount--old">£49</span>
        <span class="cor__strike cor__strike--red" aria-hidden="true"></span>
        <span class="cor__strike cor__strike--ink" aria-hidden="true"></span>
      </div>
      <div class="cor__new" data-cor-new aria-hidden="true">
        <span class="cor__amount cor__amount--new">£29</span>
        <span class="cor__mark" aria-hidden="true"></span>
      </div>
    </div>
    <span class="cor__suffix">/ MONTH</span>
  </div>

  <button type="button" class="cor__trigger" data-cor-trigger>
    APPLY CHANGE
  </button>

  <div
    class="cor__status"
    role="status"
    aria-live="polite"
    data-cor-status
  ></div>
</div>
