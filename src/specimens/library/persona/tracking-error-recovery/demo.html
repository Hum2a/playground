<div class="ter" data-ter data-phase="error">
  <p class="ter__live" data-ter-live aria-live="polite">Tracking error active. Calibrate to recover.</p>

  <div class="ter__screen">
    <div class="ter__content">
      <span class="ter__tag">LIVE</span>
      <p class="ter__title">Broadcast Feed</p>
    </div>
    <div class="ter__bands" aria-hidden="true">
      <span class="ter__band ter__band--1"></span>
      <span class="ter__band ter__band--2"></span>
      <span class="ter__band ter__band--3"></span>
    </div>
  </div>

  <button type="button" class="ter__btn" data-ter-calibrate>Calibrate tracking</button>
</div>
