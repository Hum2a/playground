<div class="gff" aria-label="Glass focus frame demonstration">
  <p class="gff__kicker">FOCUS // GLASS</p>

  <div class="gff__group">
    <span class="gff__frame" aria-hidden="true">
      <span class="gff__bracket gff__bracket--top-left"></span>
      <span class="gff__bracket gff__bracket--top-right"></span>
      <span class="gff__bracket gff__bracket--bottom-right"></span>
      <span class="gff__bracket gff__bracket--bottom-left"></span>
    </span>

    <button class="gff__control" type="button">Archive</button>
    <button class="gff__control" type="button">Inspect</button>
    <button class="gff__control" type="button">Proceed</button>
  </div>

  <p class="gff__hint">Tab or click a control.</p>
</div>
