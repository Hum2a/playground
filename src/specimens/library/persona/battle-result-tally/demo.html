<div class="brt" data-brt data-phase="idle">
  <p class="brt__live" data-brt-live aria-live="polite" role="status">Results pending.</p>
  <p class="brt__header">VICTORY</p>
  <div class="brt__rows">
    <div class="brt__row" data-brt-row="exp"><span>XP</span><span data-brt-exp>0</span></div>
    <div class="brt__row" data-brt-row="score"><span>SCORE</span><span data-brt-score>0</span></div>
    <div class="brt__row brt__row--total" data-brt-row="total"><span>TOTAL</span><span data-brt-total>0</span></div>
  </div>
  <div class="brt__controls">
    <button type="button" class="brt__btn brt__btn--primary" data-brt-run>Tally</button>
    <button type="button" class="brt__btn" data-brt-reset>Reset</button>
  </div>
</div>
