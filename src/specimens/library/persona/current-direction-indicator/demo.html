<div class="current" data-current-direction data-direction="east">
  <div class="current__channel" aria-hidden="true">
    <span class="current__flow current__flow--one"></span>
    <span class="current__flow current__flow--two"></span>
    <span class="current__flow current__flow--three"></span>
    <div class="current__markers" aria-hidden="true">
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
      <span class="current__chevron"></span>
    </div>
  </div>

  <div class="current__readout">
    <span class="current__eyebrow">CURRENT</span>
    <strong class="current__direction" data-current-label>East</strong>
  </div>

  <button class="current__reverse" type="button" data-current-reverse>
    Reverse current
  </button>
  <p class="current__status" aria-live="polite" data-current-status>
    Current travelling East.
  </p>
</div>
