<div class="fsm" data-fsm data-state="idle">
  <div class="fsm__panels">
    <div class="fsm__print fsm__print--sample" aria-hidden="true">
      <svg viewBox="0 0 80 100" class="fsm__svg">
        <path class="fsm__ridge" d="M10,20 Q40,5 70,20" />
        <path class="fsm__ridge" d="M8,40 Q40,25 72,38" />
        <path class="fsm__ridge" d="M12,58 Q40,48 68,60" />
        <path class="fsm__ridge" d="M10,78 Q40,68 70,82" />
      </svg>
      <span class="fsm__panel-label">SAMPLE</span>
    </div>
    <div class="fsm__scan" aria-hidden="true"></div>
    <div class="fsm__print fsm__print--target" aria-hidden="true">
      <svg viewBox="0 0 80 100" class="fsm__svg fsm__svg--offset">
        <path class="fsm__ridge" d="M14,22 Q42,8 74,24" />
        <path class="fsm__ridge" d="M10,42 Q42,28 76,40" />
        <path class="fsm__ridge" d="M14,60 Q42,50 70,62" />
        <path class="fsm__ridge" d="M12,80 Q42,70 72,84" />
      </svg>
      <span class="fsm__panel-label">SCAN</span>
    </div>
  </div>
  <p class="fsm__result" data-fsm-result>MATCH</p>
  <p class="fsm__status" role="status" aria-live="polite" data-fsm-status>Ready to scan.</p>
  <div class="fsm__demo" aria-label="Demo controls">
    <button type="button" class="fsm__btn" data-fsm-scan>SCAN</button>
    <button type="button" class="fsm__btn" data-fsm-reset>RESET</button>
  </div>
</div>
