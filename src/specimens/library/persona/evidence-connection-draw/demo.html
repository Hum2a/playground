<div class="ecd" data-ecd data-phase="idle">
  <div class="ecd__stage" data-ecd-stage>
    <svg class="ecd__svg" data-ecd-svg viewBox="0 0 320 200" aria-hidden="true">
      <line class="ecd__line" data-ecd-line x1="0" y1="0" x2="0" y2="0" />
    </svg>

    <button type="button" class="ecd__clue ecd__clue--a" data-ecd-clue="a" data-ecd-label="WITNESS LOG">
      <span class="ecd__clue-id">CLUE A</span>
      <span class="ecd__clue-text">WITNESS LOG</span>
    </button>
    <button type="button" class="ecd__clue ecd__clue--b" data-ecd-clue="b" data-ecd-label="ENTRY TIME">
      <span class="ecd__clue-id">CLUE B</span>
      <span class="ecd__clue-text">ENTRY TIME</span>
    </button>
  </div>

  <p class="ecd__status" data-ecd-status role="status" aria-live="polite">Relationship: none</p>
  <button type="button" class="ecd__btn" data-ecd-reset>Reset</button>
</div>
