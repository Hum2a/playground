<div class="ccp" data-calling-card-peel>
  <div class="ccp__host">
    <p class="ccp__host-eyebrow">ARCHIVE // 02</p>
    <p class="ccp__host-title">HIDDEN MATERIAL</p>
    <p class="ccp__host-body">This section is now available.</p>
    <button type="button" class="ccp__host-action" data-calling-card-peel-action disabled>
      OPEN MATERIAL
    </button>
  </div>

  <div class="ccp__obstruction" data-calling-card-peel-sheet aria-hidden="true">
    <div class="ccp__backing"></div>
    <div class="ccp__paper">
      <div class="ccp__surface">
        <p class="ccp__eyebrow">NOTICE // ARCHIVE</p>
        <p class="ccp__message">CLASSIFIED</p>
        <p class="ccp__secondary">REMOVE TO REVEAL</p>
        <p class="ccp__microtype">RESTRICTED · RESTRICTED · RESTRICTED ·</p>
      </div>
      <div class="ccp__fold">
        <span class="ccp__fold-under"></span>
        <span class="ccp__fold-face"></span>
      </div>
    </div>
  </div>

  <button type="button" class="ccp__trigger" data-calling-card-peel-trigger>
    PEEL NOTICE
  </button>

  <div
    class="ccp__status"
    role="status"
    aria-live="polite"
    data-calling-card-peel-status
  >
    Restricted notice covering material.
  </div>
</div>
