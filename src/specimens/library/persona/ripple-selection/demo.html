<div class="rs" data-ripple-selection>
  <p class="rs__kicker">SURFACE // SELECT</p>

  <div class="rs__plate">
    <div class="rs__fluid" aria-hidden="true">
      <span class="rs__line rs__line--1"></span>
      <span class="rs__line rs__line--2"></span>
      <span class="rs__line rs__line--3"></span>
      <span class="rs__line rs__line--4"></span>
    </div>

    <div
      class="rs__list"
      role="radiogroup"
      aria-label="Options"
      data-rs-list
    >
      <button
        type="button"
        class="rs__row is-selected"
        role="radio"
        aria-checked="true"
        tabindex="0"
        data-rs-row
        data-index="0"
        data-name="Option A"
      >
        <svg
          class="rs__ripple"
          viewBox="-50 -50 100 100"
          aria-hidden="true"
          focusable="false"
        >
          <polygon
            class="rs__ring rs__ring--1"
            points="0,-22 13,-17 21,-6 20,9 10,20 -1,22 -14,17 -21,4 -18,-10 -9,-20"
          />
          <polygon
            class="rs__ring rs__ring--2"
            points="1,-20 14,-15 20,-4 19,11 8,21 -3,21 -16,14 -21,1 -16,-12 -7,-20"
          />
          <polygon
            class="rs__ring rs__ring--3"
            points="-1,-21 11,-19 20,-8 21,7 12,19 0,23 -13,18 -22,5 -19,-9 -10,-19"
          />
        </svg>
        <span class="rs__mark" aria-hidden="true"></span>
        <span class="rs__label">OPTION A</span>
        <span class="rs__static" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="rs__row"
        role="radio"
        aria-checked="false"
        tabindex="-1"
        data-rs-row
        data-index="1"
        data-name="Option B"
      >
        <svg
          class="rs__ripple"
          viewBox="-50 -50 100 100"
          aria-hidden="true"
          focusable="false"
        >
          <polygon
            class="rs__ring rs__ring--1"
            points="0,-22 13,-17 21,-6 20,9 10,20 -1,22 -14,17 -21,4 -18,-10 -9,-20"
          />
          <polygon
            class="rs__ring rs__ring--2"
            points="1,-20 14,-15 20,-4 19,11 8,21 -3,21 -16,14 -21,1 -16,-12 -7,-20"
          />
          <polygon
            class="rs__ring rs__ring--3"
            points="-1,-21 11,-19 20,-8 21,7 12,19 0,23 -13,18 -22,5 -19,-9 -10,-19"
          />
        </svg>
        <span class="rs__mark" aria-hidden="true"></span>
        <span class="rs__label">OPTION B</span>
        <span class="rs__static" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="rs__row"
        role="radio"
        aria-checked="false"
        tabindex="-1"
        data-rs-row
        data-index="2"
        data-name="Option C"
      >
        <svg
          class="rs__ripple"
          viewBox="-50 -50 100 100"
          aria-hidden="true"
          focusable="false"
        >
          <polygon
            class="rs__ring rs__ring--1"
            points="0,-22 13,-17 21,-6 20,9 10,20 -1,22 -14,17 -21,4 -18,-10 -9,-20"
          />
          <polygon
            class="rs__ring rs__ring--2"
            points="1,-20 14,-15 20,-4 19,11 8,21 -3,21 -16,14 -21,1 -16,-12 -7,-20"
          />
          <polygon
            class="rs__ring rs__ring--3"
            points="-1,-21 11,-19 20,-8 21,7 12,19 0,23 -13,18 -22,5 -19,-9 -10,-19"
          />
        </svg>
        <span class="rs__mark" aria-hidden="true"></span>
        <span class="rs__label">OPTION C</span>
        <span class="rs__static" aria-hidden="true"></span>

    </div>

  <p class="rs__status" role="status" aria-live="polite" data-rs-status>
    Option A selected.
