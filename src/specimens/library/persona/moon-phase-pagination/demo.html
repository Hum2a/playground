<nav
  class="mpp"
  data-moon-phase-pagination
  role="navigation"
  aria-label="Phase pages"
>
  <div class="mpp__track">
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="0"
      aria-current="page"
      aria-label="Phase 01, New"
      tabindex="0"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="new" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="1"
      aria-label="Phase 02, Crescent"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="crescent" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="2"
      aria-label="Phase 03, Quarter"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="quarter" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="3"
      aria-label="Phase 04, Gibbous"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="gibbous" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="4"
      aria-label="Phase 05, Full"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="full" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="5"
      aria-label="Phase 06, Waning gibbous"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="waning-gibbous" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="6"
      aria-label="Phase 07, Last quarter"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="last-quarter" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
    <button
      type="button"
      class="mpp__marker"
      data-mpp-page="7"
      aria-label="Phase 08, Waning crescent"
      tabindex="-1"
    >
      <span class="mpp__disc">
        <span class="mpp__orbit" aria-hidden="true"></span>
        <span class="mpp__moon" data-phase="waning-crescent" aria-hidden="true">
          <span class="mpp__lit"></span>
          <span class="mpp__shade"></span>
        </span>
      </span>
    </button>
  </div>

  <p class="mpp__label" data-mpp-label>PHASE 01</p>
  <p class="mpp__phase" data-mpp-phase>NEW</p>
</nav>
