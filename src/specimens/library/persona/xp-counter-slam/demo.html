<div class="xp-slam" data-xp-slam>
  <p class="xp-slam__eyebrow">EXPERIENCE</p>
  <div class="xp-slam__total-wrap">
    <span class="xp-slam__total xp-slam__total--old">1,240</span>
    <span class="xp-slam__total xp-slam__total--new">1,480</span>
  </div>
  <div class="xp-slam__delta" aria-hidden="true">+240</div>
  <div class="xp-slam__particles" aria-hidden="true">
    <span class="xp-slam__particle xp-slam__particle--1"></span>
    <span class="xp-slam__particle xp-slam__particle--2"></span>
    <span class="xp-slam__particle xp-slam__particle--3"></span>
  </div>
</div>
<button type="button" class="xp-slam-replay" data-xp-slam-replay>Replay</button>
