<div class="cwh" data-critical-weakness data-state="idle">
  <div class="cwh__stage">
    <article class="cwh__target" data-cwh-target aria-labelledby="cwh-name">
      <p class="cwh__name" id="cwh-name">MEMORY</p>

      <div class="cwh__status-slot" data-cwh-status-slot>
        <p class="cwh__status cwh__status--weak" data-cwh-weak>WEAKNESS</p>
        <p class="cwh__status cwh__status--resolved" data-cwh-resolved>RESOLVED</p>
      </div>

      <span class="cwh__layer cwh__layer--a" aria-hidden="true" data-cwh-layer></span>
      <span class="cwh__layer cwh__layer--b" aria-hidden="true" data-cwh-layer></span>
      <span class="cwh__layer cwh__layer--c" aria-hidden="true" data-cwh-layer></span>

      <span class="cwh__cut" aria-hidden="true" data-cwh-cut></span>
    </article>

    <div class="cwh__attacks" aria-hidden="true" data-cwh-attacks>
      <span class="cwh__line cwh__line--tl"></span>
      <span class="cwh__line cwh__line--tr"></span>
      <span class="cwh__line cwh__line--bl"></span>
      <span class="cwh__line cwh__line--br"></span>
    </div>
  </div>

  <div class="cwh__actions">
    <button type="button" class="cwh__btn cwh__btn--go" data-cwh-optimise>
      OPTIMISE
    </button>
    <button type="button" class="cwh__btn cwh__btn--reset" data-cwh-reset hidden>
      RESET
    </button>
  </div>

  <p class="cwh__live" role="status" aria-live="polite" data-cwh-live>
    Memory weakness exposed.
  </p>
</div>
