<div class="rnr" data-ransom-note>
  <button type="button" class="rnr__trigger" data-ransom-note-trigger>
    REVEAL MESSAGE
  </button>

  <div class="rnr__stage" aria-hidden="true">
    <!-- Primary words -->
    <div class="rnr__scrap rnr__scrap--new rnr__scrap--backed" data-scrap="new">
      <span class="rnr__backing"></span>
      <span class="rnr__paper">NEW</span>
    </div>
    <div class="rnr__scrap rnr__scrap--material rnr__scrap--backed" data-scrap="material">
      <span class="rnr__backing"></span>
      <span class="rnr__paper">MATERIAL</span>
    </div>
    <div class="rnr__scrap rnr__scrap--has" data-scrap="has">
      <span class="rnr__paper">HAS</span>
    </div>
    <div class="rnr__scrap rnr__scrap--arrived rnr__scrap--backed" data-scrap="arrived">
      <span class="rnr__backing"></span>
      <span class="rnr__paper rnr__paper--red">ARRIVED!</span>
    </div>

    <!-- Decorative scraps -->
    <div class="rnr__scrap rnr__scrap--archive rnr__scrap--deco" data-scrap="archive">
      <span class="rnr__paper">ARCHIVE</span>
    </div>
    <div class="rnr__scrap rnr__scrap--notice rnr__scrap--deco" data-scrap="notice">
      <span class="rnr__paper">NOTICE</span>
    </div>
    <div class="rnr__scrap rnr__scrap--num rnr__scrap--deco" data-scrap="num">
      <span class="rnr__paper">02</span>
    </div>
    <div class="rnr__scrap rnr__scrap--read rnr__scrap--deco" data-scrap="read">
      <span class="rnr__paper">READ NOW</span>
    </div>
  </div>

  <div
    class="rnr__status"
    role="status"
    aria-live="polite"
    data-ransom-note-status
  ></div>
</div>
