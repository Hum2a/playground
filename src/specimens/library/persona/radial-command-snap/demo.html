<div class="radial-command" data-radial-command>
  <div class="radial-command__field" role="radiogroup" aria-label="Command">
    <button type="button" class="radial-command__option" data-radial-option="0" data-angle="0" role="radio" aria-checked="true" style="transform: rotate(0deg) translateY(-92px) rotate(0deg);">ATTACK</button>
    <button type="button" class="radial-command__option" data-radial-option="1" data-angle="72" role="radio" aria-checked="false" style="transform: rotate(72deg) translateY(-92px) rotate(-72deg);">GUARD</button>
    <button type="button" class="radial-command__option" data-radial-option="2" data-angle="144" role="radio" aria-checked="false" style="transform: rotate(144deg) translateY(-92px) rotate(-144deg);">ITEM</button>
    <button type="button" class="radial-command__option" data-radial-option="3" data-angle="216" role="radio" aria-checked="false" style="transform: rotate(216deg) translateY(-92px) rotate(-216deg);">SKILL</button>
    <button type="button" class="radial-command__option" data-radial-option="4" data-angle="288" role="radio" aria-checked="false" style="transform: rotate(288deg) translateY(-92px) rotate(-288deg);">RUN</button>
    <div class="radial-command__hub" aria-hidden="true">
      <span class="radial-command__hub-label" data-radial-hub>ATTACK</span>
    </div>
    <span class="radial-command__pointer" aria-hidden="true"></span>
  </div>
</div>
<button type="button" class="radial-command-replay" data-radial-command-replay>Replay</button>
