<div class="butterfly-entry" data-butterfly-entry data-state="idle">
  <div class="butterfly-entry__stage">
    <div class="butterfly-entry__swarm" data-bf-swarm aria-hidden="true">
      <span class="bf bf--1" data-bf="1">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
      <span class="bf bf--2" data-bf="2">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
      <span class="bf bf--3" data-bf="3">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
      <span class="bf bf--4" data-bf="4">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
      <span class="bf bf--5" data-bf="5">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
      <span class="bf bf--6" data-bf="6">
        <span class="bf__wing bf__wing--l"></span>
        <span class="bf__wing bf__wing--r"></span>
        <span class="bf__body"></span>
      </span>
    </div>

    <article class="butterfly-entry__card" data-bf-card hidden>
      <span class="butterfly-entry__backing butterfly-entry__backing--1" aria-hidden="true"></span>
      <span class="butterfly-entry__backing butterfly-entry__backing--2" aria-hidden="true"></span>
      <span class="butterfly-entry__backing butterfly-entry__backing--3" aria-hidden="true"></span>
      <div class="butterfly-entry__card-face">
        <p class="butterfly-entry__eyebrow">NEW RECORD</p>
        <h2 class="butterfly-entry__title">SPECIMEN // 043</h2>
        <p class="butterfly-entry__meta">Archive entry received.</p>
      </div>
    </article>

    <p
      class="butterfly-entry__status"
      data-bf-status
      role="status"
      aria-live="polite"
    ></p>
  </div>

  <div class="butterfly-entry__controls">
    <button type="button" class="butterfly-entry__btn" data-bf-receive>
      RECEIVE RECORD
    </button>
    <button type="button" class="butterfly-entry__btn butterfly-entry__btn--ghost" data-bf-dismiss>
      DISMISS
    </button>
  </div>
</div>
