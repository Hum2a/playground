<div class="objective-acquired-demo" data-objective-acquired-demo>
  <button type="button" class="objective-acquired-demo__trigger" data-objective-acquired-trigger>
    ADD OBJECTIVE
  </button>

  <div class="objective-acquired" data-objective-acquired hidden>
    <p
      class="objective-acquired__status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      data-objective-acquired-status
    ></p>

    <div class="objective-acquired__card" data-objective-acquired-card>
      <div class="objective-acquired__strip" aria-hidden="true"></div>
      <div class="objective-acquired__panel" aria-hidden="true"></div>

      <div class="objective-acquired__content">
        <p class="objective-acquired__eyebrow" aria-hidden="true">NEW OBJECTIVE</p>
        <p class="objective-acquired__title" aria-hidden="true">BUILD THE ARCHIVE</p>
        <p class="objective-acquired__desc" aria-hidden="true">Create 50 portable specimens</p>
        <p class="objective-acquired__progress" aria-hidden="true">0 / 50</p>
      </div>

      <span class="objective-acquired__pin objective-acquired__pin--tl" aria-hidden="true"></span>
      <span class="objective-acquired__pin objective-acquired__pin--tr" aria-hidden="true"></span>
    </div>
  </div>
</div>
