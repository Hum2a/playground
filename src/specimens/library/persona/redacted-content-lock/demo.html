<div class="rcl" data-redacted-lock data-state="locked">
  <article class="rcl__card">
    <div class="rcl__content" data-rcl-content aria-hidden="true">
      <p class="rcl__meta">
        <span class="rcl__meta-label">LESSON</span>
        <span class="rcl__censor rcl__censor--meta">
          <span class="rcl__readable">12</span>
          <span class="rcl__bar rcl__bar--4" aria-hidden="true"></span>
        </span>
      </p>

      <h2 class="rcl__title">
        <span class="rcl__censor rcl__censor--title">
          <span class="rcl__readable">ADVANCED TYPESCRIPT</span>
          <span class="rcl__bar rcl__bar--1" aria-hidden="true"></span>
        </span>
      </h2>

      <p class="rcl__desc">
        <span class="rcl__censor rcl__censor--desc-a">
          <span class="rcl__readable">Learn conditional types,</span>
          <span class="rcl__bar rcl__bar--2" aria-hidden="true"></span>
        </span>
        <span class="rcl__censor rcl__censor--desc-b">
          <span class="rcl__readable">mapped types and infer patterns.</span>
          <span class="rcl__bar rcl__bar--3" aria-hidden="true"></span>
        </span>
      </p>

      <button
        type="button"
        class="rcl__action"
        data-rcl-action
        disabled
        aria-disabled="true"
      >
        <span class="rcl__censor rcl__censor--action">
          <span class="rcl__readable">OPEN LESSON</span>
          <span class="rcl__bar rcl__bar--5" aria-hidden="true"></span>
        </span>
      </button>
    </div>

    <div class="rcl__stamp" data-rcl-stamp aria-hidden="true">
      <span class="rcl__stamp-back"></span>
      <span class="rcl__stamp-face">RESTRICTED</span>
    </div>
  </article>

  <div class="rcl__demo" aria-label="Demo controls">
    <button type="button" class="rcl__demo-btn" data-rcl-unlock>UNLOCK</button>
    <button type="button" class="rcl__demo-btn rcl__demo-btn--ghost" data-rcl-lock>
      LOCK
    </button>
  </div>

  <p class="rcl__status" role="status" aria-live="polite" data-rcl-status>
    Advanced Typescript. Restricted content.
  </p>
</div>
