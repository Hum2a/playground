<div class="tartarus-ascend-demo" data-tartarus-ascend-demo>
  <p class="tartarus-ascend-demo__live" data-tartarus-live aria-live="polite">
    Floor 41, cleared.
  </p>

  <div class="tartarus-ascend" data-tartarus-ascend>
    <div class="tartarus-ascend__stage" data-tartarus-stage aria-hidden="true">
      <div
        class="tartarus-ascend__slab tartarus-ascend__slab--future"
        data-tartarus-node="a"
        data-tartarus-slab="future"
      >
        <div class="tartarus-ascend__face">
          <p class="tartarus-ascend__label" data-slab-label>FLOOR // 043</p>
          <p class="tartarus-ascend__status" data-slab-status>UNKNOWN</p>
        </div>
        <div class="tartarus-ascend__glass" data-slab-glass aria-hidden="true"></div>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--l" aria-hidden="true"></span>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--r" aria-hidden="true"></span>
      </div>

      <div
        class="tartarus-ascend__slab tartarus-ascend__slab--next"
        data-tartarus-node="b"
        data-tartarus-slab="next"
      >
        <div class="tartarus-ascend__face">
          <p class="tartarus-ascend__label" data-slab-label>FLOOR // 042</p>
          <p class="tartarus-ascend__status" data-slab-status>CLEARED</p>
        </div>
        <div class="tartarus-ascend__glass" data-slab-glass aria-hidden="true"></div>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--l" aria-hidden="true"></span>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--r" aria-hidden="true"></span>
      </div>

      <div
        class="tartarus-ascend__slab tartarus-ascend__slab--current"
        data-tartarus-node="c"
        data-tartarus-slab="current"
      >
        <div class="tartarus-ascend__face">
          <p class="tartarus-ascend__label" data-slab-label>FLOOR // 041</p>
          <p class="tartarus-ascend__status" data-slab-status>CLEARED</p>
        </div>
        <div class="tartarus-ascend__glass" data-slab-glass aria-hidden="true"></div>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--l" aria-hidden="true"></span>
        <span class="tartarus-ascend__bracket tartarus-ascend__bracket--r" aria-hidden="true"></span>
      </div>

      <div class="tartarus-ascend__line" data-tartarus-line aria-hidden="true"></div>
    </div>
  </div>

  <div class="tartarus-ascend-demo__controls">
    <button type="button" class="tartarus-ascend-demo__btn" data-tartarus-descend>
      Descend
    </button>
    <button type="button" class="tartarus-ascend-demo__btn tartarus-ascend-demo__btn--primary" data-tartarus-ascend-btn>
      Ascend
    </button>
    <button type="button" class="tartarus-ascend-demo__btn" data-tartarus-reset>
      Reset
    </button>
  </div>
</div>
