<div class="wdh" data-water-disturbance>
  <p class="wdh__kicker">SURFACE // CALM</p>

  <div
    class="wdh__surface"
    tabindex="0"
    data-wdh-surface
    data-state="calm"
    aria-label="Water surface. Hover or focus to disturb."
  >
    <div class="wdh__lines" aria-hidden="true">
      <span class="wdh__line" data-wdh-line style="top: 18%"></span>
      <span class="wdh__line" data-wdh-line style="top: 32%"></span>
      <span class="wdh__line" data-wdh-line style="top: 46%"></span>
      <span class="wdh__line" data-wdh-line style="top: 60%"></span>
      <span class="wdh__line" data-wdh-line style="top: 74%"></span>
      <span class="wdh__line" data-wdh-line style="top: 88%"></span>
    </div>

    <span class="wdh__glow" aria-hidden="true"></span>
    <span class="wdh__static" aria-hidden="true"></span>

    <div class="wdh__rings" data-wdh-rings aria-hidden="true">
      <span class="wdh__ring wdh__ring--1"></span>
      <span class="wdh__ring wdh__ring--2"></span>
      <span class="wdh__ring wdh__ring--3"></span>
    </div>

    <p class="wdh__label">WATER SURFACE</p>
  </div>

  <p class="wdh__hint">Hover or focus the surface to disturb it.</p>
  <p class="wdh__status" role="status" aria-live="polite" data-wdh-status>
    Surface calm.
  </p>
</div>
