<div class="cpo" data-cpo data-phase="off">
  <p class="cpo__live" data-cpo-live aria-live="polite">Screen off.</p>

  <div class="cpo__screen" data-cpo-screen>
    <div class="cpo__beam" data-cpo-beam aria-hidden="true"></div>
    <div class="cpo__bloom" data-cpo-bloom aria-hidden="true"></div>
    <div class="cpo__ui" data-cpo-ui>
      <p class="cpo__eyebrow">INVESTIGATION // CRT</p>
      <p class="cpo__title">SIGNAL READY</p>
      <p class="cpo__meta">Channel interface online.</p>
    </div>
  </div>

  <div class="cpo__controls">
    <button type="button" class="cpo__btn cpo__btn--primary" data-cpo-run>Power on</button>
    <button type="button" class="cpo__btn" data-cpo-replay>Replay</button>
  </div>
</div>
