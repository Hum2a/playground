<div class="ccs" data-comic-card-selection data-selected="0">
  <div
    class="ccs__grid"
    role="radiogroup"
    aria-label="Comic card categories"
    data-ccs-rail
  >
    <button
      type="button"
      class="ccs__card ccs__card--0 ccs__card--active"
      role="radio"
      aria-checked="true"
      tabindex="0"
      data-index="0"
      data-ccs-card
    >
      <span class="ccs__hard" aria-hidden="true"></span>
      <span class="ccs__backing" aria-hidden="true"></span>
      <span class="ccs__misreg" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--a" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--b" aria-hidden="true"></span>
      <span class="ccs__face">
        <span class="ccs__index">01</span>
        <span class="ccs__label">MOTION</span>
      </span>
    </button>

    <button
      type="button"
      class="ccs__card ccs__card--1"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-index="1"
      data-ccs-card
    >
      <span class="ccs__hard" aria-hidden="true"></span>
      <span class="ccs__backing" aria-hidden="true"></span>
      <span class="ccs__misreg" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--a" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--b" aria-hidden="true"></span>
      <span class="ccs__face">
        <span class="ccs__index">02</span>
        <span class="ccs__label">TYPE</span>
      </span>
    </button>

    <button
      type="button"
      class="ccs__card ccs__card--2"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-index="2"
      data-ccs-card
    >
      <span class="ccs__hard" aria-hidden="true"></span>
      <span class="ccs__backing" aria-hidden="true"></span>
      <span class="ccs__misreg" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--a" aria-hidden="true"></span>
      <span class="ccs__shard ccs__shard--b" aria-hidden="true"></span>
      <span class="ccs__face">
        <span class="ccs__index">03</span>
        <span class="ccs__label">OVERLAYS</span>
      </span>
    </button>
  </div>
</div>
