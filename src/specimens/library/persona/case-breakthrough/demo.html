<div class="cb" data-cb data-state="chaotic">
  <p class="cb__label">EVIDENCE BOARD</p>
  <div class="cb__board">
    <svg class="cb__lines" viewBox="0 0 320 180" aria-hidden="true">
      <line class="cb__line cb__line--a" x1="48" y1="42" x2="160" y2="90" />
      <line class="cb__line cb__line--b" x1="272" y1="38" x2="160" y2="90" />
      <line class="cb__line cb__line--c" x1="72" y1="148" x2="160" y2="90" />
      <line class="cb__line cb__line--d" x1="248" y1="142" x2="160" y2="90" />
    </svg>
    <div class="cb__node cb__node--a" data-node="A"><span>A</span><small>WITNESS</small></div>
    <div class="cb__node cb__node--b" data-node="B"><span>B</span><small>LOCATION</small></div>
    <div class="cb__node cb__node--c" data-node="C"><span>C</span><small>OBJECT</small></div>
    <div class="cb__node cb__node--d" data-node="D"><span>D</span><small>TIME</small></div>
    <div class="cb__node cb__node--hub" data-node="HUB"><span>?</span><small>LINK</small></div>
  </div>
  <p class="cb__status" role="status" aria-live="polite" data-cb-status>Evidence scattered.</p>
  <div class="cb__demo" aria-label="Demo controls">
    <button type="button" class="cb__btn" data-cb-solve>SOLVE</button>
    <button type="button" class="cb__btn" data-cb-reset>RESET</button>
  </div>
</div>
