<section class="tpe" data-textarea-paper-expansion>
  <label class="tpe__label" for="tpe-message">MESSAGE</label>

  <div class="tpe__stack">
    <span class="tpe__sheet tpe__sheet--cyan" aria-hidden="true"></span>
    <span class="tpe__sheet tpe__sheet--grey" aria-hidden="true"></span>
    <textarea
      class="tpe__area"
      id="tpe-message"
      name="message"
      rows="3"
      placeholder=" "
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <span class="tpe__fold" aria-hidden="true"></span>
  </div>
</section>
