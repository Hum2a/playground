<div class="sbb" data-shard-burst-button>
  <p class="sbb__kicker">COMMAND // COMMIT</p>

  <div class="sbb__stage">
    <span class="sbb__shards" aria-hidden="true">
      <i class="sbb__shard sbb__shard--1"></i>
      <i class="sbb__shard sbb__shard--2"></i>
      <i class="sbb__shard sbb__shard--3"></i>
      <i class="sbb__shard sbb__shard--4"></i>
      <i class="sbb__shard sbb__shard--5"></i>
      <i class="sbb__shard sbb__shard--6"></i>
      <i class="sbb__shard sbb__shard--7"></i>
      <i class="sbb__shard sbb__shard--8"></i>
      <i class="sbb__shard sbb__shard--9"></i>
      <i class="sbb__shard sbb__shard--10"></i>
      <i class="sbb__shard sbb__shard--11"></i>
      <i class="sbb__shard sbb__shard--12"></i>
    </span>

    <button type="button" class="sbb__button" data-sbb-confirm>
      <span data-sbb-label>CONFIRM</span>
    </button>
  </div>

  <p class="sbb__status" role="status" aria-live="polite" data-sbb-status>
    Ready to confirm.
  </p>
</div>
