<div class="locked-chain-demo" data-locked-chain-demo>
  <div class="locked-chain-demo__card" data-locked-chain-host>
    <div class="locked-chain-demo__content" data-locked-chain-content>
      <p class="locked-chain-demo__kicker">Chapter 12</p>
      <h2 class="locked-chain-demo__title">ADVANCED MATERIAL</h2>
      <button
        type="button"
        class="locked-chain-demo__action"
        data-locked-chain-action
        disabled
      >
        OPEN CHAPTER
      </button>
      <p class="locked-chain-demo__granted" data-locked-chain-granted aria-hidden="true">
        ACCESS GRANTED
      </p>
    </div>

    <div class="locked-chain" data-locked-chain aria-hidden="true">
      <div class="locked-chain__rail" aria-hidden="true">
        <div class="locked-chain__seg locked-chain__seg--left">
          <span class="locked-chain__link locked-chain__link--1"></span>
          <span class="locked-chain__link locked-chain__link--2 locked-chain__link--red"></span>
          <span class="locked-chain__link locked-chain__link--3"></span>
        </div>

        <div class="locked-chain__seg locked-chain__seg--centre">
          <span class="locked-chain__link locked-chain__link--4 locked-chain__link--whole"></span>
          <span class="locked-chain__piece locked-chain__piece--left"></span>
          <span class="locked-chain__piece locked-chain__piece--right"></span>
          <span class="locked-chain__tension locked-chain__tension--1"></span>
          <span class="locked-chain__tension locked-chain__tension--2"></span>
          <span class="locked-chain__frag locked-chain__frag--1"></span>
          <span class="locked-chain__frag locked-chain__frag--2"></span>
          <span class="locked-chain__frag locked-chain__frag--3"></span>
        </div>

        <div class="locked-chain__seg locked-chain__seg--right">
          <span class="locked-chain__link locked-chain__link--5"></span>
          <span class="locked-chain__link locked-chain__link--6 locked-chain__link--red"></span>
          <span class="locked-chain__link locked-chain__link--7"></span>
        </div>
      </div>

      <div class="locked-chain__badge">
        <span class="locked-chain__badge-back" aria-hidden="true"></span>
        <span class="locked-chain__badge-face">LOCKED</span>
        <span class="locked-chain__slash" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <p class="locked-chain-demo__status" data-locked-chain-status aria-live="polite">
    Locked
  </p>

  <div class="locked-chain-demo__controls">
    <button type="button" class="locked-chain-demo__grant" data-locked-chain-grant>
      GRANT ACCESS
    </button>
    <button type="button" class="locked-chain-demo__reset" data-locked-chain-reset>
      Reset
    </button>
  </div>
</div>
