<div class="blue-focus-brackets" data-blue-focus-brackets>
  <p class="blue-focus-brackets__hint" id="bfb-hint">
    Tab through the controls. Brackets mark keyboard focus only.
  </p>

  <div class="blue-focus-brackets__row" role="group" aria-labelledby="bfb-hint">
    <button type="button" class="blue-focus-brackets__btn">
      <span class="blue-focus-brackets__marks" aria-hidden="true">
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tr"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--bl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--br"></span>
      </span>
      <span class="blue-focus-brackets__label">PREVIEW</span>
    </button>

    <button type="button" class="blue-focus-brackets__btn">
      <span class="blue-focus-brackets__marks" aria-hidden="true">
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tr"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--bl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--br"></span>
      </span>
      <span class="blue-focus-brackets__label">COPY</span>
    </button>

    <button type="button" class="blue-focus-brackets__btn">
      <span class="blue-focus-brackets__marks" aria-hidden="true">
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--tr"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--bl"></span>
        <span class="blue-focus-brackets__br blue-focus-brackets__br--br"></span>
      </span>
      <span class="blue-focus-brackets__label">EXPORT</span>
    </button>
  </div>
</div>
