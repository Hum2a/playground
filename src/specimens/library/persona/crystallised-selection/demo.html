<div class="crystallised-selection" data-crystallised-selection data-selected="">
  <p class="crystallised-selection__eyebrow" id="cs-q">SELECT AXIS</p>

  <div
    class="crystallised-selection__options"
    role="radiogroup"
    aria-labelledby="cs-q"
    data-cs-options
  >
    <button
      type="button"
      role="radio"
      class="crystallised-selection__option"
      data-choice="motion"
      aria-checked="false"
    >
      <span class="crystallised-selection__crystal" aria-hidden="true">
        <span class="crystallised-selection__facet crystallised-selection__facet--1"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--2"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--3"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--4"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--5"></span>
        <span class="crystallised-selection__sweep"></span>
      </span>
      <span class="crystallised-selection__label">MOTION</span>
    </button>

    <button
      type="button"
      role="radio"
      class="crystallised-selection__option"
      data-choice="structure"
      aria-checked="false"
    >
      <span class="crystallised-selection__crystal" aria-hidden="true">
        <span class="crystallised-selection__facet crystallised-selection__facet--1"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--2"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--3"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--4"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--5"></span>
        <span class="crystallised-selection__sweep"></span>
      </span>
      <span class="crystallised-selection__label">STRUCTURE</span>
    </button>

    <button
      type="button"
      role="radio"
      class="crystallised-selection__option"
      data-choice="depth"
      aria-checked="false"
    >
      <span class="crystallised-selection__crystal" aria-hidden="true">
        <span class="crystallised-selection__facet crystallised-selection__facet--1"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--2"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--3"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--4"></span>
        <span class="crystallised-selection__facet crystallised-selection__facet--5"></span>
        <span class="crystallised-selection__sweep"></span>
      </span>
      <span class="crystallised-selection__label">DEPTH</span>
    </button>
  </div>

  <p
    class="crystallised-selection__status"
    role="status"
    aria-live="polite"
    data-cs-status
  >
    No selection.
  </p>
</div>
