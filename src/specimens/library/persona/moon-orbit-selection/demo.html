<section class="mos" data-mos aria-labelledby="mos-title">
  <p class="mos__kicker" id="mos-title">NIGHT ROUTES</p>
  <div class="mos__field" role="radiogroup" aria-label="Destination" data-mos-field>
    <span class="mos__orbit" aria-hidden="true"></span>
    <span class="mos__marker" data-mos-marker aria-hidden="true" style="--mos-angle: 0deg;">
      <span class="mos__crescent"></span>
    </span>
    <button type="button" class="mos__opt" role="radio" aria-checked="true" tabindex="0" data-mos-opt="0" style="--slot: 0deg;">HOME</button>
    <button type="button" class="mos__opt" role="radio" aria-checked="false" tabindex="-1" data-mos-opt="1" style="--slot: 72deg;">STATUS</button>
    <button type="button" class="mos__opt" role="radio" aria-checked="false" tabindex="-1" data-mos-opt="2" style="--slot: 144deg;">MAP</button>
    <button type="button" class="mos__opt" role="radio" aria-checked="false" tabindex="-1" data-mos-opt="3" style="--slot: 216deg;">ARCHIVE</button>
    <button type="button" class="mos__opt" role="radio" aria-checked="false" tabindex="-1" data-mos-opt="4" style="--slot: 288deg;">SETTINGS</button>
  </div>
</section>
