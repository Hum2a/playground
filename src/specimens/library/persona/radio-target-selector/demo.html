<section class="rts" data-radio-target-selector>
  <fieldset class="rts__set">
    <legend class="rts__legend">SELECT TARGET</legend>

    <label class="rts__option">
      <input class="rts__input" type="radio" name="rts-target" value="a" checked />
      <span class="rts__target" aria-hidden="true">
        <span class="rts__br rts__br--tl"></span>
        <span class="rts__br rts__br--tr"></span>
        <span class="rts__br rts__br--bl"></span>
        <span class="rts__br rts__br--br"></span>
        <span class="rts__diamond"></span>
        <span class="rts__ring"></span>
      </span>
      <span class="rts__name">OPTION A</span>
    </label>

    <label class="rts__option">
      <input class="rts__input" type="radio" name="rts-target" value="b" />
      <span class="rts__target" aria-hidden="true">
        <span class="rts__br rts__br--tl"></span>
        <span class="rts__br rts__br--tr"></span>
        <span class="rts__br rts__br--bl"></span>
        <span class="rts__br rts__br--br"></span>
        <span class="rts__diamond"></span>
        <span class="rts__ring"></span>
      </span>
      <span class="rts__name">OPTION B</span>
    </label>

    <label class="rts__option">
      <input class="rts__input" type="radio" name="rts-target" value="c" />
      <span class="rts__target" aria-hidden="true">
        <span class="rts__br rts__br--tl"></span>
        <span class="rts__br rts__br--tr"></span>
        <span class="rts__br rts__br--bl"></span>
        <span class="rts__br rts__br--br"></span>
        <span class="rts__diamond"></span>
        <span class="rts__ring"></span>
      </span>
      <span class="rts__name">OPTION C</span>
    </label>
  </fieldset>
</section>
