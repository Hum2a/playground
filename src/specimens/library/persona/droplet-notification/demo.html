<div class="dn" data-droplet-notification data-phase="idle">
  <p class="dn__kicker">SIGNAL // INBOX</p>

  <div class="dn__surface" aria-label="Notification indicator">
    <div class="dn__stage" aria-hidden="true">
      <span class="dn__drop"></span>
      <span class="dn__ripple dn__ripple--1"></span>
      <span class="dn__ripple dn__ripple--2"></span>
      <span class="dn__static"></span>
    </div>

    <div class="dn__badge" data-dn-badge>
      <span class="dn__marker" aria-hidden="true"></span>
      <span class="dn__count">1</span>
      <span class="dn__new">NEW</span>
    </div>

    <p class="dn__copy" data-dn-copy>Inbox quiet.</p>
  </div>

  <button type="button" class="dn__trigger" data-dn-trigger>TRIGGER</button>

  <p class="dn__status" role="status" aria-live="polite" data-dn-status>
    No new notification.
  </p>
</div>
