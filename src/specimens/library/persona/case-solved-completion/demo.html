<div class="csc" data-csc data-state="clues">
  <div class="csc__stage">
    <div class="csc__burst" aria-hidden="true"></div>
    <div class="csc__clue csc__clue--1" aria-hidden="true">A</div>
    <div class="csc__clue csc__clue--2" aria-hidden="true">B</div>
    <div class="csc__clue csc__clue--3" aria-hidden="true">C</div>
    <article class="csc__title">
      <span class="csc__title-sub">CASE</span>
      <span class="csc__title-main">SOLVED</span>
    </article>
  </div>
  <p class="csc__status" role="status" aria-live="polite" data-csc-status>Clues active.</p>
  <div class="csc__demo" aria-label="Demo controls">
    <button type="button" class="csc__btn" data-csc-solve>SOLVE</button>
    <button type="button" class="csc__btn" data-csc-reset>RESET</button>
  </div>
</div>
