<div class="et" data-eclipse-transition data-phase="idle">
  <p class="et__kicker">LUNAR // TRANSIT</p>

  <div class="et__stage" aria-label="Eclipse transition">
    <section class="et__panel et__panel--next" data-et-next aria-hidden="true">
      <p class="et__label">NEXT STATE</p>
      <h2 class="et__title">SECTOR 02</h2>
      <p class="et__meta">ALIGNED FIELD</p>
    </section>

    <section class="et__panel et__panel--current" data-et-current>
      <p class="et__label">CURRENT STATE</p>
      <h2 class="et__title">SECTOR 01</h2>
      <p class="et__meta">STABLE FIELD</p>
    </section>

    <div class="et__overlay" aria-hidden="true"></div>

    <div class="et__astro" aria-hidden="true">
      <div class="et__moon">
        <span class="et__lit"></span>
        <span class="et__occluder"></span>
        <span class="et__rim"></span>
      </div>
    </div>
  </div>

  <button type="button" class="et__trigger" data-et-trigger>TRIGGER</button>

  <p class="et__status" role="status" aria-live="polite" data-et-status>
    Current state visible.
  </p>
</div>
