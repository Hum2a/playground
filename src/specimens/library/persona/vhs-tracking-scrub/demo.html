<div class="vts" data-vts data-phase="clean">
  <p class="vts__live" data-vts-live aria-live="polite">Tracking stable.</p>

  <div class="vts__screen" data-vts-screen>
    <div class="vts__content">
      <span class="vts__tag">PLAY</span>
      <p class="vts__title">Interview Tape</p>
    </div>
    <div class="vts__tear" data-vts-tear aria-hidden="true"></div>
    <div class="vts__scanlines" aria-hidden="true"></div>
  </div>

  <label class="vts__control">
    <span class="vts__control-label">Tracking</span>
    <input
      type="range"
      class="vts__range"
      data-vts-range
      min="0"
      max="100"
      value="50"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="50"
      aria-label="VHS tracking adjustment"
    />
  </label>
  <div class="vts__controls">
    <button type="button" class="vts__btn" data-vts-reset>Reset</button>
  </div>
</div>
