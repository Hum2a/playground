<div class="mrc" data-max-rank data-state="idle">
  <div class="mrc__toolbar">
    <button type="button" class="mrc__btn" data-mrc-trigger>MAX LINK</button>
  </div>

  <p class="mrc__status" role="status" aria-live="polite" data-mrc-status>
    Social link rank 09.
  </p>

  <div class="mrc__host">
    <div class="mrc__stage" aria-hidden="true">
      <div class="mrc__node mrc__node--you">
        <span class="mrc__node-ring"></span>
        <span class="mrc__node-label">YOU</span>
      </div>

      <div class="mrc__node mrc__node--ally">
        <span class="mrc__node-ring"></span>
        <span class="mrc__node-label">ALLY</span>
      </div>

      <div class="mrc__bond">
        <span class="mrc__bond-line mrc__bond-line--a"></span>
        <span class="mrc__bond-line mrc__bond-line--b"></span>
        <span class="mrc__energy mrc__energy--you"></span>
        <span class="mrc__energy mrc__energy--ally"></span>
      </div>

      <div class="mrc__rank" data-mrc-rank>
        <div class="mrc__reel">
          <span class="mrc__digit mrc__digit--09">09</span>
          <span class="mrc__digit mrc__digit--10">10</span>
        </div>
        <span class="mrc__max">MAX</span>
      </div>

      <div class="mrc__circuit">
        <span class="mrc__path mrc__path--ul"></span>
        <span class="mrc__path mrc__path--ur"></span>
        <span class="mrc__path mrc__path--lr"></span>
        <span class="mrc__path mrc__path--ll"></span>
        <span class="mrc__cap mrc__cap--top"></span>
        <span class="mrc__cap mrc__cap--bottom"></span>
      </div>

      <span class="mrc__outline"></span>
    </div>
  </div>
</div>
