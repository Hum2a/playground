<div class="bol" data-blackout-loader data-state="idle">
  <div class="bol__surface" data-bol-surface aria-busy="false">
    <p class="bol__eyebrow">SPECIMEN ARCHIVE</p>
    <p class="bol__title">ARCHIVE INDEX</p>
    <p class="bol__count" data-bol-count>24 specimens available</p>
    <button type="button" class="bol__trigger" data-bol-trigger>
      REFRESH INDEX
    </button>
  </div>

  <div class="bol__veil" aria-hidden="true" data-bol-veil>
    <span class="bol__poly bol__poly--1"></span>
    <span class="bol__poly bol__poly--2"></span>
    <span class="bol__poly bol__poly--3"></span>
    <span class="bol__poly bol__poly--4"></span>

    <div class="bol__loading" data-bol-loading>
      <p class="bol__loading-label">
        <span class="bol__loading-word">LOADING</span><span
          class="bol__dots"
          aria-hidden="true"
          ><span></span><span></span><span></span
        ></span>
      </p>
      <p class="bol__microtype">ARCHIVE // REFRESH</p>
    </div>

    <span class="bol__slash" aria-hidden="true"></span>
  </div>

  <div
    class="bol__status"
    role="status"
    aria-live="polite"
    data-bol-status
  ></div>
</div>
