<div class="spm" data-spm data-phase="idle">
  <p class="spm__live" data-spm-live aria-live="polite">Static field idle.</p>

  <div class="spm__stage">
    <div class="spm__noise" data-spm-noise aria-hidden="true"></div>
    <article class="spm__panel" data-spm-panel hidden>
      <span class="spm__label">Portal</span>
      <h2 class="spm__title">Access Panel</h2>
      <p class="spm__copy">Interactive destination ready.</p>
      <button type="button" class="spm__action">Enter</button>
    </article>
  </div>

  <button type="button" class="spm__btn" data-spm-run>Materialise</button>
</div>
