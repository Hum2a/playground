<div class="yiw" data-yiw data-phase="idle">
  <p class="yiw__live" data-yiw-live aria-live="polite">Scene A active.</p>

  <div class="yiw__stage">
    <div class="yiw__scene yiw__scene--a" data-yiw-a>
      <span class="yiw__tag">ALPHA</span>
      <p class="yiw__copy">Current state</p>
    </div>
    <div class="yiw__scene yiw__scene--b" data-yiw-b hidden>
      <span class="yiw__tag">BETA</span>
      <p class="yiw__copy">Next state</p>
    </div>
    <div class="yiw__wipe" data-yiw-wipe aria-hidden="true"></div>
  </div>

  <button type="button" class="yiw__btn" data-yiw-run>Impact wipe</button>
</div>
