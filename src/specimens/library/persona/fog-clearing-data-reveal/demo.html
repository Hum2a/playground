<div class="fcdr" data-fcdr data-phase="idle">
  <p class="fcdr__live" data-fcdr-live aria-live="polite">Data obscured by fog.</p>

  <div class="fcdr__panel">
    <p class="fcdr__eyebrow">CASE DATA // FOGBOUND</p>
    <div class="fcdr__data" data-fcdr-data>
      <p class="fcdr__row"><span class="fcdr__key">SUBJECT</span><span class="fcdr__val">UNIT-07</span></p>
      <p class="fcdr__row"><span class="fcdr__key">LOCATION</span><span class="fcdr__val">SECTOR 4</span></p>
      <p class="fcdr__row"><span class="fcdr__key">TIMESTAMP</span><span class="fcdr__val">00:12 SIGNAL</span></p>
      <p class="fcdr__row"><span class="fcdr__key">STATUS</span><span class="fcdr__val">VERIFIED</span></p>
    </div>
    <div class="fcdr__fog" data-fcdr-fog aria-hidden="true"></div>
    <div class="fcdr__progress" data-fcdr-progress aria-hidden="true">
      <span class="fcdr__bar" data-fcdr-bar></span>
    </div>
  </div>

  <div class="fcdr__controls">
    <button type="button" class="fcdr__btn fcdr__btn--primary" data-fcdr-run>Clear fog</button>
    <button type="button" class="fcdr__btn" data-fcdr-reset>Reset</button>
  </div>
</div>
