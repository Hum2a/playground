<button class="shard-hover" type="button" aria-describedby="shard-hover-note">
  <span class="shard-hover__shards" aria-hidden="true">
    <span class="shard-hover__shard shard-hover__shard--1"></span>
    <span class="shard-hover__shard shard-hover__shard--2"></span>
    <span class="shard-hover__shard shard-hover__shard--3"></span>
    <span class="shard-hover__shard shard-hover__shard--4"></span>
    <span class="shard-hover__shard shard-hover__shard--5"></span>
    <span class="shard-hover__shard shard-hover__shard--6"></span>
    <span class="shard-hover__shard shard-hover__shard--7"></span>
  </span>
  <span class="shard-hover__content">
    <span class="shard-hover__eyebrow">TARTARUS // ACCESS</span>
    <strong class="shard-hover__title">ENTER DEPTH</strong>
    <span class="shard-hover__prompt">Hover or focus to fracture</span>
  </span>
</button>
<p class="shard-hover__note" id="shard-hover-note">
  Seven glass shards shift outward on hover or keyboard focus.
</p>
