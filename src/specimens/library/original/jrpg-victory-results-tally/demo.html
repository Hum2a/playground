<section class="jrpg-results" data-results aria-label="Operation results">
  <button class="jrpg-results__start" type="button" data-start>COMPLETE</button>
  <div class="jrpg-results__panel" data-panel>
    <p class="jrpg-results__title">OPERATION RESULTS</p>
    <div class="jrpg-results__rows">
      <p class="jrpg-results__row" data-row data-value="1240"><span>EXPERIENCE</span><b>0000</b></p>
      <p class="jrpg-results__row" data-row data-value="850"><span>REWARD</span><b>000</b></p>
      <p class="jrpg-results__row" data-row data-value="06"><span>ITEMS</span><b>00</b></p>
      <p class="jrpg-results__row" data-row data-value="03:42"><span>TIME</span><b>00:00</b></p>
      <p class="jrpg-results__row" data-row data-value="98"><span>SCORE</span><b>00</b></p>
    </div>
    <p class="jrpg-results__clear" data-clear>CLEAR</p>
  </div>
  <p class="jrpg-results__status" data-status aria-live="polite"></p>
</section>
