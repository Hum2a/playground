<div class="dg" data-deletion-guillotine data-state="idle">
  <article class="dg__card" data-dg-card>
    <p class="dg__eyebrow">ARCHIVE // PROJECT</p>
    <h3 class="dg__title">PROJECT NIGHTFALL</h3>
    <p class="dg__meta">12 artifacts</p>
    <button type="button" class="dg__delete" data-dg-delete>
      DELETE
    </button>
  </article>

  <div class="dg__confirm" data-dg-confirm hidden>
    <p class="dg__confirm-copy">Delete Project Nightfall?</p>
    <p class="dg__confirm-note">Demo only — nothing is permanently removed.</p>
    <div class="dg__confirm-actions">
      <button type="button" class="dg__confirm-yes" data-dg-confirm-yes>
        CONFIRM DELETE
      </button>
      <button type="button" class="dg__confirm-no" data-dg-confirm-no>
        CANCEL
      </button>
    </div>
  </div>

  <div class="dg__stage" aria-hidden="true" data-dg-stage>
    <div class="dg__piece dg__piece--upper" data-dg-upper>
      <div class="dg__piece-face">
        <p class="dg__eyebrow">ARCHIVE // PROJECT</p>
        <p class="dg__title">PROJECT NIGHTFALL</p>
        <p class="dg__meta">12 artifacts</p>
      </div>
    </div>
    <div class="dg__piece dg__piece--lower" data-dg-lower>
      <div class="dg__piece-face">
        <p class="dg__eyebrow">ARCHIVE // PROJECT</p>
        <p class="dg__title">PROJECT NIGHTFALL</p>
        <p class="dg__meta">12 artifacts</p>
      </div>
    </div>

    <span class="dg__warn-line" data-dg-line></span>

    <div class="dg__blade" data-dg-blade>
      <span class="dg__blade-red"></span>
      <span class="dg__blade-ink"></span>
    </div>

    <p class="dg__deleted" data-dg-deleted>DELETED</p>
  </div>

  <p class="dg__removed" data-dg-removed hidden>PROJECT REMOVED</p>

  <div
    class="dg__status"
    role="status"
    aria-live="polite"
    data-dg-status
  ></div>
</div>
