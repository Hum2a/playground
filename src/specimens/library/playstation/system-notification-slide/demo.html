<div class="sns" data-ps="system-notification-slide">
  <p class="sns__eyebrow">System Notification Slide</p>
  <div class="sns__stage">
    <div class="sns__home" aria-hidden="true">
      <span>HOME</span>
      <div class="sns__tiles"><i></i><i></i><i></i></div>
    </div>
    <div class="sns__toast" data-sns-notify hidden role="status">
      <span class="sns__accent" aria-hidden="true"></span>
      <span class="sns__icon" aria-hidden="true"></span>
      <span class="sns__text">Download complete</span>
    </div>
  </div>
  <button type="button" class="sns__btn" data-sns-show>SHOW NOTIFICATION</button>
  <p class="sns__status" data-sns-status aria-live="polite">Idle — no system toast.</p>
</div>
