<div class="hfs" data-hfs>
  <div class="hfs__stage" aria-hidden="true">
    <div class="hfs__target" data-hfs-target>
      <div class="hfs__reticle" data-hfs-reticle></div>
    </div>
    <div class="hfs__meta" data-hfs-meta hidden>
      <span class="hfs__chip">TYPE: ARTIFACT</span>
      <span class="hfs__chip">RARITY: UNCOMMON</span>
      <span class="hfs__chip">VALUE: 240</span>
    </div>
  </div>
  <button type="button" class="hfs__btn" data-hfs-scan>SCAN TARGET</button>
  <p class="hfs__status" data-hfs-status aria-live="polite">Target idle — metadata hidden</p>
</div>
