<div class="gcr" data-ps="game-crash-recovery">
  <p class="gcr__eyebrow">Game Crash Recovery</p>
  <div class="gcr__stage" data-gcr-stage data-phase="playing">
    <div class="gcr__game" aria-hidden="true">
      <span class="gcr__game-label">PLAYING</span>
      <div class="gcr__fold" data-gcr-fold></div>
    </div>
    <div class="gcr__error" data-gcr-error hidden>
      <p class="gcr__code">CE-34878-0</p>
      <p class="gcr__msg">Something went wrong with this application.</p>
      <div class="gcr__actions">
        <button type="button" class="gcr__act" data-gcr-retry>RETRY</button>
        <button type="button" class="gcr__act gcr__act--ghost" data-gcr-close>CLOSE APP</button>
      </div>
    </div>
  </div>
  <button type="button" class="gcr__btn" data-gcr-crash>SIMULATE CRASH</button>
  <p class="gcr__status" data-gcr-status aria-live="polite">Game running normally.</p>
</div>
