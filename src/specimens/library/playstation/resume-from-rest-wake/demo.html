<div class="rfw" data-rfw data-phase="asleep">
  <p class="rfw__eyebrow">Resume-from-Rest Wake</p>

  <div class="rfw__stage" data-rfw-stage>
    <p class="rfw__memory" data-rfw-memory aria-hidden="true">FOCUS MEMORY</p>

    <div class="rfw__dock" data-rfw-dock aria-hidden="true">
      <span class="rfw__tile"></span>
      <span class="rfw__tile rfw__tile--focus" data-rfw-focus>
        <span class="rfw__ghost" data-rfw-ghost></span>
      </span>
      <span class="rfw__tile"></span>
    </div>

    <div class="rfw__halo" data-rfw-halo aria-hidden="true"></div>
  </div>

  <button type="button" class="rfw__btn" data-rfw-wake>RESTORE FOCUS</button>
  <p class="rfw__status" data-rfw-status aria-live="polite">Asleep — dock dimmed, focus memory retained (not black).</p>
</div>
