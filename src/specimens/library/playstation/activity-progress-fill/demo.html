<div class="apf" data-apf data-phase="idle">
  <p class="apf__live" data-apf-live aria-live="polite">Activity at 0 percent.</p>
  <p class="apf__eyebrow">ACTIVITY PROGRESS</p>
  <article class="apf__card">
    <header class="apf__head">
      <h2 class="apf__title">Sector Clear</h2>
      <span class="apf__chip" data-apf-chip>0%</span>
    </header>
    <p class="apf__sub">Objective progress</p>
    <div
      class="apf__track"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-label="Sector Clear progress"
      data-apf-bar
    >
      <span class="apf__fill" data-apf-fill style="width:0%"></span>
      <span class="apf__boundary" aria-hidden="true" title="Completion boundary"></span>
    </div>
    <div class="apf__ticks" aria-hidden="true">
      <span data-tick="0">0</span>
      <span data-tick="28">28</span>
      <span data-tick="55">55</span>
      <span data-tick="82">82</span>
      <span data-tick="100">100</span>
    </div>
  </article>
  <div class="apf__controls">
    <button type="button" class="apf__btn" data-apf-run>Advance</button>
    <button type="button" class="apf__btn apf__btn--ghost" data-apf-reset>Reset</button>
  </div>
  <p class="apf__status" data-apf-status>Idle — press Advance to fill toward the completion boundary.</p>
</div>
