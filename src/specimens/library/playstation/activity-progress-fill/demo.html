<div class="ps apf" data-apf>
  <p class="ps__live" data-apf-live aria-live="polite">Activity at 0 percent.</p>
  <p class="ps__eyebrow">ACTIVITY PROGRESS</p>
  <article class="apf__card">
    <h2 class="apf__title">Sector Clear</h2>
    <p class="apf__sub">Objective progress</p>
    <div class="apf__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-apf-bar>
      <span class="apf__fill" data-apf-fill style="width:0%"></span>
    </div>
    <p class="apf__pct" data-apf-pct>0%</p>
  </article>
  <div class="apf__controls">
    <button type="button" class="ps__btn" data-apf-run>Advance</button>
    <button type="button" class="ps__btn" data-apf-reset>Reset</button>
  </div>
  <p class="ps__status" data-apf-status>Idle — press Advance to fill progress.</p>
</div>
