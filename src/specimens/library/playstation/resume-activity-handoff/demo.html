<div class="rah" data-rah data-phase="card">
  <p class="rah__live" data-rah-live aria-live="polite">Activity card idle.</p>
  <div class="rah__stage" data-rah-stage>
    <div class="rah__card" data-rah-card data-animate>
      <span class="rah__card-label">OBJECTIVE A</span>
      <span class="rah__card-pct">62%</span>
    </div>
    <div class="rah__active" data-rah-active>
      <p class="rah__active-title">OBJECTIVE A</p>
      <p class="rah__active-status">RESUMED</p>
      <span class="rah__active-geo" aria-hidden="true"></span>
    </div>
  </div>
  <div class="rah__controls">
    <button type="button" class="rah__btn rah__btn--primary" data-rah-run>Resume</button>
    <button type="button" class="rah__btn" data-rah-reset>Reset</button>
  </div>
</div>
