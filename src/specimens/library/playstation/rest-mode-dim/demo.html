<div class="rmd" data-rmd data-phase="active">
  <p class="rmd__eyebrow">Rest Mode Dim</p>

  <div class="rmd__stage" data-rmd-stage data-phase="active">
    <div class="rmd__horizon" aria-hidden="true"></div>
    <div class="rmd__console" aria-hidden="true">
      <span class="rmd__console-body"></span>
      <span class="rmd__console-light" data-rmd-light></span>
      <span class="rmd__console-stand"></span>
    </div>
    <div class="rmd__activity" aria-hidden="true">
      <span class="rmd__bar"></span>
      <span class="rmd__bar"></span>
      <span class="rmd__bar"></span>
      <span class="rmd__bar"></span>
    </div>
    <p class="rmd__sleep" data-rmd-sleep>REST</p>
  </div>

  <button type="button" class="rmd__btn" data-rmd-enter>ENTER REST MODE</button>
  <p class="rmd__status" data-rmd-status aria-live="polite">System active — full luminance.</p>
</div>
