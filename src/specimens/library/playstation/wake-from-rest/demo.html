<div class="ps" data-ps="wake-from-rest">
  <p class="ps__eyebrow">Wake from Rest</p>
  <div class="ps__stage wfr__stage" data-wfr-stage data-phase="dark">
    <div class="ps__grid" aria-hidden="true">
      <div class="ps__card"></div>
      <div class="ps__card is-focus" data-wfr-focus></div>
      <div class="ps__card"></div>
    </div>
    <div class="wfr__black" data-wfr-black aria-hidden="true"></div>
  </div>
  <button type="button" class="ps__btn" data-wfr-wake>WAKE</button>
  <p class="ps__status" data-wfr-status aria-live="polite">Resting — screen dark, focus memory held.</p>
</div>
