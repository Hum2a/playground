<div class="lgf" data-lgf>
  <div class="lgf__grid" data-lgf-grid aria-hidden="true"></div>
  <div class="lgf__controls">
    <button type="button" class="lgf__btn" data-lgf-up aria-label="Move focus up">↑</button>
    <button type="button" class="lgf__btn" data-lgf-left aria-label="Move focus left">←</button>
    <button type="button" class="lgf__btn" data-lgf-right aria-label="Move focus right">→</button>
    <button type="button" class="lgf__btn" data-lgf-down aria-label="Move focus down">↓</button>
  </div>
  <p class="lgf__status" data-lgf-status aria-live="polite">Focus: row 1, col 1</p>
</div>
