<div class="nlt" data-ps="network-lost-takeover">
  <p class="nlt__eyebrow">Network Lost Takeover</p>
  <div class="nlt__stage" data-nlt-stage data-phase="online">
    <div class="nlt__play" aria-hidden="true">
      <span class="nlt__hud">ONLINE SESSION</span>
      <div class="nlt__bars"><i></i><i></i><i></i></div>
    </div>
    <div class="nlt__veil" aria-hidden="true"></div>
    <div class="nlt__offline" data-nlt-offline hidden>
      <p class="nlt__title">Connection lost</p>
      <p class="nlt__body">Check your network settings and try again.</p>
      <button type="button" class="nlt__retry" data-nlt-retry>RETRY</button>
    </div>
  </div>
  <button type="button" class="nlt__btn" data-nlt-trigger>LOSE CONNECTION</button>
  <p class="nlt__status" data-nlt-status aria-live="polite">Online — session active.</p>
</div>
