<div class="ps" data-ps="network-lost-takeover">
  <p class="ps__eyebrow">Network Lost Takeover</p>
  <div class="ps__stage nlt__stage" data-nlt-stage data-phase="online">
    <div class="ps__game nlt__content" aria-hidden="true"><span>ONLINE SESSION</span></div>
    <div class="ps__offline nlt__offline" data-nlt-offline hidden>
      <p class="nlt__title">Connection lost</p>
      <p class="nlt__body">Check your network settings and try again.</p>
      <button type="button" class="nlt__retry" data-nlt-retry>RETRY</button>
    </div>
  </div>
  <button type="button" class="ps__btn" data-nlt-trigger>LOSE CONNECTION</button>
  <p class="ps__status" data-nlt-status aria-live="polite">Online — session active.</p>
</div>
