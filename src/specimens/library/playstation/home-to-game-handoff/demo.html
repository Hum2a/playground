<div class="htgh" data-htgh data-phase="idle">
  <p class="htgh__live" data-htgh-live aria-live="polite">Home ready.</p>
  <div class="htgh__stage" data-htgh-stage>
    <div class="htgh__rail" data-htgh-rail>
      <div class="htgh__tile" data-htgh-tile>TITLE A</div>
      <div class="htgh__tile htgh__tile--ghost">TITLE B</div>
    </div>
    <div class="htgh__launch" data-htgh-launch>
      <p class="htgh__launch-title">TITLE A</p>
      <p class="htgh__launch-status">LAUNCHING</p>
    </div>
  </div>
  <div class="htgh__controls">
    <button type="button" class="htgh__btn htgh__btn--primary" data-htgh-run>SELECT</button>
    <button type="button" class="htgh__btn" data-htgh-reset>RESET</button>
  </div>
</div>
