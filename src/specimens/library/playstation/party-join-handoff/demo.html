<div class="pjh" data-pjh>
  <div class="pjh__card" data-pjh-card>
    <p class="pjh__card-title">Party Invite</p>
    <p class="pjh__card-meta">3 friends waiting</p>
    <button type="button" class="pjh__btn" data-pjh-join>JOIN PARTY</button>
  </div>
  <div class="pjh__session" data-pjh-session hidden>
    <p class="pjh__session-title">Active Session</p>
    <ul class="pjh__roster" aria-hidden="true">
      <li><span class="pjh__dot"></span>You</li>
      <li><span class="pjh__dot"></span>Friend A</li>
      <li><span class="pjh__dot"></span>Friend B</li>
    </ul>
    <button type="button" class="pjh__btn" data-pjh-leave>LEAVE</button>
  </div>
  <p class="pjh__status" data-pjh-status aria-live="polite">Invite card — not joined</p>
</div>
