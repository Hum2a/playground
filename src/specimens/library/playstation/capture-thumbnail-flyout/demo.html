<div class="ctf" data-ps="capture-thumbnail-flyout">
  <p class="ctf__eyebrow">Capture Thumbnail Flyout</p>
  <div class="ctf__stage" data-ctf-stage>
    <div class="ctf__scene" aria-hidden="true"><span>PLAY SURFACE</span></div>
    <div class="ctf__thumb" data-ctf-thumb hidden aria-hidden="true"></div>
    <div class="ctf__dock" data-ctf-dock aria-hidden="true"><span>SAVED</span></div>
  </div>
  <button type="button" class="ctf__btn" data-ctf-capture>CAPTURE</button>
  <p class="ctf__status" data-ctf-status aria-live="polite">Ready — thumb will arc to saved dock.</p>
</div>
