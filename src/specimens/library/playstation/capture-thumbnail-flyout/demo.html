<div class="ps" data-ps="capture-thumbnail-flyout">
  <p class="ps__eyebrow">Capture Thumbnail Flyout</p>
  <div class="ps__stage ctf__stage" data-ctf-stage>
    <div class="ctf__scene" aria-hidden="true"><span>PLAY SURFACE</span></div>
    <div class="ps__thumb ctf__thumb" data-ctf-thumb hidden aria-hidden="true"></div>
    <div class="ctf__dock" data-ctf-dock aria-hidden="true"><span>SAVED</span></div>
  </div>
  <button type="button" class="ps__btn" data-ctf-capture>CAPTURE</button>
  <p class="ps__status" data-ctf-status aria-live="polite">Ready — capture will fly to saved dock.</p>
</div>
