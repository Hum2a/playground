<div class="sbg" data-sbg data-phase="dark">
  <p class="sbg__live" data-sbg-live aria-live="polite">System dark — luminance 0%.</p>

  <div class="sbg__screen" data-sbg-screen>
    <div class="sbg__glow" data-sbg-glow aria-hidden="true"></div>
    <div class="sbg__luma" aria-hidden="true">
      <span class="sbg__luma-mark" data-sbg-luma>0%</span>
    </div>
    <div class="sbg__ui" data-sbg-ui>
      <span class="sbg__dot" aria-hidden="true"></span>
      <p class="sbg__ready">READY</p>
    </div>
  </div>

  <button type="button" class="sbg__btn sbg__btn--primary" data-sbg-run>Boot</button>
</div>
