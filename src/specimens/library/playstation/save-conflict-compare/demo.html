<div class="scc" data-scc data-phase="compare" data-selection="">
  <p class="scc__live" data-scc-live aria-live="polite">Save conflict — select a version to keep.</p>
  <p class="scc__system">SAVE // CONFLICT COMPARE</p>

  <div class="scc__stage">
    <div class="scc__pair" role="group" aria-label="Save versions">
      <button type="button" class="scc__card" data-scc-save data-side="local" aria-pressed="false">
        <span class="scc__badge">LOCAL</span>
        <span class="scc__card-title">Console save</span>
        <span class="scc__row"><span class="scc__key">Time</span><span class="scc__val">18:42</span></span>
        <span class="scc__row"><span class="scc__key">Progress</span><span class="scc__val">67%</span></span>
        <span class="scc__row scc__row--diff"><span class="scc__key">Chapter</span><span class="scc__val">4</span></span>
        <span class="scc__select-label" data-scc-select-label>Select</span>
      </button>
      <button type="button" class="scc__card" data-scc-save data-side="cloud" aria-pressed="false">
        <span class="scc__badge scc__badge--cloud">CLOUD</span>
        <span class="scc__card-title">Cloud save</span>
        <span class="scc__row"><span class="scc__key">Time</span><span class="scc__val">19:15</span></span>
        <span class="scc__row scc__row--diff"><span class="scc__key">Progress</span><span class="scc__val">72%</span></span>
        <span class="scc__row scc__row--diff"><span class="scc__key">Chapter</span><span class="scc__val">5</span></span>
        <span class="scc__select-label" data-scc-select-label>Select</span>
      </button>
    </div>
    <button type="button" class="scc__commit" data-scc-commit disabled>Keep selected save</button>
    <p class="scc__status" data-scc-status>CONFLICT</p>
    <p class="scc__hint" data-scc-hint>Select a card, then commit — or Run.</p>
  </div>

  <div class="scc__controls">
    <button type="button" class="scc__btn scc__btn--primary" data-scc-run>Run</button>
    <button type="button" class="scc__btn" data-scc-replay>Replay</button>
  </div>
</div>
