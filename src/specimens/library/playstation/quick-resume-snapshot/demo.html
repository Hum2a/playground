<div class="ps" data-ps="quick-resume-snapshot">
  <p class="ps__eyebrow">Quick Resume Snapshot</p>
  <div class="ps__stage qrs__stage" data-qrs-stage>
    <div class="qrs__active" data-qrs-active aria-hidden="true">
      <span class="qrs__label">ACTIVE SESSION</span>
      <div class="qrs__playbar"><span></span></div>
    </div>
    <div class="qrs__snap" data-qrs-snap aria-hidden="true">
      <span class="qrs__paused">PAUSED</span>
    </div>
  </div>
  <button type="button" class="ps__btn" data-qrs-resume>RESUME</button>
  <p class="ps__status" data-qrs-status aria-live="polite">Snapshot card ready — press RESUME to expand.</p>
</div>
