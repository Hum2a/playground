<div class="qrs" data-qrs data-phase="frozen">
  <p class="qrs__eyebrow">Quick Resume Snapshot</p>

  <div class="qrs__stage" data-qrs-stage>
    <div class="qrs__snap" data-qrs-snap aria-hidden="true">
      <div class="qrs__frost"></div>
      <span class="qrs__stamp">PAUSED</span>
      <span class="qrs__frame-meta">STILL · 0:42:18</span>
    </div>

    <div class="qrs__live" data-qrs-live aria-hidden="true">
      <span class="qrs__live-badge">LIVE</span>
      <span class="qrs__live-title">ACTIVE SESSION</span>
      <div class="qrs__playbar"><span data-qrs-bar></span></div>
      <div class="qrs__pulse" aria-hidden="true"></div>
    </div>
  </div>

  <button type="button" class="qrs__btn" data-qrs-resume>RESUME</button>
  <p class="qrs__status" data-qrs-status aria-live="polite">Frozen snapshot — still frame with PAUSED stamp.</p>
</div>
