<div class="osa" data-osa data-phase="idle">
  <p class="osa__live" data-osa-live aria-live="polite">Focus on step 1: Scan route.</p>
  <p class="osa__eyebrow">OBJECTIVE CHAIN</p>
  <ol class="osa__steps" aria-label="Objective steps">
    <li class="osa__step is-current" data-osa-step="0" data-state="current">
      <span class="osa__focus" aria-hidden="true"></span>
      <span class="osa__dot"></span>
      <span class="osa__label">Scan route</span>
    </li>
    <li class="osa__link" data-osa-link="0" aria-hidden="true">
      <span class="osa__rail"></span>
      <span class="osa__pulse"></span>
    </li>
    <li class="osa__step" data-osa-step="1" data-state="pending">
      <span class="osa__focus" aria-hidden="true"></span>
      <span class="osa__dot"></span>
      <span class="osa__label">Secure node</span>
    </li>
    <li class="osa__link" data-osa-link="1" aria-hidden="true">
      <span class="osa__rail"></span>
      <span class="osa__pulse"></span>
    </li>
    <li class="osa__step" data-osa-step="2" data-state="pending">
      <span class="osa__focus" aria-hidden="true"></span>
      <span class="osa__dot"></span>
      <span class="osa__label">Extract data</span>
    </li>
  </ol>
  <div class="osa__controls">
    <button type="button" class="osa__btn" data-osa-run>Advance step</button>
    <button type="button" class="osa__btn osa__btn--ghost" data-osa-reset>Reset</button>
  </div>
  <p class="osa__status" data-osa-status>Step 1 of 3 focused — complete to hand off focus.</p>
</div>
