<div class="cda" data-cda>
  <p class="cda__eyebrow">Controller Disconnected Alert</p>
  <div class="cda__stage">
    <div class="cda__play" aria-hidden="true">
      <p class="cda__play-label">GAME SURFACE</p>
      <div class="cda__play-field"></div>
    </div>
    <div class="cda__overlay" data-cda-overlay hidden role="alert">
      <div class="cda__modal">
        <span class="cda__priority">SYSTEM</span>
        <span class="cda__icon" aria-hidden="true"></span>
        <p class="cda__title">Controller disconnected</p>
        <p class="cda__body">Reconnect your controller to continue.</p>
        <button type="button" class="cda__btn cda__btn--ghost" data-cda-dismiss>DISMISS</button>
      </div>
    </div>
  </div>
  <button type="button" class="cda__btn" data-cda-trigger>SIMULATE DISCONNECT</button>
  <p class="cda__status" data-cda-status aria-live="polite">Playing — controller connected</p>
</div>
