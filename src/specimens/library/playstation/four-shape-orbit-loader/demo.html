<div class="fso" data-fso>
  <div class="fso__stage" data-fso-stage aria-hidden="true">
    <div class="fso__hub"></div>
    <div class="fso__orbit fso__anim" data-fso-orbit>
      <span class="fso__shape fso__shape--circle" data-fso-shape="0"></span>
      <span class="fso__shape fso__shape--cross" data-fso-shape="1"></span>
      <span class="fso__shape fso__shape--square" data-fso-shape="2"></span>
      <span class="fso__shape fso__shape--triangle" data-fso-shape="3"></span>
    </div>
    <div class="fso__frame" data-fso-frame hidden></div>
  </div>
  <div class="fso__controls">
    <button type="button" class="fso__btn" data-fso-complete>COMPLETE</button>
    <button type="button" class="fso__btn" data-fso-reset>RESET</button>
  </div>
  <p class="fso__status" data-fso-status aria-live="polite">Orbiting — loader active</p>
</div>
