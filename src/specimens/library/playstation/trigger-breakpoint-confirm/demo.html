<div class="tbc" data-tbc data-phase="idle">
  <p class="tbc__live" data-tbc-live aria-live="polite">Trigger breakpoint idle.</p>
  <p class="tbc__system">DUALSENSE // BREAKPOINT · 68%</p>

  <div class="tbc__stage">
    <div class="tbc__travel" aria-hidden="true">
      <span class="tbc__zone tbc__zone--travel"></span>
      <span class="tbc__zone tbc__zone--resist"></span>
      <span class="tbc__zone tbc__zone--commit"></span>
      <span class="tbc__notch" data-tbc-notch>
        <span class="tbc__notch-mark"></span>
        <span class="tbc__notch-label">68%</span>
      </span>
      <span class="tbc__fill" data-tbc-fill></span>
    </div>
    <button type="button" class="tbc__grip" data-tbc-bar aria-label="Hold past 68 percent breakpoint">
      HOLD PAST NOTCH
    </button>
    <p class="tbc__status" data-tbc-status>IDLE</p>
    <p class="tbc__hint" data-tbc-hint>Resistance rises before 68% notch.</p>
  </div>

  <div class="tbc__controls">
    <button type="button" class="tbc__btn tbc__btn--primary" data-tbc-run>Run</button>
    <button type="button" class="tbc__btn" data-tbc-replay>Replay</button>
  </div>
</div>
