<div class="vbh" data-volume-brightness-hud data-phase="hidden">
  <p class="vbh__metric">OUTPUT LEVEL</p>

  <button type="button" class="vbh__trigger" data-vbh-increase>INCREASE</button>

  <div class="vbh__hud" data-vbh-hud aria-hidden="true" role="presentation">
    <span class="vbh__hud-label">OUTPUT LEVEL</span>
    <div class="vbh__segments" data-vbh-segments>
      <span class="vbh__seg" data-vbh-seg="0"></span>
      <span class="vbh__seg" data-vbh-seg="1"></span>
      <span class="vbh__seg" data-vbh-seg="2"></span>
      <span class="vbh__seg" data-vbh-seg="3"></span>
      <span class="vbh__seg" data-vbh-seg="4"></span>
      <span class="vbh__seg" data-vbh-seg="5"></span>
      <span class="vbh__seg" data-vbh-seg="6"></span>
      <span class="vbh__seg" data-vbh-seg="7"></span>
      <span class="vbh__seg" data-vbh-seg="8"></span>
      <span class="vbh__seg" data-vbh-seg="9"></span>
    </div>
    <span class="vbh__value" data-vbh-value>42</span>
  </div>

  <p class="vbh__status" role="status" aria-live="polite" data-vbh-status>
    Output level 42. Press INCREASE to raise to 68.
  </p>
</div>
