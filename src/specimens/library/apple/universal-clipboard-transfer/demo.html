<div class="uct" data-universal-clipboard-transfer data-phase="idle">
  <div class="uct__stage" data-uct-stage>
    <div class="uct__device" data-uct-source>
      <span class="uct__device-name">DESKTOP</span>
      <p class="uct__text" data-uct-source-text>
        Deploy ref: <mark class="uct__selection" data-uct-selection>BUILD-184</mark>
      </p>
      <span class="uct__copied" data-uct-copied hidden>COPIED</span>
    </div>

    <div class="uct__corridor" data-uct-corridor aria-hidden="true">
      <span class="uct__dot"></span>
      <span class="uct__dot"></span>
      <span class="uct__dot"></span>
      <span class="uct__dot"></span>
      <span class="uct__dot"></span>
      <span class="uct__dot"></span>
    </div>

    <div class="uct__device" data-uct-dest>
      <span class="uct__device-name">TABLET</span>
      <p class="uct__text uct__text--dest" data-uct-dest-text>
        Notes:<span class="uct__caret" data-uct-caret aria-hidden="true"></span>
      </p>
    </div>

    <div class="uct__token" data-uct-token hidden aria-hidden="true">BUILD-184</div>
  </div>

  <button type="button" class="uct__handoff" data-uct-handoff>COPY &amp; HANDOFF</button>

  <p class="uct__status" role="status" aria-live="polite" data-uct-status>
    Select BUILD-184 on DESKTOP and hand off to TABLET.
  </p>
</div>
