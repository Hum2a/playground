<div class="qle" data-quick-look-expansion data-phase="list">
  <div class="qle__shell" data-qle-shell>
    <ul class="qle__list" data-qle-list aria-label="File list">
      <li class="qle__row"><span class="qle__glyph" aria-hidden="true"></span><span class="qle__name">NOTES.TXT</span></li>
      <li class="qle__row"><span class="qle__glyph" aria-hidden="true"></span><span class="qle__name">BRIEF.DOC</span></li>
      <li class="qle__row qle__row--selected" data-qle-selected>
        <span class="qle__glyph" aria-hidden="true"></span>
        <span class="qle__name" data-qle-filename>DESIGN.PDF</span>
      </li>
      <li class="qle__row"><span class="qle__glyph" aria-hidden="true"></span><span class="qle__name">ASSETS.ZIP</span></li>
      <li class="qle__row"><span class="qle__glyph" aria-hidden="true"></span><span class="qle__name">EXPORT.CSV</span></li>
    </ul>

    <div class="qle__preview" data-qle-preview hidden aria-hidden="true">
      <header class="qle__preview-header" data-qle-header>
        <span class="qle__glyph qle__glyph--large" aria-hidden="true"></span>
        <h2 class="qle__preview-title">DESIGN.PDF</h2>
      </header>
      <div class="qle__preview-body">
        <div class="qle__block" data-qle-block></div>
        <div class="qle__block" data-qle-block></div>
        <div class="qle__block" data-qle-block></div>
      </div>
      <button type="button" class="qle__close" data-qle-close>CLOSE</button>
    </div>
  </div>

  <div class="qle__controls">
    <button type="button" class="qle__btn" data-qle-open>PREVIEW</button>
  </div>

  <p class="qle__status" role="status" aria-live="polite" data-qle-status>
    DESIGN.PDF selected. Open preview to expand from row context.
  </p>
</div>
