<div class="bsa" data-biometric-scan-acquisition data-phase="idle">
  <p class="bsa__label">IDENTITY SCAN</p>

  <div class="bsa__field-wrap">
    <div class="bsa__field" data-bsa-field aria-hidden="true">
      <span class="bsa__bracket bsa__bracket--tl" aria-hidden="true"></span>
      <span class="bsa__bracket bsa__bracket--tr" aria-hidden="true"></span>
      <span class="bsa__bracket bsa__bracket--bl" aria-hidden="true"></span>
      <span class="bsa__bracket bsa__bracket--br" aria-hidden="true"></span>
      <span class="bsa__scanline" data-bsa-scanline aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="0" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="1" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="2" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="3" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="4" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="5" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="6" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="7" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="8" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="9" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="10" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="11" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="12" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="13" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="14" aria-hidden="true"></span>
      <span class="bsa__node" data-bsa-node="15" aria-hidden="true"></span>
    </div>
  </div>

  <p class="bsa__status" role="status" aria-live="polite" data-bsa-status>LOCKED</p>

  <div class="bsa__controls">
    <button type="button" class="bsa__btn" data-bsa-scan>START SCAN</button>
    <button type="button" class="bsa__btn bsa__btn--vault" data-bsa-vault disabled>OPEN VAULT</button>
  </div>
</div>
