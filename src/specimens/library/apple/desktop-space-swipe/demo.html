<div class="dss" data-desktop-space-swipe data-space="01">
  <p class="dss__label">DESKTOP SPACES</p>

  <div class="dss__viewport" data-dss-viewport>
    <div class="dss__track" data-dss-track>
      <div class="dss__plane" data-dss-plane="01" aria-label="Space 01">
        <div class="dss__window" style="--dss-x:24px;--dss-y:28px;--dss-w:200px;--dss-h:130px;">EDITOR</div>
        <div class="dss__window" style="--dss-x:180px;--dss-y:52px;--dss-w:180px;--dss-h:120px;">TERMINAL</div>
        <div class="dss__window" style="--dss-x:96px;--dss-y:168px;--dss-w:220px;--dss-h:140px;">PREVIEW</div>
      </div>
      <div class="dss__plane" data-dss-plane="02" aria-label="Space 02">
        <div class="dss__window" style="--dss-x:48px;--dss-y:40px;--dss-w:240px;--dss-h:150px;">DOCS</div>
        <div class="dss__window" style="--dss-x:220px;--dss-y:120px;--dss-w:190px;--dss-h:130px;">CHAT</div>
      </div>
    </div>
  </div>

  <p class="dss__indicator" aria-live="polite">SPACE <span data-dss-indicator>01</span></p>

  <div class="dss__controls">
    <button type="button" class="dss__btn" data-dss-next>NEXT SPACE</button>
    <button type="button" class="dss__btn dss__btn--ghost" data-dss-prev disabled>PREVIOUS</button>
  </div>

  <p class="dss__status" role="status" aria-live="polite" data-dss-status>Space 01 — three windows.</p>
</div>
