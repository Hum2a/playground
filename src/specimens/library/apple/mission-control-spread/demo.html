<div class="mcs" data-mission-control data-phase="desktop">
  <div class="mcs__desktop" data-mcs-stage aria-hidden="true">
    <div
      class="mcs__window"
      data-mcs-window="editor"
      data-mcs-z="3"
      tabindex="0"
      role="button"
      aria-label="EDITOR window"
    >
      <span class="mcs__titlebar">EDITOR</span>
      <span class="mcs__body" aria-hidden="true"></span>
    </div>
    <div
      class="mcs__window"
      data-mcs-window="terminal"
      data-mcs-z="1"
      aria-hidden="true"
    >
      <span class="mcs__titlebar">TERMINAL</span>
      <span class="mcs__body" aria-hidden="true"></span>
    </div>
    <div
      class="mcs__window"
      data-mcs-window="docs"
      data-mcs-z="2"
      aria-hidden="true"
    >
      <span class="mcs__titlebar">DOCS</span>
      <span class="mcs__body" aria-hidden="true"></span>
    </div>
    <div
      class="mcs__window"
      data-mcs-window="chat"
      data-mcs-z="4"
      aria-hidden="true"
    >
      <span class="mcs__titlebar">CHAT</span>
      <span class="mcs__body" aria-hidden="true"></span>
    </div>
    <div
      class="mcs__window"
      data-mcs-window="preview"
      data-mcs-z="5"
      aria-hidden="true"
    >
      <span class="mcs__titlebar">PREVIEW</span>
      <span class="mcs__body" aria-hidden="true"></span>
    </div>
  </div>

  <p class="mcs__space" data-mcs-space aria-hidden="true">SPACE // 01</p>

  <div class="mcs__controls">
    <button type="button" class="mcs__btn" data-mcs-overview>OVERVIEW</button>
  </div>

  <p class="mcs__status" role="status" aria-live="polite" data-mcs-status>
    Five overlapping windows on desktop.
  </p>
</div>
