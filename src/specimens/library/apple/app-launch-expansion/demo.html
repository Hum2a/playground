<div class="ale" data-app-launch-expansion data-phase="grid">
  <div class="ale__grid" data-ale-grid>
    <button type="button" class="ale__tile" data-ale-tile="01" aria-label="App 01"><span class="ale__glyph">01</span></button>
    <button type="button" class="ale__tile" data-ale-tile="02" aria-label="App 02"><span class="ale__glyph">02</span></button>
    <button type="button" class="ale__tile" data-ale-tile="03" aria-label="App 03"><span class="ale__glyph">03</span></button>
    <button type="button" class="ale__tile" data-ale-tile="04" aria-label="App 04"><span class="ale__glyph">04</span></button>
    <button type="button" class="ale__tile ale__tile--target" data-ale-tile="05" aria-label="App 05"><span class="ale__glyph">05</span><span class="ale__tile-label">APP // 05</span></button>
    <button type="button" class="ale__tile" data-ale-tile="06" aria-label="App 06"><span class="ale__glyph">06</span></button>
    <button type="button" class="ale__tile" data-ale-tile="07" aria-label="App 07"><span class="ale__glyph">07</span></button>
    <button type="button" class="ale__tile" data-ale-tile="08" aria-label="App 08"><span class="ale__glyph">08</span></button>
    <button type="button" class="ale__tile" data-ale-tile="09" aria-label="App 09"><span class="ale__glyph">09</span></button>
  </div>

  <div class="ale__layer" data-ale-layer hidden aria-hidden="true">
    <div class="ale__layer-header">
      <span class="ale__layer-glyph" data-ale-layer-glyph>05</span>
      <h2 class="ale__layer-title">ANALYTICS</h2>
    </div>
    <div class="ale__layer-body" data-ale-detail>
      <p class="ale__metric"><span class="ale__metric-label">SESSIONS</span><span class="ale__metric-value">12.4K</span></p>
      <p class="ale__metric"><span class="ale__metric-label">RETENTION</span><span class="ale__metric-value">68%</span></p>
      <p class="ale__metric"><span class="ale__metric-label">CONVERSION</span><span class="ale__metric-value">3.2%</span></p>
    </div>
    <button type="button" class="ale__close" data-ale-close>CLOSE</button>
  </div>

  <p class="ale__status" role="status" aria-live="polite" data-ale-status>Grid ready. Launch App 05.</p>
</div>
