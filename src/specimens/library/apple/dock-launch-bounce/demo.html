<div class="dlbounce" data-dock-launch-bounce data-state="closed" data-phase="idle">
  <p class="dlbounce__label">LAUNCHER</p>

  <div class="dlbounce__dock" data-dlb-dock role="group" aria-label="Launcher dock">
    <div class="dlbounce__tile" data-dlb-tile="1">
      <span class="dlbounce__glyph dlbounce__glyph--01" aria-hidden="true"></span>
      <span class="dlbounce__name">APP // 01</span>
    </div>
    <div class="dlbounce__tile" data-dlb-tile="2">
      <span class="dlbounce__glyph dlbounce__glyph--02" aria-hidden="true"></span>
      <span class="dlbounce__name">APP // 02</span>
    </div>
    <div class="dlbounce__tile dlbounce__tile--target" data-dlb-tile="3" data-dlb-target>
      <span class="dlbounce__glyph dlbounce__glyph--03" aria-hidden="true"></span>
      <span class="dlbounce__name">APP // 03</span>
      <span class="dlbounce__indicator" data-dlb-indicator aria-hidden="true"></span>
    </div>
    <div class="dlbounce__tile" data-dlb-tile="4">
      <span class="dlbounce__glyph dlbounce__glyph--04" aria-hidden="true"></span>
      <span class="dlbounce__name">APP // 04</span>
    </div>
    <div class="dlbounce__tile" data-dlb-tile="5">
      <span class="dlbounce__glyph dlbounce__glyph--05" aria-hidden="true"></span>
      <span class="dlbounce__name">APP // 05</span>
    </div>
  </div>

  <div class="dlbounce__controls">
    <button type="button" class="dlbounce__btn" data-dlb-launch>LAUNCH 03</button>
    <button type="button" class="dlbounce__btn dlbounce__btn--ghost" data-dlb-replay>REPLAY</button>
  </div>

  <p class="dlbounce__status" role="status" aria-live="polite" data-dlb-status>CLOSED</p>
</div>
