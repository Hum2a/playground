<div class="hfc" data-handoff-continuation data-phase="idle">
  <div class="hfc__stage" data-hfc-stage>
    <div class="hfc__device" data-hfc-device-a>
      <span class="hfc__device-name">DESKTOP</span>
      <span class="hfc__ownership" data-hfc-own-a>ACTIVE</span>
      <article class="hfc__task" data-hfc-task>
        <span class="hfc__task-title">EDIT // REPORT</span>
        <div class="hfc__progress">
          <div class="hfc__progress-fill" data-hfc-progress style="width:68%"></div>
        </div>
        <span class="hfc__progress-label" data-hfc-progress-label>68%</span>
      </article>
    </div>

    <div class="hfc__bridge" data-hfc-bridge aria-hidden="true">
      <span class="hfc__segment"></span>
      <span class="hfc__segment"></span>
      <span class="hfc__segment"></span>
      <span class="hfc__segment"></span>
      <span class="hfc__segment"></span>
      <span class="hfc__segment"></span>
    </div>

    <div class="hfc__device" data-hfc-device-b>
      <span class="hfc__device-name">TABLET</span>
      <span class="hfc__ownership" data-hfc-own-b>WAITING</span>
      <div class="hfc__dock" data-hfc-dock></div>
    </div>
  </div>

  <button type="button" class="hfc__handoff" data-hfc-handoff>HAND OFF</button>

  <p class="hfc__status" role="status" aria-live="polite" data-hfc-status>
    DESKTOP owns EDIT // REPORT at 68%.
  </p>
</div>
