<div class="ssp" data-spring-selection data-selected="day">
  <div class="ssp__track" role="tablist" aria-label="Time range">
    <span class="ssp__backing" data-ssp-backing aria-hidden="true"></span>
    <button type="button" class="ssp__seg" role="tab" data-ssp-seg="day" aria-selected="true">DAY</button>
    <button type="button" class="ssp__seg" role="tab" data-ssp-seg="week" aria-selected="false">WEEK</button>
    <button type="button" class="ssp__seg" role="tab" data-ssp-seg="month" aria-selected="false">MONTH</button>
    <button type="button" class="ssp__seg" role="tab" data-ssp-seg="year" aria-selected="false">YEAR</button>
  </div>
  <p class="ssp__status" role="status" aria-live="polite" data-ssp-status>DAY selected.</p>
</div>
