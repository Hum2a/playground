<div class="ccm" data-copy-confirmation data-phase="idle">
  <div class="ccm__row">
    <code class="ccm__token" aria-label="Code token">SPX-042</code>
    <button type="button" class="ccm__btn" data-ccm-btn aria-live="polite">
      <span class="ccm__glyph" aria-hidden="true">
        <span class="ccm__rect ccm__rect--a" data-ccm-rect-a></span>
        <span class="ccm__rect ccm__rect--b" data-ccm-rect-b></span>
        <svg class="ccm__check" data-ccm-check viewBox="0 0 24 24" width="14" height="14">
          <polyline class="ccm__check-leg" data-ccm-check-a points="5,12 10,17" />
          <polyline class="ccm__check-leg" data-ccm-check-b points="10,17 18,7" />
        </svg>
      </span>
      <span class="ccm__label" data-ccm-label>COPY</span>
    </button>
  </div>
  <p class="ccm__status" role="status" aria-live="polite" data-ccm-status>
    Press COPY to morph control geometry into confirmation.
  </p>
</div>
