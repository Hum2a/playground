<div class="capture-breakout" data-capture-breakout data-state="idle">
  <p class="capture-breakout__meta">ENTITY // UNKNOWN</p>

  <div class="capture-breakout__stage">
    <div class="capture-breakout__target" data-cbo-target aria-hidden="true">
      <span class="capture-breakout__target-core"></span>
    </div>

    <div class="capture-breakout__device" data-cbo-device aria-hidden="true">
      <span class="capture-breakout__half capture-breakout__half--upper" data-cbo-upper></span>
      <span class="capture-breakout__half capture-breakout__half--lower" data-cbo-lower></span>
      <span class="capture-breakout__seam" aria-hidden="true"></span>
      <span class="capture-breakout__diamond" data-cbo-diamond></span>
    </div>

    <div class="capture-breakout__rays" data-cbo-rays aria-hidden="true">
      <span class="capture-breakout__ray capture-breakout__ray--1"></span>
      <span class="capture-breakout__ray capture-breakout__ray--2"></span>
      <span class="capture-breakout__ray capture-breakout__ray--3"></span>
      <span class="capture-breakout__ray capture-breakout__ray--4"></span>
      <span class="capture-breakout__ray capture-breakout__ray--5"></span>
      <span class="capture-breakout__ray capture-breakout__ray--6"></span>
    </div>
  </div>

  <p class="capture-breakout__status" data-cbo-status aria-live="polite">RESOLVING</p>

  <div class="capture-breakout__controls">
    <button type="button" class="capture-breakout__btn" data-cbo-capture>CAPTURE</button>
    <button type="button" class="capture-breakout__btn capture-breakout__btn--ghost" data-cbo-retry hidden>
      RETRY
    </button>
  </div>
</div>
