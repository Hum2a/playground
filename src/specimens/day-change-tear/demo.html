<div class="dct" data-day-change data-index="0">
  <p class="dct__live" data-dct-live aria-live="polite">Thursday, 6 August</p>

  <div class="dct__stage" aria-hidden="true">
    <div class="dct__sheet dct__sheet--under" data-dct-under>
      <div class="dct__face" data-dct-face>
        <div class="dct__strip">
          <span class="dct__month" data-dct-month>AUGUST</span>
        </div>
        <div class="dct__day" data-dct-day>07</div>
        <div class="dct__weekday" data-dct-weekday>FRIDAY</div>
      </div>
    </div>

    <div class="dct__sheet dct__sheet--current" data-dct-current>
      <div class="dct__half dct__half--left" data-dct-half="left">
        <div class="dct__face" data-dct-face>
          <div class="dct__strip">
            <span class="dct__month" data-dct-month>AUGUST</span>
          </div>
          <div class="dct__day" data-dct-day>06</div>
          <div class="dct__weekday" data-dct-weekday>THURSDAY</div>
        </div>
      </div>
      <div class="dct__half dct__half--right" data-dct-half="right">
        <div class="dct__face" data-dct-face>
          <div class="dct__strip">
            <span class="dct__month" data-dct-month>AUGUST</span>
          </div>
          <div class="dct__day" data-dct-day>06</div>
          <div class="dct__weekday" data-dct-weekday>THURSDAY</div>
        </div>
      </div>

      <div class="dct__rupture" data-dct-rupture>
        <span class="dct__rupture-mark dct__rupture-mark--ink"></span>
        <span class="dct__rupture-mark dct__rupture-mark--red"></span>
      </div>

      <span class="dct__frag dct__frag--1"></span>
      <span class="dct__frag dct__frag--2"></span>
      <span class="dct__frag dct__frag--3"></span>
      <span class="dct__frag dct__frag--4"></span>
    </div>

    <div class="dct__sheet dct__sheet--incoming" data-dct-incoming hidden>
      <div class="dct__face" data-dct-face>
        <div class="dct__strip">
          <span class="dct__month" data-dct-month>AUGUST</span>
        </div>
        <div class="dct__day" data-dct-day>08</div>
        <div class="dct__weekday" data-dct-weekday>SATURDAY</div>
      </div>
    </div>
  </div>

  <div class="dct__controls">
    <button type="button" class="dct__btn" data-dct-prev>PREVIOUS</button>
    <button type="button" class="dct__btn dct__btn--next" data-dct-next>
      NEXT DAY
    </button>
  </div>
</div>
