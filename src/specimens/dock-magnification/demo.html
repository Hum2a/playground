<div class="dmagn" data-dock-magnification data-phase="idle">
  <p class="dmagn__hint">Move pointer along the dock rail.</p>

  <div
    class="dmagn__rail"
    data-dmagn-rail
    role="group"
    aria-label="Application dock"
  >
    <div class="dmagn__tiles" data-dmagn-tiles>
      <button type="button" class="dmagn__tile" data-dmagn-tile="0" aria-label="Application 01">
        <span class="dmagn__glyph dmagn__glyph--01" aria-hidden="true"></span>
        <span class="dmagn__num">01</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="1" aria-label="Application 02">
        <span class="dmagn__glyph dmagn__glyph--02" aria-hidden="true"></span>
        <span class="dmagn__num">02</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="2" aria-label="Application 03">
        <span class="dmagn__glyph dmagn__glyph--03" aria-hidden="true"></span>
        <span class="dmagn__num">03</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="3" aria-label="Application 04">
        <span class="dmagn__glyph dmagn__glyph--04" aria-hidden="true"></span>
        <span class="dmagn__num">04</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="4" aria-label="Application 05">
        <span class="dmagn__glyph dmagn__glyph--05" aria-hidden="true"></span>
        <span class="dmagn__num">05</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="5" aria-label="Application 06">
        <span class="dmagn__glyph dmagn__glyph--06" aria-hidden="true"></span>
        <span class="dmagn__num">06</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="6" aria-label="Application 07">
        <span class="dmagn__glyph dmagn__glyph--07" aria-hidden="true"></span>
        <span class="dmagn__num">07</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="7" aria-label="Application 08">
        <span class="dmagn__glyph dmagn__glyph--08" aria-hidden="true"></span>
        <span class="dmagn__num">08</span>
      </button>
      <button type="button" class="dmagn__tile" data-dmagn-tile="8" aria-label="Application 09">
        <span class="dmagn__glyph dmagn__glyph--09" aria-hidden="true"></span>
        <span class="dmagn__num">09</span>
      </button>
    </div>
    <div class="dmagn__baseline" aria-hidden="true"></div>
  </div>

  <p class="dmagn__status" role="status" aria-live="polite" data-dmagn-status>
    Dock at rest.
  </p>
</div>
