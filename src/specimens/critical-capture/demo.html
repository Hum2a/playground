<div class="crit-cap" data-crit-cap data-phase="idle">
  <p class="crit-cap__entity" data-crit-entity>ENTITY // 027</p>

  <div class="crit-cap__device" aria-hidden="true" data-crit-device>
    <div class="crit-cap__ring" data-crit-ring></div>

    <div class="crit-cap__shell">
      <div class="crit-cap__half crit-cap__half--top"></div>
      <div class="crit-cap__half crit-cap__half--bottom"></div>
      <div class="crit-cap__band"></div>
      <div class="crit-cap__core">
        <span class="crit-cap__ray crit-cap__ray--n"></span>
        <span class="crit-cap__ray crit-cap__ray--e"></span>
        <span class="crit-cap__ray crit-cap__ray--s"></span>
        <span class="crit-cap__ray crit-cap__ray--w"></span>
        <div class="crit-cap__diamond"></div>
      </div>
    </div>
  </div>

  <p class="crit-cap__status" data-crit-status aria-live="polite">VERIFYING</p>

  <button type="button" class="crit-cap__btn" data-crit-trigger>CAPTURE</button>
</div>
