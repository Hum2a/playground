<div class="afb" data-angular-focus-brackets data-phase="idle">
  <button type="button" class="afb__trigger" data-afb-trigger>Focus</button>
  <div class="afb__stage">
    <div class="afb__target" data-afb-target>
      <span class="afb__bracket afb__bracket--tl" aria-hidden="true"></span>
      <span class="afb__bracket afb__bracket--tr" aria-hidden="true"></span>
      <span class="afb__bracket afb__bracket--bl" aria-hidden="true"></span>
      <span class="afb__bracket afb__bracket--br" aria-hidden="true"></span>
      <p class="afb__kicker">TARGET</p>
      <h2 class="afb__title">READY</h2>
      <p class="afb__meta">Awaiting focus lock.</p>
    </div>
  </div>
  <p class="afb__status" data-afb-status>Brackets retracted.</p>
</div>
