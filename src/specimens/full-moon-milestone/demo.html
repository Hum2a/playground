<div class="fmm" data-full-moon-milestone data-state="idle">
  <p class="fmm__kicker" id="fmm-label">PROJECT COMPLETION</p>

  <div class="fmm__stage">
    <div
      class="fmm__progress"
      role="progressbar"
      aria-labelledby="fmm-label"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="74"
      aria-valuetext="Project completion 74 percent. Phase III milestone pending."
      data-fmm-bar
    >
      <div
        class="fmm__moon"
        style="--fmm-illum: 74"
        aria-hidden="true"
        data-fmm-moon
      >
        <span class="fmm__ring" data-fmm-ring></span>
        <span class="fmm__marks" data-fmm-marks>
          <span class="fmm__mark" style="--i: 0"></span>
          <span class="fmm__mark" style="--i: 1"></span>
          <span class="fmm__mark" style="--i: 2"></span>
          <span class="fmm__mark" style="--i: 3"></span>
          <span class="fmm__mark" style="--i: 4"></span>
          <span class="fmm__mark" style="--i: 5"></span>
          <span class="fmm__mark" style="--i: 6"></span>
          <span class="fmm__mark" style="--i: 7"></span>
        </span>
        <span class="fmm__body">
          <span class="fmm__lit"></span>
          <span class="fmm__shade"></span>
        </span>
        <span class="fmm__rim"></span>
      </div>
    </div>

    <p class="fmm__value" data-fmm-value aria-hidden="true">74%</p>

    <div class="fmm__slot" aria-hidden="true">
      <p class="fmm__phase" data-fmm-phase>PHASE III</p>
    </div>

    <p class="fmm__done" data-fmm-done hidden>MILESTONE COMPLETE</p>
  </div>

  <div class="fmm__controls">
    <button type="button" class="fmm__btn" data-fmm-complete>
      COMPLETE MILESTONE
    </button>
    <button type="button" class="fmm__btn fmm__btn--ghost" data-fmm-reset>
      RESET
    </button>
  </div>

  <p class="fmm__status" role="status" aria-live="polite" data-fmm-status>
    Project completion 74 percent. Phase III milestone pending.
  </p>
</div>
