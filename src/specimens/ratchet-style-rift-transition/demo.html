<div class="rrt" data-rrt>
  <div class="rrt__stage" aria-hidden="true">
    <div class="rrt__panel rrt__panel--a" data-rrt-a>
      <span class="rrt__shape rrt__shape--circle"></span>
      <p>ZONE A</p>
    </div>
    <div class="rrt__rift" data-rrt-rift></div>
    <div class="rrt__panel rrt__panel--b" data-rrt-b hidden>
      <span class="rrt__shape rrt__shape--triangle"></span>
      <p>ZONE B</p>
    </div>
  </div>
  <button type="button" class="rrt__btn" data-rrt-run>OPEN RIFT</button>
  <p class="rrt__status" data-rrt-status aria-live="polite">Zone A active — rift closed</p>
</div>
