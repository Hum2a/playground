<div class="fma1" data-fma1 data-phase="idle">

  <p class="fma1__system">NR // NR-145</p>
  <div class="fma1__stage" data-fma1-stage>
    <div class="fma1__viz" data-fma1-viz aria-hidden="true">
      <span class="fma1__mark fma1__mark--a"></span>
      <span class="fma1__mark fma1__mark--b"></span>
      <span class="fma1__mark fma1__mark--c"></span>

  <div class="fma1__controls">
    <button type="button" class="fma1__btn fma1__btn--primary" data-fma1-run>Focus</button>

  </div>
