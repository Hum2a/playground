<div class="nex" data-notification-expand data-phase="compact">
  <p class="nex__label">NOTIFICATION</p>

  <article class="nex__card" data-nex-card role="button" tabindex="0" aria-expanded="false" aria-label="REVIEW REQUEST — expand for details">
    <span class="nex__marker" aria-hidden="true"></span>
    <div class="nex__header">
      <h3 class="nex__title">REVIEW REQUEST</h3>
      <p class="nex__subtitle">Mina requested approval</p>
    </div>
    <div class="nex__details" data-nex-details aria-hidden="true">
      <p class="nex__row">PR #184</p>
      <p class="nex__row">12 files changed</p>
      <div class="nex__actions">
        <button type="button" class="nex__btn nex__btn--ghost" data-nex-open>OPEN</button>
        <button type="button" class="nex__btn" data-nex-approve>APPROVE</button>
      </div>
    </div>
    <button type="button" class="nex__close" data-nex-close hidden aria-label="Close expanded notification">CLOSE</button>
  </article>

  <p class="nex__status" role="status" aria-live="polite" data-nex-status>Compact notification. Click to expand.</p>
</div>
