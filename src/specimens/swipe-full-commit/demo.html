<div class="sfc" data-swipe-full-commit data-phase="idle">
  <div class="sfc__list" data-sfc-list>
    <div class="sfc__row-wrap" data-sfc-row-wrap>
      <div class="sfc__action" data-sfc-action aria-hidden="true">
        <span class="sfc__action-label">DELETE</span>
        <span class="sfc__commit-marker" data-sfc-commit-marker aria-hidden="true"></span>
      </div>
      <div class="sfc__row" data-sfc-row tabindex="0" role="button" aria-label="CACHE // BUILD-04, swipe left for delete">
        <span class="sfc__row-label">CACHE // BUILD-04</span>
      </div>
    </div>
    <div class="sfc__row sfc__row--neighbour" data-sfc-neighbour>
      <span class="sfc__row-label">LOGS // SESSION</span>
    </div>
  </div>

  <button type="button" class="sfc__undo" data-sfc-undo hidden>UNDO</button>

  <p class="sfc__status" role="status" aria-live="polite" data-sfc-status>
    Swipe CACHE // BUILD-04 left. DELETE readable at 72px; full commit at 190px.
  </p>
</div>
