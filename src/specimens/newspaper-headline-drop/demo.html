<div class="newspaper-drop-demo" data-newspaper-drop-demo>
  <div class="newspaper-drop-demo__host" data-newspaper-drop-host>
    <p class="newspaper-drop-demo__kicker">ARCHIVE SURFACE</p>
    <p class="newspaper-drop-demo__body">Neutral host content. Trigger the interruption when ready.</p>
    <button type="button" class="newspaper-drop-demo__trigger" data-newspaper-drop-trigger>
      BREAK NEWS
    </button>
  </div>

  <div class="newspaper-drop" data-newspaper-drop aria-hidden="true">
    <div class="newspaper-drop__strip" role="alert">
      <p class="newspaper-drop__pub">ARCHIVE DAILY</p>
      <h2 class="newspaper-drop__headline">NEW SPECIMEN DISCOVERED</h2>
      <div class="newspaper-drop__rule" aria-hidden="true"></div>
      <p class="newspaper-drop__meta">ISSUE 07 // 14:32</p>
      <div class="newspaper-drop__scraps" aria-hidden="true">
        <span class="newspaper-drop__scrap newspaper-drop__scrap--1"></span>
        <span class="newspaper-drop__scrap newspaper-drop__scrap--2"></span>
      </div>
      <button type="button" class="newspaper-drop__dismiss" data-newspaper-drop-dismiss>
        Dismiss
      </button>
    </div>
    <div class="newspaper-drop__marks" aria-hidden="true">
      <span class="newspaper-drop__mark newspaper-drop__mark--1"></span>
      <span class="newspaper-drop__mark newspaper-drop__mark--2"></span>
      <span class="newspaper-drop__mark newspaper-drop__mark--3"></span>
    </div>
  </div>
</div>
<button type="button" class="newspaper-drop-replay" data-newspaper-drop-replay>Replay</button>
