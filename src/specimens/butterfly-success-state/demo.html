<div class="butterfly-success" data-butterfly-success data-state="idle">
  <div class="butterfly-success__stage">
    <div class="butterfly-success__host">
      <div class="butterfly-success__butterfly" data-bss-butterfly aria-hidden="true">
        <span class="bss-wing bss-wing--ul" data-bss-wing="ul"></span>
        <span class="bss-wing bss-wing--ur" data-bss-wing="ur"></span>
        <span class="bss-wing bss-wing--ll" data-bss-wing="ll"></span>
        <span class="bss-wing bss-wing--lr" data-bss-wing="lr"></span>
        <span class="bss-body" data-bss-body></span>
      </div>

      <div class="butterfly-success__panel" data-bss-panel>
        <p class="butterfly-success__label" data-bss-label>PROCESSING</p>
        <p class="butterfly-success__meta" data-bss-meta>Record saved.</p>
      </div>
    </div>
  </div>

  <div class="butterfly-success__controls">
    <button type="button" class="butterfly-success__btn" data-bss-complete>
      COMPLETE
    </button>
    <button type="button" class="butterfly-success__btn butterfly-success__btn--ghost" data-bss-reset hidden>
      RESET
    </button>
  </div>

  <p
    class="butterfly-success__status"
    data-bss-status
    role="status"
    aria-live="polite"
  ></p>
</div>
