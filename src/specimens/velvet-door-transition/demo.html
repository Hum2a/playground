<div class="velvet-door-demo" data-velvet-door-demo data-context="a">
  <div class="velvet-door-demo__depth" data-velvet-depth aria-hidden="true">
    <div class="velvet-door-demo__depth-lines" aria-hidden="true">
      <span class="velvet-door-demo__depth-line velvet-door-demo__depth-line--1"></span>
      <span class="velvet-door-demo__depth-line velvet-door-demo__depth-line--2"></span>
      <span class="velvet-door-demo__depth-line velvet-door-demo__depth-line--3"></span>
      <span class="velvet-door-demo__depth-line velvet-door-demo__depth-line--4"></span>
    </div>
    <section class="velvet-door-demo__state velvet-door-demo__state--b" data-state="b">
      <p class="velvet-door-demo__kicker">PRIVATE COMPENDIUM</p>
      <h1 class="velvet-door-demo__title">Fusion records</h1>
      <button type="button" class="velvet-door-demo__btn" data-velvet-return tabindex="-1">
        RETURN
      </button>
    </section>
  </div>

  <div class="velvet-door-demo__surface" data-velvet-surface>
    <section class="velvet-door-demo__state velvet-door-demo__state--a" data-state="a">
      <p class="velvet-door-demo__kicker">PUBLIC ARCHIVE</p>
      <h1 class="velvet-door-demo__title">24 available specimens</h1>
      <button type="button" class="velvet-door-demo__btn" data-velvet-enter>
        ENTER
      </button>
    </section>
  </div>

  <div class="velvet-door" aria-hidden="true" data-velvet-door>
    <div class="velvet-door__panel velvet-door__panel--left"></div>
    <div class="velvet-door__panel velvet-door__panel--right"></div>
    <div class="velvet-door__seam"></div>
    <p class="velvet-door__threshold">ENTERING // COMPENDIUM</p>
    <div class="velvet-door__edge"></div>
  </div>
</div>
