<div class="cfp7" data-cfp7 data-phase="idle">
  <p class="cfp7__live" data-cfp7-live aria-live="polite">Clone Failure Pop. Idle.</p>
  <p class="cfp7__system">NR // NR-054</p>
  <div class="cfp7__stage" data-cfp7-stage>
    <div class="cfp7__viz" data-cfp7-viz aria-hidden="true">
      <span class="cfp7__mark cfp7__mark--a"></span>
      <span class="cfp7__mark cfp7__mark--b"></span>
      <span class="cfp7__mark cfp7__mark--c"></span>
    </div>

    <p class="cfp7__note" data-cfp7-note>One worker collapses while remaining workers continue.</p>

  <div class="cfp7__controls">
    <button type="button" class="cfp7__btn cfp7__btn--primary" data-cfp7-run>Run</button>
    <button type="button" class="cfp7__btn" data-cfp7-replay>Replay</button>
  </div>
</div>
