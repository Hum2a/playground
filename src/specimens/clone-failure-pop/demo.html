<div class="cfp" data-cfp data-phase="idle">
  <p class="cfp__live" data-cfp-live aria-live="polite">
    Idle. Three workers ready to run.
  </p>

  <p class="cfp__system">WORKER // RESILIENCE</p>

  <div class="cfp__stage" data-cfp-stage>
    <ol class="cfp__workers" data-cfp-workers aria-label="Worker clones">
      <li class="cfp__worker" data-cfp-worker="0" aria-label="Worker 1 pending">
        <p class="cfp__worker-label">WORKER 1</p>
        <div class="cfp__bar"><span class="cfp__bar-fill" data-cfp-bar></span></div>
        <p class="cfp__worker-state" data-cfp-worker-state>PENDING</p>
      </li>
      <li class="cfp__worker cfp__worker--fails" data-cfp-worker="1" aria-label="Worker 2 pending">
        <p class="cfp__worker-label">WORKER 2</p>
        <div class="cfp__bar"><span class="cfp__bar-fill" data-cfp-bar></span></div>
        <p class="cfp__worker-state" data-cfp-worker-state>PENDING</p>
      </li>
      <li class="cfp__worker" data-cfp-worker="2" aria-label="Worker 3 pending">
        <p class="cfp__worker-label">WORKER 3</p>
        <div class="cfp__bar"><span class="cfp__bar-fill" data-cfp-bar></span></div>
        <p class="cfp__worker-state" data-cfp-worker-state>PENDING</p>
      </li>
    </ol>

    <p class="cfp__status" data-cfp-status>IDLE</p>
    <p class="cfp__hint" data-cfp-hint>Press Run to start three workers.</p>
  </div>

  <div class="cfp__controls">
    <button type="button" class="cfp__btn cfp__btn--primary" data-cfp-run>Run</button>
    <button type="button" class="cfp__btn" data-cfp-replay>Replay</button>
  </div>
</div>
