<div class="pmb" data-progress-milestone data-state="idle" data-value="54">
  <p class="pmb__eyebrow">UPLOAD · BATCH 07</p>
  <p class="pmb__title">SYNC PROGRESS</p>

  <div class="pmb__stage">
    <div class="pmb__announce" data-pmb-announce aria-hidden="true">
      <span class="pmb__announce-back" aria-hidden="true"></span>
      <span class="pmb__announce-face">
        <span class="pmb__announce-kicker" data-pmb-kicker>MILESTONE</span>
        <span class="pmb__announce-detail" data-pmb-detail>60% COMPLETE</span>
      </span>
    </div>

    <div
      class="pmb__track"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="54"
      aria-valuetext="54% complete"
      data-pmb-bar
    >
      <div class="pmb__fill" data-pmb-fill style="width: 54%"></div>
      <span class="pmb__edge" data-pmb-edge aria-hidden="true"></span>
    </div>

    <div class="pmb__marker" data-pmb-marker aria-hidden="true">
      <span class="pmb__marker-label">60</span>
      <span class="pmb__marker-stack">
        <span class="pmb__marker-back"></span>
        <span class="pmb__marker-face"></span>
        <span class="pmb__marker-upper"></span>
        <span class="pmb__marker-lower"></span>
      </span>
    </div>

    <span class="pmb__tick" data-pmb-tick aria-hidden="true" hidden></span>

    <span class="pmb__tension pmb__tension--1" aria-hidden="true"></span>
    <span class="pmb__tension pmb__tension--2" aria-hidden="true"></span>
    <span class="pmb__tension pmb__tension--3" aria-hidden="true"></span>

    <span class="pmb__frag pmb__frag--1" aria-hidden="true"></span>
    <span class="pmb__frag pmb__frag--2" aria-hidden="true"></span>
    <span class="pmb__frag pmb__frag--3" aria-hidden="true"></span>
  </div>

  <div class="pmb__actions">
    <button type="button" class="pmb__btn pmb__btn--go" data-pmb-go>
      ADD PROGRESS
    </button>
    <button type="button" class="pmb__btn" data-pmb-reset>RESET</button>
  </div>

  <div
    class="pmb__live"
    role="status"
    aria-live="polite"
    data-pmb-live
  ></div>
</div>
