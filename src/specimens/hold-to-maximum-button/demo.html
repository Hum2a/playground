<div class="htm" data-hold-max data-phase="idle" data-fill="0">
  <div class="htm__wrap">
    <svg class="htm__ring" viewBox="0 0 120 120" aria-hidden="true">
      <circle class="htm__ring-track" cx="60" cy="60" r="52" />
      <circle class="htm__ring-fill" data-htm-ring cx="60" cy="60" r="52" />
    </svg>
    <button type="button" class="htm__output" data-htm-btn>OUTPUT</button>
    <p class="htm__pct" data-htm-pct>0%</p>

  <button type="button" class="htm__btn htm__btn--ghost" data-htm-reset hidden>RESET</button>
  <p class="htm__live" role="status" aria-live="polite" data-htm-live>Ready to charge.</p>
</div>
