<div class="ps" data-ps="game-close-return">
  <p class="ps__eyebrow">Game Close Return</p>
  <div class="ps__stage gcr__stage" data-gcr-stage data-phase="playing">
    <div class="ps__grid gcr__grid" data-gcr-grid aria-hidden="true">
      <div class="ps__card"></div>
      <div class="ps__card is-focus" data-gcr-origin></div>
      <div class="ps__card"></div>
    </div>
    <div class="ps__game gcr__game" data-gcr-game aria-hidden="true">
      <span class="gcr__game-label">IN GAME</span>
    </div>
  </div>
  <button type="button" class="ps__btn" data-gcr-close>CLOSE GAME</button>
  <p class="ps__status" data-gcr-status aria-live="polite">Full-screen session active.</p>
</div>
