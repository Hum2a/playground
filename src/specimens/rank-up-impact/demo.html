<div class="rui" data-rank-up>
  <div class="rui__card">
    <p class="rui__label">ARCHIVE RANK</p>
    <div class="rui__rank-idle" data-rank-up-idle>
      <span class="rui__rank-num" data-rank-up-old-display>04</span>
    </div>
    <button type="button" class="rui__trigger" data-rank-up-trigger>
      GAIN RANK
    </button>
  </div>

  <div class="rui__fx" data-rank-up-fx aria-hidden="true" hidden>
    <div class="rui__blackout"></div>

    <div class="rui__rings">
      <span class="rui__ring rui__ring--1"></span>
      <span class="rui__ring rui__ring--2"></span>
      <span class="rui__ring rui__ring--3"></span>
    </div>

    <div class="rui__old">
      <span class="rui__old-half rui__old-half--top">04</span>
      <span class="rui__old-half rui__old-half--bot">04</span>
      <span class="rui__strike"></span>
    </div>

    <div class="rui__new">05</div>

    <div class="rui__strip rui__strip--rankup">
      <span class="rui__strip-back"></span>
      <span class="rui__strip-face">RANK UP</span>
    </div>

    <div class="rui__strip rui__strip--ability">
      <span class="rui__strip-face rui__strip-face--ability">NEW ABILITY</span>
    </div>
    <div class="rui__ability-detail">Advanced Filters</div>
  </div>

  <div class="rui__result" data-rank-up-result hidden>
    <p class="rui__result-rank">RANK 05</p>
    <p class="rui__result-ability">Advanced Filters unlocked</p>
  </div>

  <div
    class="rui__status"
    role="status"
    aria-live="polite"
    data-rank-up-status
  ></div>
</div>
