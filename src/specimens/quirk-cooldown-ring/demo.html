<div class="qcr" data-qcr data-phase="idle">
  <p class="qcr__live" data-qcr-live aria-live="polite">Cooldown ready.</p>

  <div class="qcr__stage" data-qcr-stage>
    <svg class="qcr__svg" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <circle class="qcr__track" cx="60" cy="60" r="46" fill="none" />
      <circle class="qcr__ring" data-qcr-ring cx="60" cy="60" r="46" fill="none" />
    </svg>

    <div class="qcr__readout" data-qcr-readout>
      <p class="qcr__label" data-qcr-label>READY</p>
      <p class="qcr__pct" data-qcr-pct>100%</p>
    </div>
  </div>

  <div class="qcr__controls">
    <button type="button" class="qcr__btn qcr__btn--primary" data-qcr-run>Run</button>
    <button type="button" class="qcr__btn" data-qcr-replay>Replay</button>
  </div>
</div>
