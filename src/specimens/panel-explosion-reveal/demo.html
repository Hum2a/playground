<div class="panel-burst-demo" data-panel-burst-demo>
  <section class="panel-burst-demo__host" data-panel-burst-host>
    <p class="panel-burst-demo__kicker">SPECIMEN FOUND</p>
    <h1 class="panel-burst-demo__title">Graphic Burst Hover</h1>
    <button type="button" class="panel-burst-demo__cta" data-panel-burst-cta>
      VIEW ARTIFACT
    </button>
  </section>

  <div class="panel-burst" data-panel-burst aria-hidden="true">
    <div class="panel-burst__panel panel-burst__panel--1" data-panel="1">
      <span class="panel-burst__backing" aria-hidden="true"></span>
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--2" data-panel="2">
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--3" data-panel="3">
      <span class="panel-burst__backing" aria-hidden="true"></span>
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--4" data-panel="4">
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--5" data-panel="5">
      <span class="panel-burst__backing" aria-hidden="true"></span>
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--6" data-panel="6">
      <span class="panel-burst__face"></span>
    </div>
    <div class="panel-burst__panel panel-burst__panel--7" data-panel="7">
      <span class="panel-burst__face"></span>
    </div>

    <div class="panel-burst__cracks" aria-hidden="true">
      <span class="panel-burst__crack panel-burst__crack--1"></span>
      <span class="panel-burst__crack panel-burst__crack--2"></span>
      <span class="panel-burst__crack panel-burst__crack--3"></span>
      <span class="panel-burst__crack panel-burst__crack--4"></span>
      <span class="panel-burst__crack panel-burst__crack--5"></span>
      <span class="panel-burst__crack panel-burst__crack--6"></span>
    </div>

    <div class="panel-burst__impact" aria-hidden="true">
      <span class="panel-burst__impact-core"></span>
      <span class="panel-burst__stroke panel-burst__stroke--1"></span>
      <span class="panel-burst__stroke panel-burst__stroke--2"></span>
      <span class="panel-burst__stroke panel-burst__stroke--3"></span>
      <span class="panel-burst__stroke panel-burst__stroke--4"></span>
    </div>
  </div>

  <button type="button" class="panel-burst-demo__trigger" data-panel-burst-trigger>
    BREAK SEAL
  </button>
</div>
