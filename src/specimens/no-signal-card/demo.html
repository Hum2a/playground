<div class="nsc" data-nsc data-state="unavailable">

  <article class="nsc__card" data-nsc-card>
    <div class="nsc__bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="nsc__body">
      <span class="nsc__icon" aria-hidden="true">▲</span>
      <h2 class="nsc__title">NO SIGNAL</h2>
      <p class="nsc__copy">Broadcast feed unavailable for this slot.</p>
    </div>
    <div class="nsc__static" aria-hidden="true"></div>
  </article>

  <button type="button" class="nsc__btn" data-nsc-toggle>Toggle availability</button>
</div>
