<div class="sbr" data-surface-break data-state="idle">
  <div class="sbr__toolbar">
    <button type="button" class="sbr__btn" data-sbr-surface>SURFACE</button>
  </div>

  <p class="sbr__status" role="status" aria-live="polite" data-sbr-status>
    Unknown record submerged.
  </p>

  <div class="sbr__host" data-sbr-host>
    <div class="sbr__water" aria-hidden="true" data-sbr-water>
      <div class="sbr__mass">
        <span class="sbr__seg sbr__seg--1"></span>
        <span class="sbr__seg sbr__seg--2"></span>
        <span class="sbr__seg sbr__seg--3"></span>
        <span class="sbr__seg sbr__seg--4"></span>
        <span class="sbr__seg sbr__seg--5"></span>
        <span class="sbr__body"></span>
      </div>
      <div class="sbr__ripples" data-sbr-ripples>
        <span class="sbr__ripple sbr__ripple--1"></span>
        <span class="sbr__ripple sbr__ripple--2"></span>
        <span class="sbr__ripple sbr__ripple--3"></span>
      </div>
    </div>

    <div class="sbr__stage" data-sbr-stage aria-hidden="true">
      <div class="sbr__clear">
        <div class="sbr__copy sbr__copy--unknown" data-sbr-unknown>
          <p class="sbr__kicker">DEPTH // ??</p>
          <p class="sbr__title">UNKNOWN RECORD</p>
        </div>
        <div class="sbr__copy sbr__copy--final" data-sbr-final>
          <p class="sbr__kicker">RECORD // 045</p>
          <p class="sbr__title">RECOVERED</p>
        </div>
      </div>

      <div class="sbr__sub">
        <div class="sbr__ghost sbr__ghost--neg" data-sbr-ghost>
          <p class="sbr__kicker">DEPTH // ??</p>
          <p class="sbr__title">UNKNOWN RECORD</p>
        </div>
        <div class="sbr__ghost sbr__ghost--pos" data-sbr-ghost>
          <p class="sbr__kicker">DEPTH // ??</p>
          <p class="sbr__title">UNKNOWN RECORD</p>
        </div>
        <div class="sbr__sub-main" data-sbr-sub-main>
          <div class="sbr__copy sbr__copy--unknown">
            <p class="sbr__kicker">DEPTH // ??</p>
            <p class="sbr__title">UNKNOWN RECORD</p>
          </div>
          <div class="sbr__copy sbr__copy--final">
            <p class="sbr__kicker">RECORD // 045</p>
            <p class="sbr__title">RECOVERED</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
