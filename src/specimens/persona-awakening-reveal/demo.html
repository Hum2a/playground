<div class="par" data-persona-awakening data-phase="idle">
  <div class="par__stage" data-par-stage>
    <div class="par__identity" data-par-identity>
      <p class="par__eyebrow">IDENTITY</p>
      <h2 class="par__title" data-par-title>UNKNOWN</h2>
      <p class="par__sig" data-par-sig>SIGNATURE // ???</p>
    </div>

    <div class="par__shell" data-par-shell aria-hidden="true">
      <span class="par__panel par__panel--1"></span>
      <span class="par__panel par__panel--2"></span>
      <span class="par__panel par__panel--3"></span>
      <span class="par__panel par__panel--4"></span>
      <span class="par__panel par__panel--5"></span>

      <span class="par__seam par__seam--1"></span>
      <span class="par__seam par__seam--2"></span>
      <span class="par__seam par__seam--3"></span>

      <span class="par__fracture par__fracture--1"></span>
      <span class="par__fracture par__fracture--2"></span>
      <span class="par__fracture par__fracture--3"></span>
      <span class="par__fracture par__fracture--4"></span>

      <span class="par__breach" aria-hidden="true"></span>

      <span class="par__streak par__streak--1"></span>
      <span class="par__streak par__streak--2"></span>
      <span class="par__streak par__streak--3"></span>
      <span class="par__streak par__streak--4"></span>
      <span class="par__streak par__streak--5"></span>
    </div>

    <div class="par__frame" data-par-frame aria-hidden="true">
      <span class="par__frame-seg par__frame-seg--t"></span>
      <span class="par__frame-seg par__frame-seg--r"></span>
      <span class="par__frame-seg par__frame-seg--b"></span>
      <span class="par__frame-seg par__frame-seg--l"></span>
    </div>
  </div>

  <div class="par__controls">
    <button type="button" class="par__awaken" data-par-awaken>AWAKEN</button>
    <button type="button" class="par__reset" data-par-reset>RESET</button>
  </div>

  <p class="par__status" role="status" aria-live="polite" data-par-status>
    Identity unknown.
  </p>
</div>
