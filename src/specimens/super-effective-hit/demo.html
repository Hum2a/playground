<div class="super-effective" data-super-effective data-state="idle">
  <div class="super-effective__stage">
    <span class="super-effective__token" data-seh-token aria-hidden="true"></span>

    <article class="super-effective__card" data-seh-card>
      <span class="super-effective__wedges" data-seh-wedges aria-hidden="true">
        <span class="seh-wedge seh-wedge--1"></span>
        <span class="seh-wedge seh-wedge--2"></span>
        <span class="seh-wedge seh-wedge--3"></span>
        <span class="seh-wedge seh-wedge--4"></span>
        <span class="seh-wedge seh-wedge--5"></span>
        <span class="seh-wedge seh-wedge--6"></span>
      </span>
      <span class="super-effective__slash" data-seh-slash aria-hidden="true"></span>

      <p class="super-effective__title">CACHE STRATEGY</p>
      <p class="super-effective__match" data-seh-match>
        <span class="super-effective__match-clip" data-seh-match-clip>
          <span class="super-effective__match-word" data-seh-word-idle>MATCH // UNKNOWN</span>
          <span
            class="super-effective__match-word super-effective__match-word--done"
            data-seh-word-done
            aria-hidden="true"
          >MATCH // OPTIMAL</span>
        </span>
      </p>
      <p class="super-effective__eff" data-seh-eff aria-hidden="true">HIGH EFFECTIVENESS</p>
    </article>
  </div>

  <p
    class="super-effective__status"
    data-seh-status
    role="status"
    aria-live="polite"
  ></p>

  <div class="super-effective__controls">
    <button type="button" class="super-effective__btn" data-seh-apply>APPLY</button>
    <button type="button" class="super-effective__btn super-effective__btn--ghost" data-seh-reset hidden>
      RESET
    </button>
  </div>
</div>
