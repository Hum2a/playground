<div class="prs0" data-prs0 data-phase="idle">
  <p class="prs0__live" data-prs0-live aria-live="polite">Presence Radar Sweep. Idle.</p>
  <p class="prs0__system">NR // NR-166</p>
  <div class="prs0__stage" data-prs0-stage>
    <div class="prs0__viz" data-prs0-viz aria-hidden="true">
      <span class="prs0__mark prs0__mark--a"></span>
      <span class="prs0__mark prs0__mark--b"></span>
      <span class="prs0__mark prs0__mark--c"></span>
    </div>
    <p class="prs0__status" data-prs0-status>IDLE</p>
    <p class="prs0__note" data-prs0-note>A radar sweep detects presence blips on a field.</p>
  </div>
  <div class="prs0__controls">
    <button type="button" class="prs0__btn prs0__btn--primary" data-prs0-run>Sweep</button>
    <button type="button" class="prs0__btn" data-prs0-replay>Replay</button>
  </div>
</div>
