<div class="psc" data-psc>
  <div class="psc__grid" data-psc-grid aria-hidden="true">
    <div class="psc__slot" data-psc-slot="0"></div>
    <div class="psc__slot" data-psc-slot="1"></div>
    <div class="psc__slot" data-psc-slot="2"></div>
    <div class="psc__slot" data-psc-slot="3"></div>
    <div class="psc__slot psc__slot--final" data-psc-slot="4"></div>
  </div>
  <div class="psc__platinum" data-psc-platinum hidden aria-hidden="true">
    <span class="psc__shape psc__shape--circle"></span>
    <span class="psc__shape psc__shape--cross"></span>
    <span class="psc__shape psc__shape--square"></span>
    <span class="psc__shape psc__shape--triangle"></span>
    <p class="psc__platinum-label">MASTER COMPLETE</p>
  </div>
  <button type="button" class="psc__btn" data-psc-unlock>UNLOCK FINAL</button>
  <p class="psc__status" data-psc-status aria-live="polite">4 of 5 earned — one remaining</p>
</div>
