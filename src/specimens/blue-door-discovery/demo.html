<div class="bdd" data-blue-door-discovery data-state="idle">
  <div class="bdd__host">
    <div
      class="bdd__secret"
      data-bdd-secret
      aria-hidden="true"
    >
      <div class="bdd__depth" aria-hidden="true">
        <span class="bdd__depth-line bdd__depth-line--1"></span>
        <span class="bdd__depth-line bdd__depth-line--2"></span>
        <span class="bdd__depth-line bdd__depth-line--3"></span>
      </div>
      <p class="bdd__secret-kicker">UNLISTED</p>
      <h2 class="bdd__secret-title">SPECIMEN // ???</h2>
      <p class="bdd__secret-body">An undocumented artifact.</p>
      <div class="bdd__secret-actions">
        <button type="button" class="bdd__btn bdd__btn--enter" data-bdd-enter tabindex="-1">
          ENTER
        </button>
        <button type="button" class="bdd__btn bdd__btn--close" data-bdd-close tabindex="-1">
          CLOSE
        </button>
      </div>
    </div>

    <div class="bdd__surface" data-bdd-surface>
      <div class="bdd__face" data-bdd-face>
        <div class="bdd__face-shift bdd__face-shift--left" data-bdd-shift-left>
          <p class="bdd__kicker">ARCHIVE STORAGE</p>
          <h1 class="bdd__title">NO ADDITIONAL RECORDS</h1>
        </div>
        <div class="bdd__face-shift bdd__face-shift--right" data-bdd-shift-right>
          <p class="bdd__meta">42 indexed specimens</p>
          <button type="button" class="bdd__btn bdd__btn--inspect" data-bdd-inspect>
            INSPECT
          </button>
        </div>
      </div>

      <div class="bdd__fx" aria-hidden="true">
        <span class="bdd__clue" data-bdd-clue></span>
        <span class="bdd__seam" data-bdd-seam></span>
        <span class="bdd__seam-side bdd__seam-side--l"></span>
        <span class="bdd__seam-side bdd__seam-side--r"></span>
        <div class="bdd__doorway">
          <div class="bdd__door bdd__door--left" data-bdd-door-left></div>
          <div class="bdd__door bdd__door--right" data-bdd-door-right></div>
        </div>
        <p class="bdd__discovered" data-bdd-discovered>DISCOVERED</p>
      </div>
    </div>
  </div>

  <div
    class="bdd__status"
    role="status"
    aria-live="polite"
    data-bdd-status
  ></div>
</div>
