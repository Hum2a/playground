<div class="mbd2" data-mbd2 data-phase="idle">
  <p class="mbd2__live" data-mbd2-live aria-live="polite">Mission Board Dispatch. Idle.</p>
  <p class="mbd2__system">NR // NR-226</p>
  <div class="mbd2__stage" data-mbd2-stage>
    <div class="mbd2__viz" data-mbd2-viz aria-hidden="true">
      <span class="mbd2__mark mbd2__mark--a"></span>
      <span class="mbd2__mark mbd2__mark--b"></span>
      <span class="mbd2__mark mbd2__mark--c"></span>
    </div>
    <p class="mbd2__status" data-mbd2-status>IDLE</p>
    <p class="mbd2__note" data-mbd2-note>A mission card dispatches from the board to an assignee.</p>
  </div>
  <div class="mbd2__controls">
    <button type="button" class="mbd2__btn mbd2__btn--primary" data-mbd2-run>Dispatch</button>
    <button type="button" class="mbd2__btn" data-mbd2-replay>Replay</button>
  </div>
</div>
