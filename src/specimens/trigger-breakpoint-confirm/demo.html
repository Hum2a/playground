<div class="tbc" data-tbc data-phase="idle">
  <p class="tbc__live" data-tbc-live aria-live="polite">Trigger breakpoint idle.</p>
  <p class="tbc__system">DUALSENSE // BREAKPOINT</p>
  <div class="tbc__stage">
    <button type="button" class="tbc__bar" data-tbc-bar aria-label="Hold past breakpoint">
      <span class="tbc__notch" aria-hidden="true"></span>
      <span class="tbc__notch-glow" aria-hidden="true"></span>
      <span class="tbc__fill" data-tbc-fill aria-hidden="true"></span>
    </button>
    <p class="tbc__status" data-tbc-status>IDLE</p>
    <p class="tbc__hint" data-tbc-hint>Hold past notch to confirm.</p>
  </div>
  <div class="tbc__controls">
    <button type="button" class="tbc__btn tbc__btn--primary" data-tbc-run>Run</button>
    <button type="button" class="tbc__btn" data-tbc-replay>Replay</button>
  </div>
</div>
