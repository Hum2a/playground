<div class="sfa" data-search-field-activation data-phase="compact">
  <header class="sfa__header" data-sfa-header>
    <h2 class="sfa__title" data-sfa-title>LIBRARY</h2>
    <div class="sfa__search-wrap">
      <button type="button" class="sfa__search-compact" data-sfa-trigger aria-label="Activate search">
        <span class="sfa__search-icon" aria-hidden="true"></span>
      </button>
      <div class="sfa__search-expanded" data-sfa-expanded hidden>
        <span class="sfa__search-icon sfa__search-icon--input" aria-hidden="true"></span>
        <input
          type="search"
          class="sfa__input"
          data-sfa-input
          placeholder="Search library"
          aria-label="Search library"
        />
      </div>
    </div>
    <button type="button" class="sfa__add" data-sfa-add>ADD</button>
    <button type="button" class="sfa__cancel" data-sfa-cancel hidden>CANCEL</button>
  </header>

  <p class="sfa__status" role="status" aria-live="polite" data-sfa-status>Compact header. Activate search.</p>
</div>
