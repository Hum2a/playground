<div class="qab" data-qab data-phase="idle">
  <p class="qab__live" data-qab-live aria-live="polite">Ability standby.</p>

  <div class="qab__stage" data-qab-stage>
    <div class="qab__burst" aria-hidden="true">
      <span class="qab__ray" style="--i: 0"></span>
      <span class="qab__ray" style="--i: 1"></span>
      <span class="qab__ray" style="--i: 2"></span>
      <span class="qab__ray" style="--i: 3"></span>
      <span class="qab__ray" style="--i: 4"></span>
      <span class="qab__ray" style="--i: 5"></span>
      <span class="qab__ray" style="--i: 6"></span>
      <span class="qab__ray" style="--i: 7"></span>
    </div>

    <div class="qab__core" data-qab-core>
      <p class="qab__label" data-qab-label>STANDBY</p>
      <p class="qab__sublabel" data-qab-sublabel>Awaiting activation</p>
    </div>
  </div>

  <div class="qab__controls">
    <button type="button" class="qab__btn qab__btn--primary" data-qab-activate>Activate</button>
    <button type="button" class="qab__btn" data-qab-replay>Replay</button>
  </div>
</div>
