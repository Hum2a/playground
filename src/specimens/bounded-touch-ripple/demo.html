<div class="btr" data-bounded-touch-ripple>
  <button type="button" class="btr__btn" data-btr-target>
    Primary action
  </button>

  <div class="btr__row" data-btr-target role="button" tabindex="0">
    <span class="btr__row-title">List item</span>
    <span class="btr__row-sub">Secondary detail</span>
  </div>

  <button type="button" class="btr__chip" data-btr-target>
    Filter
  </button>

  <p class="btr__status" role="status" aria-live="polite" data-btr-status>
    Tap or press Enter on any control.
  </p>
</div>
