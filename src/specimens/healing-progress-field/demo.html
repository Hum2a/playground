<div class="hpf2" data-hpf2 data-phase="idle">
  <p class="hpf2__live" data-hpf2-live aria-live="polite">Healing Progress Field. Idle.</p>
  <p class="hpf2__system">NR // NR-184</p>
  <div class="hpf2__stage" data-hpf2-stage>
    <div class="hpf2__viz" data-hpf2-viz aria-hidden="true">
      <span class="hpf2__mark hpf2__mark--a"></span>
      <span class="hpf2__mark hpf2__mark--b"></span>
      <span class="hpf2__mark hpf2__mark--c"></span>
    </div>

    <p class="hpf2__note" data-hpf2-note>A damaged region reconstructs from the centre outward.</p>

  <div class="hpf2__controls">
    <button type="button" class="hpf2__btn hpf2__btn--primary" data-hpf2-run>Heal</button>
    <button type="button" class="hpf2__btn" data-hpf2-replay>Replay</button>
  </div>
</div>
