<div class="dtm" data-drop-target-magnetism data-phase="idle">
  <div class="dtm__stage" data-dtm-stage>
    <div class="dtm__source" data-dtm-source>
      <div class="dtm__file" data-dtm-file tabindex="0" role="button" aria-label="Draggable file FILE // 07">
        <span class="dtm__file-glyph" aria-hidden="true"></span>
        <span class="dtm__file-label">FILE // 07</span>
      </div>
    </div>

    <div class="dtm__targets">
      <div class="dtm__target dtm__target--archive" data-dtm-archive aria-label="Archive valid target">
        <span class="dtm__target-label">ARCHIVE</span>
        <span class="dtm__tick dtm__tick--tl" aria-hidden="true"></span>
        <span class="dtm__tick dtm__tick--tr" aria-hidden="true"></span>
        <span class="dtm__tick dtm__tick--bl" aria-hidden="true"></span>
        <span class="dtm__tick dtm__tick--br" aria-hidden="true"></span>
      </div>
      <div class="dtm__target dtm__target--locked" data-dtm-locked aria-label="Locked invalid target">
        <span class="dtm__target-label">LOCKED</span>
      </div>
    </div>
  </div>

  <div class="dtm__proxy" data-dtm-proxy hidden aria-hidden="true">
    <span>FILE // 07</span>
  </div>

  <p class="dtm__status" role="status" aria-live="polite" data-dtm-status>
    Drag FILE // 07. ARCHIVE attracts within 86px; LOCKED never pulls.
  </p>
</div>
