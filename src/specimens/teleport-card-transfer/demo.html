<div class="tct2" data-tct2 data-phase="idle">
  <p class="tct2__live" data-tct2-live aria-live="polite">Teleport Card Transfer. Idle.</p>
  <p class="tct2__system">NR // NR-334</p>
  <div class="tct2__stage" data-tct2-stage>
    <div class="tct2__viz" data-tct2-viz aria-hidden="true">
      <span class="tct2__mark tct2__mark--a"></span>
      <span class="tct2__mark tct2__mark--b"></span>
      <span class="tct2__mark tct2__mark--c"></span>
    </div>
    <p class="tct2__status" data-tct2-status>IDLE</p>
    <p class="tct2__note" data-tct2-note>A card teleports from source slot to destination.</p>
  </div>
  <div class="tct2__controls">
    <button type="button" class="tct2__btn tct2__btn--primary" data-tct2-run>Transfer</button>
    <button type="button" class="tct2__btn" data-tct2-replay>Replay</button>
  </div>
</div>
