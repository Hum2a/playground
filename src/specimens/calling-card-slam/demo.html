<div class="calling-card" data-calling-card>
  <div class="calling-card__backing" aria-hidden="true"></div>
  <div class="calling-card__paper">
    <p class="calling-card__eyebrow">NOTICE</p>
    <p class="calling-card__message">NEW MATERIAL</p>
    <p class="calling-card__microtype">TAKE NOTICE · TAKE NOTICE · TAKE NOTICE</p>
  </div>
  <div class="calling-card__impact" aria-hidden="true">
    <span class="calling-card__shard calling-card__shard--1"></span>
    <span class="calling-card__shard calling-card__shard--2"></span>
    <span class="calling-card__shard calling-card__shard--3"></span>
    <span class="calling-card__shard calling-card__shard--4"></span>
    <span class="calling-card__shard calling-card__shard--5"></span>
  </div>
</div>
<button type="button" class="calling-card-replay" data-calling-card-replay>Replay</button>
