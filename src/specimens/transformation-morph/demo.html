<div class="trm" data-trm data-phase="idle">
  <p class="trm__live" data-trm-live aria-live="polite">
    Idle. Profile A active.
  </p>

  <p class="trm__system">PROFILE // MORPH</p>

  <div class="trm__stage" data-trm-stage>
    <article class="trm__card trm__card--a" data-trm-card-a aria-hidden="true">
      <p class="trm__kicker">PROFILE A</p>
      <p class="trm__title">Scout</p>
      <p class="trm__meta">RANK · GENIN</p>
    </article>

    <div class="trm__silhouette" data-trm-silhouette aria-hidden="true"></div>

    <article class="trm__card trm__card--b" data-trm-card-b aria-hidden="true">
      <p class="trm__kicker">PROFILE B</p>
      <p class="trm__title">Sentinel</p>
      <p class="trm__meta">RANK · CHUNIN</p>
    </article>

    <p class="trm__status" data-trm-status>PROFILE A</p>
    <p class="trm__hint" data-trm-hint>Press Run to transform.</p>
  </div>

  <div class="trm__controls">
    <button type="button" class="trm__btn trm__btn--primary" data-trm-run>Run</button>
    <button type="button" class="trm__btn" data-trm-replay>Replay</button>
  </div>
</div>
