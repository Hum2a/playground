      <article class="nse__card" data-nse-card="0">
        <h3>Build complete</h3>
        <p>Release 2.4.0 passed checks.</p>
      </article>
      <article class="nse__card" data-nse-card="1">
        <h3>Review requested</h3>
        <p>PR #184 needs approval.</p>
      </article>
      <article class="nse__card" data-nse-card="2">
        <h3>Deploy ready</h3>
        <p>Staging is ready to ship.</p>
      </article>
      <article class="nse__card" data-nse-card="3">
        <h3>Sync finished</h3>
        <p>Cloud backup completed.</p>
      </article>
    </div>
  </button>
  <p class="nse__status" role="status" aria-live="polite" data-nse-status>Four notifications stacked — click to expand.</p>
</div>
