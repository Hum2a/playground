<div class="scc" data-scc data-phase="compact">
  <p class="scc__live" data-scc-live aria-live="polite">Save conflict compact.</p>
  <p class="scc__system">SAVE // CONFLICT COMPARE</p>
  <div class="scc__stage">
    <div class="scc__row">
      <article class="scc__save" data-scc-save data-side="local">
        <p class="scc__save-title">Local Save</p>
        <div class="scc__meta">
          <span>Time: 18:42</span>
          <span>Progress: 67%</span>
        </div>
      </article>
      <article class="scc__save" data-scc-save data-side="cloud">
        <p class="scc__save-title">Cloud Save</p>
        <div class="scc__meta">
          <span>Time: 19:15</span>
          <span class="scc__diff">Progress: 72%</span>
        </div>
      </article>
    </div>
    <p class="scc__status" data-scc-status>CONFLICT</p>
    <p class="scc__hint" data-scc-hint>Press Run to compare.</p>
  </div>
  <div class="scc__controls">
    <button type="button" class="scc__btn scc__btn--primary" data-scc-run>Run</button>
    <button type="button" class="scc__btn" data-scc-replay>Replay</button>
  </div>
</div>
