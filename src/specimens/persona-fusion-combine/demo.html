<div class="pfc" data-pfc data-phase="idle">
  <p class="pfc__live" data-pfc-live aria-live="polite">Select personas to fuse.</p>

  <div class="pfc__stage" data-pfc-stage>
    <div class="pfc__field" data-pfc-field aria-hidden="true"></div>

    <div class="pfc__card pfc__card--a" data-pfc-card="a">
      <span class="pfc__card-id">A</span>
      <span class="pfc__card-name">SIGMA</span>
    </div>
    <div class="pfc__card pfc__card--b" data-pfc-card="b">
      <span class="pfc__card-id">B</span>
      <span class="pfc__card-name">DELTA</span>
    </div>

    <div class="pfc__result" data-pfc-result aria-hidden="true">
      <span class="pfc__card-id">Ω</span>
      <span class="pfc__card-name">SYNTH</span>
    </div>
  </div>

  <div class="pfc__controls">
    <button type="button" class="pfc__btn pfc__btn--primary" data-pfc-run>Combine</button>
    <button type="button" class="pfc__btn" data-pfc-reset>Reset</button>
  </div>
</div>
