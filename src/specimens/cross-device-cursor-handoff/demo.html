<div class="cdc" data-cross-device-cursor-handoff data-phase="idle">
  <div class="cdc__stage" data-cdc-stage>
    <div class="cdc__display" data-cdc-left>
      <span class="cdc__label">DISPLAY A</span>
      <span class="cdc__tick" data-cdc-tick-left aria-hidden="true"></span>
    </div>
    <div class="cdc__gap" aria-hidden="true"></div>
    <div class="cdc__display" data-cdc-right>
      <span class="cdc__label">DISPLAY B</span>
      <span class="cdc__tick" data-cdc-tick-right aria-hidden="true"></span>
    </div>
    <div class="cdc__pointer" data-cdc-pointer aria-hidden="true"></div>
  </div>

  <button type="button" class="cdc__demo" data-cdc-demo>DEMO</button>

  <p class="cdc__status" role="status" aria-live="polite" data-cdc-status>
    Pointer in left display. Run DEMO to hand off across the 36px gap.
  </p>
</div>
