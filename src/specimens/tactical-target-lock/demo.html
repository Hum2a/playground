<div class="ttl" data-tactical-lock data-selected="">
  <div
    class="ttl__rail"
    role="radiogroup"
    aria-label="Tactical targets"
    data-ttl-rail
  >
    <button
      type="button"
      class="ttl__card"
      role="radio"
      aria-checked="false"
      tabindex="0"
      data-ttl-target
      data-index="0"
      data-name="Alpha"
    >
      <span class="ttl__face" aria-hidden="true">
        <span class="ttl__plate"></span>
        <span class="ttl__label">ALPHA</span>
      </span>
      <span class="ttl__lock" aria-hidden="true">
        <span class="ttl__bracket ttl__bracket--tl"></span>
        <span class="ttl__bracket ttl__bracket--tr"></span>
        <span class="ttl__bracket ttl__bracket--bl"></span>
        <span class="ttl__bracket ttl__bracket--br"></span>
        <span class="ttl__guides">
          <span class="ttl__guide ttl__guide--n"></span>
          <span class="ttl__guide ttl__guide--e"></span>
          <span class="ttl__guide ttl__guide--s"></span>
          <span class="ttl__guide ttl__guide--w"></span>
        </span>
        <span class="ttl__badge">LOCKED</span>
      </span>
    </button>

    <button
      type="button"
      class="ttl__card"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-ttl-target
      data-index="1"
      data-name="Beta"
    >
      <span class="ttl__face" aria-hidden="true">
        <span class="ttl__plate"></span>
        <span class="ttl__label">BETA</span>
      </span>
      <span class="ttl__lock" aria-hidden="true">
        <span class="ttl__bracket ttl__bracket--tl"></span>
        <span class="ttl__bracket ttl__bracket--tr"></span>
        <span class="ttl__bracket ttl__bracket--bl"></span>
        <span class="ttl__bracket ttl__bracket--br"></span>
        <span class="ttl__guides">
          <span class="ttl__guide ttl__guide--n"></span>
          <span class="ttl__guide ttl__guide--e"></span>
          <span class="ttl__guide ttl__guide--s"></span>
          <span class="ttl__guide ttl__guide--w"></span>
        </span>
        <span class="ttl__badge">LOCKED</span>
      </span>
    </button>

    <button
      type="button"
      class="ttl__card"
      role="radio"
      aria-checked="false"
      tabindex="-1"
      data-ttl-target
      data-index="2"
      data-name="Gamma"
    >
      <span class="ttl__face" aria-hidden="true">
        <span class="ttl__plate"></span>
        <span class="ttl__label">GAMMA</span>
      </span>
      <span class="ttl__lock" aria-hidden="true">
        <span class="ttl__bracket ttl__bracket--tl"></span>
        <span class="ttl__bracket ttl__bracket--tr"></span>
        <span class="ttl__bracket ttl__bracket--bl"></span>
        <span class="ttl__bracket ttl__bracket--br"></span>
        <span class="ttl__guides">
          <span class="ttl__guide ttl__guide--n"></span>
          <span class="ttl__guide ttl__guide--e"></span>
          <span class="ttl__guide ttl__guide--s"></span>
          <span class="ttl__guide ttl__guide--w"></span>
        </span>
        <span class="ttl__badge">LOCKED</span>
      </span>
    </button>
  </div>

  <button type="button" class="ttl__clear" data-ttl-clear disabled>
    CLEAR TARGET
  </button>

  <p class="ttl__status" role="status" aria-live="polite" data-ttl-status>
    No target selected.
  </p>
</div>
