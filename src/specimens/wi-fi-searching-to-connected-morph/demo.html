<div class="wscm" data-wi-fi-searching-to-connected-morph data-phase="disconnected">
  <div class="wscm__card">
    <div class="wscm__signal" aria-hidden="true">
      <span class="wscm__arc wscm__arc--3" data-wscm-arc="3"></span>
      <span class="wscm__arc wscm__arc--2" data-wscm-arc="2"></span>
      <span class="wscm__arc wscm__arc--1" data-wscm-arc="1"></span>
      <span class="wscm__dot" data-wscm-dot></span>
    </div>
    <p class="wscm__label" data-wscm-label>Disconnected</p>
    <div class="wscm__actions">
      <button type="button" class="wscm__btn wscm__btn--primary" data-wscm-connect>Connect</button>
      <button type="button" class="wscm__btn" data-wscm-fail hidden>Simulate fail</button>
      <button type="button" class="wscm__btn" data-wscm-retry hidden>Try again</button>
    </div>
  </div>
  <p class="wscm__status" role="status" aria-live="polite" data-wscm-status>Tap Connect to search for network.</p>
</div>
