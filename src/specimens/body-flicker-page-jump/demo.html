<div class="bfpj2" data-bfpj2 data-phase="idle">
  <p class="bfpj2__live" data-bfpj2-live aria-live="polite">Body Flicker Page Jump. Idle.</p>
  <p class="bfpj2__system">NR // NR-066</p>
  <div class="bfpj2__stage" data-bfpj2-stage>
    <div class="bfpj2__viz" data-bfpj2-viz aria-hidden="true">
      <span class="bfpj2__mark bfpj2__mark--a"></span>
      <span class="bfpj2__mark bfpj2__mark--b"></span>
      <span class="bfpj2__mark bfpj2__mark--c"></span>
    </div>
    <p class="bfpj2__status" data-bfpj2-status>IDLE</p>
    <p class="bfpj2__note" data-bfpj2-note>Page content streaks away and resolves as a new view.</p>
  </div>
  <div class="bfpj2__controls">
    <button type="button" class="bfpj2__btn bfpj2__btn--primary" data-bfpj2-run>Jump</button>
    <button type="button" class="bfpj2__btn" data-bfpj2-replay>Replay</button>
  </div>
</div>
