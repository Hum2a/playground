<div class="wmf" data-window-minimise-funnel data-phase="open">
  <p class="wmf__label">MINIMISE FUNNEL</p>

  <div class="wmf__stage" data-wmf-stage>
    <div class="wmf__window" data-wmf-window aria-label="TERMINAL window">
      <div class="wmf__window-top" data-wmf-top>
        <span class="wmf__traffic" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="wmf__title">TERMINAL</span>
      </div>
      <div class="wmf__window-body" data-wmf-body aria-hidden="true">
        <span class="wmf__line"></span>
        <span class="wmf__line"></span>
        <span class="wmf__line wmf__line--short"></span>
      </div>
    </div>

    <div class="wmf__rail" aria-hidden="true">
      <div class="wmf__token" data-wmf-token>
        <span class="wmf__token-label">TERMINAL</span>
      </div>
    </div>
  </div>

  <div class="wmf__controls">
    <button type="button" class="wmf__btn" data-wmf-minimise>MINIMISE</button>
    <button type="button" class="wmf__btn wmf__btn--ghost" data-wmf-restore hidden>RESTORE</button>
  </div>

  <p class="wmf__status" role="status" aria-live="polite" data-wmf-status>TERMINAL window open.</p>
</div>
