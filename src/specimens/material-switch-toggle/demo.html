<div class="mst" data-material-switch-toggle>
  <div class="mst__row">
    <label class="mst__switch" data-mst-switch>
      <input class="mst__input" type="checkbox" data-mst-input />
      <span class="mst__track" aria-hidden="true">
        <span class="mst__thumb">
          <span class="mst__check" aria-hidden="true"></span>
        </span>
        <span class="mst__ripple" data-mst-ripple aria-hidden="true"></span>
      </span>
      <span class="mst__label">Notifications</span>
    </label>
  </div>

  <div class="mst__row">
    <label class="mst__switch mst__switch--on" data-mst-switch>
      <input class="mst__input" type="checkbox" checked data-mst-input />
      <span class="mst__track" aria-hidden="true">
        <span class="mst__thumb">
          <span class="mst__check" aria-hidden="true"></span>
        </span>
        <span class="mst__ripple" data-mst-ripple aria-hidden="true"></span>
      </span>
      <span class="mst__label">Sync enabled</span>
    </label>
  </div>

  <div class="mst__row">
    <label class="mst__switch mst__switch--disabled">
      <input class="mst__input" type="checkbox" disabled />
      <span class="mst__track" aria-hidden="true">
        <span class="mst__thumb">
          <span class="mst__check" aria-hidden="true"></span>
        </span>
      </span>
      <span class="mst__label">Restricted</span>
    </label>
  </div>

  <p class="mst__status" role="status" aria-live="polite" data-mst-status>
    Toggle the interactive switch with pointer or Space.
  </p>
</div>
