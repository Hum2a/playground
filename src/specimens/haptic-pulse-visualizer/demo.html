<div class="hpv" data-hpv data-phase="idle">
  <p class="hpv__live" data-hpv-live aria-live="polite">Haptic visualizer idle.</p>
  <p class="hpv__system">DUALSENSE // HAPTIC PULSE</p>
  <div class="hpv__stage">
    <div class="hpv__pulse-host">
      <button type="button" class="hpv__btn-pulse" data-hpv-pulse aria-label="Pulse action">ACTION</button>
      <span class="hpv__wave hpv__wave--1" data-wave="1" aria-hidden="true"></span>
      <span class="hpv__wave hpv__wave--2" data-wave="2" aria-hidden="true"></span>
      <span class="hpv__wave hpv__wave--3" data-wave="3" aria-hidden="true"></span>
    </div>
    <p class="hpv__status" data-hpv-status>READY</p>
    <p class="hpv__hint" data-hpv-hint>Press action or Run for pulses.</p>
  </div>
  <div class="hpv__controls">
    <button type="button" class="hpv__btn hpv__btn--primary" data-hpv-run>Run</button>
    <button type="button" class="hpv__btn" data-hpv-replay>Replay</button>
  </div>
</div>
