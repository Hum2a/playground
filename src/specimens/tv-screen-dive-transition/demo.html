<div class="tsd" data-tsd data-phase="idle">
  <p class="tsd__live" data-tsd-live aria-live="polite">Awaiting dive.</p>

  <div class="tsd__stage" data-tsd-stage>
    <div class="tsd__layer tsd__layer--from" data-tsd-from>
      <p class="tsd__eyebrow">REAL WORLD</p>
      <p class="tsd__label">INVESTIGATION UI</p>
      <p class="tsd__hint">Signal channel open.</p>
    </div>
    <div class="tsd__aperture" data-tsd-aperture aria-hidden="true"></div>
    <div class="tsd__layer tsd__layer--to" data-tsd-to>
      <p class="tsd__eyebrow">TV WORLD</p>
      <p class="tsd__label">DEPTH SIGNAL</p>
      <p class="tsd__hint">Destination emerged.</p>
    </div>
  </div>

  <div class="tsd__controls">
    <button type="button" class="tsd__btn tsd__btn--primary" data-tsd-run>Dive</button>
    <button type="button" class="tsd__btn" data-tsd-replay>Replay</button>
  </div>
</div>
