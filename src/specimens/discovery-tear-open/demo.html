<div class="discovery-tear-demo" data-discovery-tear-demo>
  <div class="discovery-tear" data-discovery-tear>
    <div
      class="discovery-tear__secret"
      data-discovery-tear-secret
      aria-hidden="true"
    >
      <p class="discovery-tear__secret-title">SECRET SPECIMEN</p>
      <p class="discovery-tear__secret-body">You found it.</p>
    </div>

    <div class="discovery-tear__cover" data-discovery-tear-cover>
      <div class="discovery-tear__peek" aria-hidden="true"></div>

      <div class="discovery-tear__paper" data-discovery-tear-paper>
        <p class="discovery-tear__code">ARCHIVE // 042</p>
        <p class="discovery-tear__blurb">Nothing unusual here.</p>
      </div>

      <div class="discovery-tear__flap discovery-tear__flap--a" aria-hidden="true"></div>
      <div class="discovery-tear__flap discovery-tear__flap--b" aria-hidden="true"></div>
      <div class="discovery-tear__flap discovery-tear__flap--c" aria-hidden="true"></div>

      <button
        type="button"
        class="discovery-tear__corner"
        data-discovery-tear-trigger
        aria-label="Reveal hidden content"
      >
        <span class="discovery-tear__corner-tip" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <p class="discovery-tear-demo__status" data-discovery-tear-status aria-live="polite">
    Surface intact
  </p>
  <button type="button" class="discovery-tear-demo__reset" data-discovery-tear-reset>
    Reset
  </button>
</div>
