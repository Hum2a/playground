<div class="pbt" data-pbt data-phase="idle">
  <p class="pbt__live" data-pbt-live aria-live="polite">Analysis in progress.</p>

  <div class="pbt__stage" data-pbt-stage>
    <div class="pbt__under" aria-hidden="false">
      <p class="pbt__eyebrow">STATUS // OUTPUT</p>
      <p class="pbt__headline">COMPLETE</p>
    </div>

    <div class="pbt__shards" data-pbt-shards aria-hidden="true">
      <div class="pbt__shard pbt__shard--a"><span>ANALYSIS</span></div>
      <div class="pbt__shard pbt__shard--b"><span>ANALYSIS</span></div>
      <div class="pbt__shard pbt__shard--c"><span>ANALYSIS</span></div>
      <div class="pbt__shard pbt__shard--d"><span>ANALYSIS</span></div>
    </div>
  </div>

  <div class="pbt__controls">
    <button type="button" class="pbt__btn pbt__btn--primary" data-pbt-run>Run</button>
    <button type="button" class="pbt__btn" data-pbt-replay>Replay</button>
  </div>
</div>
