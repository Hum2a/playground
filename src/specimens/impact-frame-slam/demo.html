<div class="ifs" data-ifs data-phase="idle">
  <p class="ifs__live" data-ifs-live aria-live="polite">Status standby.</p>

  <div class="ifs__stage" data-ifs-stage>
    <div class="ifs__impact" data-ifs-impact aria-hidden="true"></div>

    <div class="ifs__panel" data-ifs-panel>
      <p class="ifs__eyebrow">SYSTEM // FEEDBACK</p>
      <div class="ifs__status" data-ifs-status>
        <span class="ifs__word ifs__word--from" data-ifs-from>STANDBY</span>
        <span class="ifs__word ifs__word--to" data-ifs-to aria-hidden="true">ALERT</span>
      </div>
      <p class="ifs__note" data-ifs-note>Awaiting trigger.</p>
    </div>

    <div class="ifs__wedges" aria-hidden="true">
      <span class="ifs__wedge ifs__wedge--tl"></span>
      <span class="ifs__wedge ifs__wedge--tr"></span>
      <span class="ifs__wedge ifs__wedge--bl"></span>
      <span class="ifs__wedge ifs__wedge--br"></span>
    </div>
  </div>

  <div class="ifs__controls">
    <button type="button" class="ifs__btn ifs__btn--primary" data-ifs-run>Run</button>
    <button type="button" class="ifs__btn" data-ifs-replay>Replay</button>
  </div>
</div>
