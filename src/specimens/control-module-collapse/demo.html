<div class="cmc" data-control-module-collapse data-phase="expanded">
  <div class="cmc__module" data-cmc-module>
    <div class="cmc__expanded" data-cmc-expanded>
      <header class="cmc__header">
        <span class="cmc__label">NETWORK</span>
      </header>
      <div class="cmc__row" data-cmc-row="latency">
        <span class="cmc__key">LATENCY</span>
        <span class="cmc__val">18ms</span>
      </div>
      <div class="cmc__row" data-cmc-row="route">
        <span class="cmc__key">ROUTE</span>
        <span class="cmc__val">PRIMARY</span>
      </div>
      <div class="cmc__row" data-cmc-row="status">
        <span class="cmc__key">STATUS</span>
        <span class="cmc__val" data-cmc-status-val>CONNECTED</span>
      </div>
      <button type="button" class="cmc__collapse-btn" data-cmc-collapse>COLLAPSE</button>
    </div>

    <button type="button" class="cmc__compact" data-cmc-compact hidden aria-label="Network connected">
      <span class="cmc__node" data-cmc-node aria-hidden="true"></span>
      <span class="cmc__compact-text">NETWORK // CONNECTED</span>
    </button>
  </div>

  <p class="cmc__status" role="status" aria-live="polite" data-cmc-status>
    Expanded NETWORK module — STATUS CONNECTED, ROUTE PRIMARY, LATENCY 18ms.
  </p>
</div>
