<div class="esr" data-esr data-state="enhanced" data-channels="8">
  <header class="esr__head">
    <p class="esr__system">ENGINE // 07</p>
    <p class="esr__mode" data-esr-mode>ENHANCED</p>
  </header>

  <p class="esr__status" data-esr-status role="status" aria-live="polite">
    Stage III enhanced. Eight channels active. Forty-two tasks completed.
  </p>

  <div class="esr__stage">
    <div class="esr__component" data-esr-component aria-hidden="true">
      <span class="esr__field" data-esr-field></span>
      <span class="esr__shell"></span>
      <span class="esr__core"></span>
      <span class="esr__channel" data-esr-ch="1"></span>
      <span class="esr__channel" data-esr-ch="2"></span>
      <span class="esr__channel" data-esr-ch="3"></span>
      <span class="esr__channel" data-esr-ch="4"></span>
      <span class="esr__channel" data-esr-ch="5"></span>
      <span class="esr__channel" data-esr-ch="6"></span>
      <span class="esr__channel" data-esr-ch="7"></span>
      <span class="esr__channel" data-esr-ch="8"></span>
    </div>

    <dl class="esr__metrics">
      <div class="esr__row">
        <dt>STATE</dt>
        <dd data-esr-state>STAGE III</dd>
      </div>
      <div class="esr__row">
        <dt>CAPACITY</dt>
        <dd data-esr-capacity>4.0×</dd>
      </div>
      <div class="esr__row">
        <dt>CHANNELS</dt>
        <dd data-esr-channels>8</dd>
      </div>
      <div class="esr__row esr__row--persist">
        <dt>TASKS DONE</dt>
        <dd data-esr-tasks>42</dd>
      </div>
    </dl>
  </div>

  <div class="esr__controls">
    <button type="button" class="esr__btn" data-esr-revert>REVERT</button>
    <button type="button" class="esr__btn esr__btn--ghost" data-esr-reset>RESET</button>
  </div>
</div>
