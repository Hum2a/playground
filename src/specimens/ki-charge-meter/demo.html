<div class="kcm" data-ki-charge-meter data-state="idle">
  <div class="kcm__head">
    <p class="kcm__operation">BUILD // RELEASE</p>
    <p class="kcm__percent" data-kcm-percent>0%</p>
  </div>

  <div class="kcm__field" data-kcm-field aria-hidden="true">
    <div class="kcm__node" data-kcm-node>
      <span class="kcm__node-diamond"></span>
      <span class="kcm__line kcm__line--n"></span>
      <span class="kcm__line kcm__line--e"></span>
      <span class="kcm__line kcm__line--s"></span>
      <span class="kcm__line kcm__line--w"></span>
    </div>
  </div>

  <p class="kcm__progress-text" data-kcm-progress-text>
    Progress: 0%. Status: charging.
  </p>
  <button type="button" class="kcm__btn" data-kcm-charge>CHARGE</button>
  <div class="kcm__status" role="status" aria-live="polite" data-kcm-status></div>
</div>
