<div class="ps" data-ps="resume-from-rest-wake">
  <p class="ps__eyebrow">Resume-from-Rest Wake</p>
  <div class="ps__stage rfw__stage" data-rfw-stage data-phase="asleep">
    <div class="ps__grid" data-rfw-grid aria-hidden="true">
      <div class="ps__card"></div>
      <div class="ps__card is-focus" data-rfw-focus></div>
      <div class="ps__card"></div>
    </div>
    <div class="rfw__veil" data-rfw-veil aria-hidden="true"></div>
    <div class="ps__halo rfw__halo" data-rfw-halo aria-hidden="true"></div>
  </div>
  <button type="button" class="ps__btn" data-rfw-wake>WAKE</button>
  <p class="ps__status" data-rfw-status aria-live="polite">Rest mode — interface dimmed, focus memory retained.</p>
</div>
