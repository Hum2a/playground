<div class="ae" data-achievement-encounter>
  <button
    type="button"
    class="ae__trigger"
    data-achievement-encounter-trigger
  >
    UNLOCK ACHIEVEMENT
  </button>

  <div class="ae__overlay" data-achievement-encounter-overlay hidden>
    <div class="ae__streaks" aria-hidden="true">
      <span class="ae__streak ae__streak--1"></span>
      <span class="ae__streak ae__streak--2"></span>
      <span class="ae__streak ae__streak--3"></span>
      <span class="ae__streak ae__streak--4"></span>
      <span class="ae__streak ae__streak--5"></span>
      <span class="ae__streak ae__streak--6"></span>
      <span class="ae__streak ae__streak--7"></span>
      <span class="ae__streak ae__streak--8"></span>
    </div>

    <div class="ae__arena" aria-hidden="true">
      <div class="ae__sky"></div>
      <div class="ae__grass"></div>
      <div class="ae__platform"></div>
    </div>

    <div class="ae__badge" aria-hidden="true">
      <div class="ae__badge-ring"></div>
      <div class="ae__badge-core">
        <span class="ae__badge-star">★</span>
        <span class="ae__badge-code">ACHV-07</span>
      </div>
      <div class="ae__badge-flash"></div>
    </div>

    <div class="ae__message" aria-hidden="true">
      <p class="ae__message-line">A RARE ACHIEVEMENT APPEARED!</p>
      <p class="ae__message-title">EARLY ADOPTER</p>
    </div>
  </div>

  <div
    class="ae__status"
    role="status"
    aria-live="polite"
    data-achievement-encounter-status
  ></div>
</div>
