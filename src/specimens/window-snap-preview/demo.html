  <div class="wsp__desktop" data-wsp-desktop>
    <div class="wsp__preview" data-wsp-preview hidden aria-hidden="true"></div>
    <div class="wsp__window" data-wsp-window tabindex="0" aria-label="EDITOR window">
      <span class="wsp__traffic" aria-hidden="true">
        <span></span><span></span><span></span>
