<div class="csl8" data-csl8 data-phase="idle">
  <p class="csl8__live" data-csl8-live aria-live="polite">Circular Seal Lock. Idle.</p>
  <p class="csl8__system">NR // NR-032</p>
  <div class="csl8__stage" data-csl8-stage>
    <div class="csl8__viz" data-csl8-viz aria-hidden="true">
      <span class="csl8__mark csl8__mark--a"></span>
      <span class="csl8__mark csl8__mark--b"></span>
      <span class="csl8__mark csl8__mark--c"></span>
    </div>
    <p class="csl8__status" data-csl8-status>IDLE</p>
    <p class="csl8__note" data-csl8-note>Radial marks rotate into a locked circular seal.</p>
  </div>
  <div class="csl8__controls">
    <button type="button" class="csl8__btn csl8__btn--primary" data-csl8-run>Lock</button>
    <button type="button" class="csl8__btn" data-csl8-replay>Replay</button>
  </div>
</div>
