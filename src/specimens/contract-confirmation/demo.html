<div class="ccn" data-ccn data-phase="idle">
  <p class="ccn__live" data-ccn-live aria-live="polite">Contract pending.</p>
  <div class="ccn__panel" aria-hidden="true">
    <div class="ccn__piece ccn__piece--header" data-ccn-piece>AGREEMENT</div>
    <div class="ccn__piece ccn__piece--body" data-ccn-piece>Parties accept mutual terms.</div>
    <div class="ccn__piece ccn__piece--line" data-ccn-piece></div>
    <div class="ccn__seal" data-ccn-seal>SEAL</div>
  </div>
  <div class="ccn__controls">
    <button type="button" class="ccn__btn ccn__btn--primary" data-ccn-sign>SIGN</button>
    <button type="button" class="ccn__btn" data-ccn-reset>RESET</button>
  </div>
</div>
