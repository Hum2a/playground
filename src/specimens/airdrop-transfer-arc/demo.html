<div class="ata" data-airdrop-transfer-arc data-phase="idle">
  <div class="ata__stage" data-ata-stage>
    <div class="ata__device ata__device--source" data-ata-source>
      <span class="ata__device-label">THIS DEVICE</span>
      <div class="ata__file" data-ata-file>
        <span class="ata__file-name">REPORT.PDF</span>
        <span class="ata__file-size">4.2MB</span>
      </div>
    </div>

    <div class="ata__device ata__device--recipient" data-ata-recipient>
      <span class="ata__bracket ata__bracket--tl" aria-hidden="true"></span>
      <span class="ata__bracket ata__bracket--tr" aria-hidden="true"></span>
      <span class="ata__bracket ata__bracket--bl" aria-hidden="true"></span>
      <span class="ata__bracket ata__bracket--br" aria-hidden="true"></span>
      <span class="ata__device-label">DEVICE // B</span>
      <span class="ata__status" data-ata-recipient-status>AVAILABLE</span>
    </div>

    <div class="ata__proxy" data-ata-proxy hidden aria-hidden="true">
      <span>REPORT.PDF</span>
    </div>
  </div>

  <div class="ata__progress" data-ata-progress hidden>
    <span data-ata-progress-val>0</span>%
  </div>

  <button type="button" class="ata__send" data-ata-send>SEND</button>

  <p class="ata__status-line" role="status" aria-live="polite" data-ata-status>
    REPORT.PDF ready. Recipient DEVICE // B is AVAILABLE.
  </p>
</div>
