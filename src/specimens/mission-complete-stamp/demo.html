<div class="mcs" data-mcs data-phase="idle">
  <p class="mcs__live" data-mcs-live aria-live="polite">
    Mission briefing pending. No completion stamp filed.
  </p>

  <p class="mcs__system">MISSION // BRIEFING</p>

  <div class="mcs__stage" data-mcs-stage>
    <div class="mcs__card">
      <p class="mcs__card-title">Escort the Bridge Builder</p>
      <ul class="mcs__objectives">
        <li>Reach the border checkpoint</li>
        <li>Neutralise ambush team</li>
        <li>Deliver client to the site</li>
      </ul>
      <span class="mcs__stamp" data-mcs-stamp aria-hidden="true">COMPLETE</span>
    </div>
    <p class="mcs__status" data-mcs-status>PENDING</p>
    <p class="mcs__hint" data-mcs-hint>Press Run to file the completion stamp.</p>
  </div>

  <div class="mcs__controls">
    <button type="button" class="mcs__btn mcs__btn--primary" data-mcs-run>Run</button>
    <button type="button" class="mcs__btn" data-mcs-replay>Replay</button>
  </div>
</div>
