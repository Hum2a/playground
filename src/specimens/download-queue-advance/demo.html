<div class="dqa" data-dqa data-phase="idle">
  <p class="dqa__live" data-dqa-live aria-live="polite">Queue idle. Item one active.</p>
  <p class="dqa__system">DOWNLOAD // QUEUE</p>
  <div class="dqa__stage">
    <ol class="dqa__queue" aria-label="Download queue">
      <li class="dqa__item" data-dqa-item data-index="0" data-state="active">
        <span class="dqa__item-label">Title A</span>
        <span class="dqa__item-bar"><span class="dqa__item-fill" data-fill></span></span>
        <span class="dqa__item-state">ACTIVE</span>
      </li>
      <li class="dqa__item" data-dqa-item data-index="1" data-state="waiting">
        <span class="dqa__item-label">Title B</span>
        <span class="dqa__item-bar"><span class="dqa__item-fill" data-fill></span></span>
        <span class="dqa__item-state">WAITING</span>
      </li>
      <li class="dqa__item" data-dqa-item data-index="2" data-state="waiting">
        <span class="dqa__item-label">Title C</span>
        <span class="dqa__item-bar"><span class="dqa__item-fill" data-fill></span></span>
        <span class="dqa__item-state">WAITING</span>
      </li>
    </ol>
    <p class="dqa__status" data-dqa-status>IN QUEUE</p>
    <p class="dqa__hint" data-dqa-hint>Press Run to advance queue.</p>
  </div>
  <div class="dqa__controls">
    <button type="button" class="dqa__btn dqa__btn--primary" data-dqa-run>Run</button>
    <button type="button" class="dqa__btn" data-dqa-replay>Replay</button>
  </div>
</div>
