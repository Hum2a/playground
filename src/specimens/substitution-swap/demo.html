<div class="ss7" data-ss7 data-phase="idle">
  <p class="ss7__live" data-ss7-live aria-live="polite">Substitution Swap. Idle.</p>
  <p class="ss7__system">NR // NR-042</p>
  <div class="ss7__stage" data-ss7-stage>
    <div class="ss7__viz" data-ss7-viz aria-hidden="true">
      <span class="ss7__mark ss7__mark--a"></span>
      <span class="ss7__mark ss7__mark--b"></span>
      <span class="ss7__mark ss7__mark--c"></span>
    </div>
    <p class="ss7__status" data-ss7-status>IDLE</p>
    <p class="ss7__note" data-ss7-note>Primary content swaps to a decoy log then resolves to the real target.</p>
  </div>
  <div class="ss7__controls">
    <button type="button" class="ss7__btn ss7__btn--primary" data-ss7-run>Swap</button>
    <button type="button" class="ss7__btn" data-ss7-replay>Replay</button>
  </div>
</div>
