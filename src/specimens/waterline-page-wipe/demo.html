<div class="wl" data-waterline-wipe data-phase="idle" data-surface="a">
  <div class="wl__host" data-wl-host>
    <section class="wl__state wl__state--a" data-wl-state="a">
      <p class="wl__kicker">SURFACE // 01</p>
      <h2 class="wl__title">DAY</h2>
    </section>
    <section class="wl__state wl__state--b" data-wl-state="b" hidden>
      <p class="wl__kicker">SURFACE // 02</p>
      <h2 class="wl__title">NIGHT</h2>
    </section>

    <div class="wl__refract" data-wl-refract aria-hidden="true">
      <div class="wl__refract-shift">
        <p class="wl__refract-kicker" data-wl-refract-kicker>SURFACE // 01</p>
        <p class="wl__refract-title" data-wl-refract-title>DAY</p>
      </div>
    </div>

    <div class="wl__water" data-wl-water aria-hidden="true">
      <div class="wl__mass" data-wl-mass>
        <span class="wl__lobe wl__lobe--1"></span>
        <span class="wl__lobe wl__lobe--2"></span>
        <span class="wl__lobe wl__lobe--3"></span>
        <span class="wl__lobe wl__lobe--4"></span>
        <span class="wl__lobe wl__lobe--5"></span>
        <span class="wl__lobe wl__lobe--6"></span>
        <span class="wl__body"></span>
        <span class="wl__foam"></span>
      </div>
    </div>
  </div>

  <div class="wl__controls">
    <button type="button" class="wl__trigger" data-wl-trigger>SUBMERGE</button>
  </div>

  <p class="wl__status" role="status" aria-live="polite" data-wl-status>
    Surface 01. Day.
  </p>
</div>
