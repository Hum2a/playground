<div class="ssr" data-ssr data-phase="polished">
  <p class="ssr__live" data-ssr-live aria-live="polite">Polished profile visible.</p>

  <div class="ssr__card" data-ssr-card>
    <div class="ssr__polished" data-ssr-polished>
      <p class="ssr__eyebrow">PROFILE // PUBLIC</p>
      <p class="ssr__name">UNIT READY</p>
      <p class="ssr__trait">Composed · Verified</p>
    </div>
    <div class="ssr__shadow" data-ssr-shadow aria-hidden="true">
      <p class="ssr__eyebrow">SHADOW // TRUE</p>
      <p class="ssr__name">DENIED SIGNAL</p>
      <p class="ssr__trait">Raw · Unfiltered</p>
    </div>
    <div class="ssr__cracks" data-ssr-cracks aria-hidden="true">
      <span class="ssr__crack ssr__crack--1"></span>
      <span class="ssr__crack ssr__crack--2"></span>
      <span class="ssr__crack ssr__crack--3"></span>
    </div>
  </div>

  <div class="ssr__controls">
    <button type="button" class="ssr__btn ssr__btn--primary" data-ssr-run>Fracture</button>
    <button type="button" class="ssr__btn" data-ssr-reset>Reset</button>
  </div>
</div>
