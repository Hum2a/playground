<div class="vhtc2" data-vhtc2 data-phase="idle">
  <p class="vhtc2__live" data-vhtc2-live aria-live="polite">Vortex Hold-to-Confirm. Idle.</p>
  <p class="vhtc2__system">NR // NR-139</p>
  <div class="vhtc2__stage" data-vhtc2-stage>
    <div class="vhtc2__viz" data-vhtc2-viz aria-hidden="true">
      <span class="vhtc2__mark vhtc2__mark--a"></span>
      <span class="vhtc2__mark vhtc2__mark--b"></span>
      <span class="vhtc2__mark vhtc2__mark--c"></span>
    </div>
    <p class="vhtc2__status" data-vhtc2-status>IDLE</p>
    <p class="vhtc2__note" data-vhtc2-note>Hold builds a vortex; release confirms the action.</p>
  </div>
  <div class="vhtc2__controls">
    <button type="button" class="vhtc2__btn vhtc2__btn--primary" data-vhtc2-run>Hold</button>
    <button type="button" class="vhtc2__btn" data-vhtc2-replay>Replay</button>
  </div>
</div>
